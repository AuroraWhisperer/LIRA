<section
  id="otherAudioAssistantFeature"
  class="other-feature-panel"
  role="tabpanel"
  aria-labelledby="otherAudioAssistantFeatureTab"
  data-other-feature-panel
  hidden
>
  <div class="other-feature-panel-body audio-assistant-settings">
    <header class="audio-assistant-heading">
      <h2 class="sr-only">电音助手</h2>
      <div class="audio-assistant-placement">
        <div class="audio-assistant-label"><span>快捷入口</span><lira-help label="快捷入口说明">点击按钮开启助手并展开面板。侧边入口可拖动，贴边自动收起。</lira-help></div>
        <div class="audio-assistant-placement-options" role="group" aria-label="快捷入口样式">
          <button type="button" data-audio-placement="top" aria-pressed="false" aria-controls="audioAssistantPanel">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" /><path d="M3 9h18" /></svg>
            顶部图标
          </button>
          <button type="button" data-audio-placement="side" aria-pressed="false" aria-controls="audioAssistantPanel">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" /><path d="M15 4v16" /></svg>
            侧边悬浮
          </button>
        </div>
      </div>
      <label class="switch-control">
        <span id="audioAssistantEnabledLabel">开启助手</span>
        <input id="audioAssistantEnabled" type="checkbox" aria-labelledby="audioAssistantEnabledLabel" />
        <span class="switch-track"></span>
        <span id="audioAssistantEnabledState" class="sr-only">已关闭</span>
      </label>
    </header>
    <div class="audio-assistant-workspace">
      <section class="audio-assistant-routing" aria-labelledby="audioAssistantRoutingTitle">
        <h3 id="audioAssistantRoutingTitle">声音与设备</h3>
        <div class="audio-assistant-field">
          <label for="audioAssistantSource">声音来源</label>
          <select id="audioAssistantSource" data-audio-setting="source"><option value="auto">自动识别正在播放的音乐（推荐）</option><option value="file">本地文件</option><option value="input">麦克风、线路或声卡回送</option><option value="loopback">播放设备里的声音</option></select>
          <div id="audioAssistantFileRow" class="audio-assistant-file" hidden>
            <button type="button" class="secondary" data-audio-action="file">选择歌曲</button>
            <span id="audioAssistantFileName" class="hint">尚未选择</span>
          </div>
        </div>
        <div id="audioAssistantDeviceInput" class="audio-assistant-field" hidden>
          <label for="audioAssistantInput">输入设备</label>
          <select id="audioAssistantInput" data-audio-setting="inputId" aria-describedby="audioAssistantInputHint"><option value="">Windows 默认设备</option></select>
          <p id="audioAssistantInputHint" class="hint"></p>
          <label for="audioAssistantInputChannels">输入声道</label>
          <select id="audioAssistantInputChannels" data-audio-setting="inputChannels"><option value="auto">自动</option></select>
          <span id="audioAssistantInputFormat" class="hint"></span>
          <label class="audio-assistant-original"><input type="checkbox" data-audio-setting="inputMusic" /><span>音乐处理</span><lira-help label="音乐处理说明">输入的是歌曲时才开启，可使用声伴比例。麦克风默认保留人声；升降调和输出音量仍可使用。切换前先停止处理。</lira-help></label>
        </div>
        <div class="audio-assistant-now-playing">
          <span class="hint" data-audio-source-label>当前歌曲</span>
          <strong data-audio-song>等待播放器播放歌曲</strong>
          <span id="audioAssistantSourceDevice" class="hint"></span>
        </div>
        <div id="audioAssistantIsolation" class="audio-assistant-field">
          <div class="audio-assistant-label"><label for="audioAssistantCable">原声通道</label><lira-help label="原声通道说明" tooltip-id="audioAssistantCableHint">与音乐播放器的输出通道保持一致。使用 LIRA 内置播放器时，在「百宝箱 → 设置 → 内置播放器输出」中选择同一通道。这里会接收并静音播放器原声，须使用能独立静音的播放输出（Out），不能与最终输出相同。</lira-help></div>
          <select id="audioAssistantCable" data-audio-setting="cableId" aria-describedby="audioAssistantCableHint"><option value="" disabled selected>请选择独立通道</option></select>
        </div>
        <div class="audio-assistant-field">
          <div class="audio-assistant-label"><label for="audioAssistantOutput">最终输出</label><lira-help label="最终输出说明" tooltip-id="audioAssistantOutputHint">处理后的声音从这里输出，选择实际监听或送入直播的通道。采集播放器或播放设备时，最终输出须与原声通道或被采集设备不同。播放器已经设为原声通道时，请手动选择另一个设备。</lira-help></div>
          <select id="audioAssistantOutput" data-audio-setting="outputId" aria-describedby="audioAssistantOutputHint"><option value="">自动跟随播放器原输出</option></select>
        </div>
        <div class="audio-assistant-device-actions">
          <button type="button" class="secondary" data-audio-action="refresh">刷新设备</button>
          <button type="button" class="secondary" data-audio-action="recover">恢复原声</button>
          <button type="button" class="secondary" data-audio-action="mixer">音量混合器</button>
        </div>
      </section>
      <section class="audio-assistant-sound" aria-labelledby="audioAssistantSoundTitle">
        <div class="audio-assistant-section-heading">
          <h3 id="audioAssistantSoundTitle">声音调节</h3>
          <div class="audio-assistant-sound-actions">
            <button type="button" class="secondary" data-audio-action="reset">一键重置</button>
            <label class="switch-control"><span data-audio-active-label>当前歌曲</span><input type="checkbox" data-audio-active aria-label="处理当前歌曲" aria-describedby="audioAssistantStatus" /><span class="switch-track"></span></label>
          </div>
        </div>
        <div class="audio-assistant-statusbar">
          <p id="audioAssistantStatus" data-audio-status role="status">音频组件未就绪</p>
          <div class="audio-assistant-levels">
            <span>输入<span class="audio-assistant-meter" data-audio-level="inputLevel" role="meter" aria-label="输入电平" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></span></span>
            <span>输出<span class="audio-assistant-meter" data-audio-level="level" role="meter" aria-label="输出电平" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></span></span>
          </div>
        </div>
        <div data-audio-controls="full"></div>
        <label class="audio-assistant-original"><input type="checkbox" data-audio-setting="original" /><span>原声对比</span><lira-help label="原声对比说明">临时跳过声伴处理、变速与升降调；输出音量仍生效。</lira-help></label>
      </section>
    </div>
  </div>
</section>
