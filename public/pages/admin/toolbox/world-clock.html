<section id="otherWorldClockFeature" class="other-feature-panel world-clock-panel" role="tabpanel" aria-labelledby="otherWorldClockFeatureTab" data-other-feature-panel hidden>
  <svg class="world-clock-symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="world-clock-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
    <symbol id="world-clock-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
    <symbol id="world-clock-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
    <symbol id="world-clock-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m16 16 4.5 4.5" /></symbol>
    <symbol id="world-clock-rotate" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7" /></symbol>
    <symbol id="world-clock-focus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" /><path d="M12 2v4M12 18v4M2 12h4M18 12h4" /><circle cx="12" cy="12" r="1" /></symbol>
    <symbol id="world-clock-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2m-3-9-1.5 1.5M7.5 16.5 6 18m12 0-1.5-1.5M7.5 7.5 6 6" /></symbol>
    <symbol id="world-clock-moon" viewBox="0 0 24 24"><path d="M20.5 13a8.5 8.5 0 0 1-9.5-9.5A8.5 8.5 0 1 0 20.5 13Z" /></symbol>
    <symbol id="world-clock-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
  </svg>
  <div class="world-clock-toolbar">
    <label class="world-clock-search">
      <svg aria-hidden="true"><use href="#world-clock-search" /></svg>
      <input type="search" data-world-clock="filter" placeholder="筛选城市" aria-label="筛选已添加的城市" autocomplete="off" />
    </label>
    <div class="world-clock-actions">
      <div class="world-clock-format" role="group" aria-label="时间格式">
        <button type="button" data-world-clock-format="24" aria-pressed="true">24 小时</button>
        <button type="button" data-world-clock-format="12" aria-pressed="false">12 小时</button>
      </div>
      <button type="button" class="primary world-clock-add" data-world-clock="add"><svg aria-hidden="true"><use href="#world-clock-plus" /></svg>添加城市</button>
    </div>
  </div>
  <div class="world-clock-body">
    <div class="world-clock-list" data-world-clock="list" aria-label="城市时钟"></div>
    <div class="world-clock-world">
      <div class="world-clock-stage">
        <canvas data-world-clock="globe" aria-label="地球：拖动或方向键旋转，滚轮或加减键缩放" tabindex="0"></canvas>
        <div class="world-clock-markers" data-world-clock="markers" aria-label="地球上的城市"></div>
        <p class="world-clock-message" data-world-clock="message" role="status">正在加载地球…</p>
      </div>
      <section class="world-clock-details" data-world-clock="details" aria-labelledby="worldClockDetailsTitle" tabindex="-1" hidden>
        <div class="world-clock-details-heading">
          <div><h2 id="worldClockDetailsTitle" data-world-clock="name"></h2><p data-world-clock="country"></p></div>
          <button type="button" class="icon" data-world-clock="details-close" aria-label="关闭城市详情"><svg aria-hidden="true"><use href="#world-clock-close" /></svg></button>
        </div>
        <div class="world-clock-details-time"><time data-world-clock="time"></time><span data-world-clock="period"></span></div>
        <p class="world-clock-details-date" data-world-clock="date"></p>
        <dl class="world-clock-details-meta">
          <div><dt>时区</dt><dd data-world-clock="zone"></dd></div>
          <div><dt>UTC 偏移</dt><dd data-world-clock="offset"></dd></div>
        </dl>
        <p class="world-clock-difference" data-world-clock="difference"></p>
      </section>
      <div class="world-clock-globe-controls" role="group" aria-label="地球控制">
        <button type="button" class="icon" data-world-clock="zoom-out" aria-label="缩小地球" title="缩小"><svg aria-hidden="true"><use href="#world-clock-minus" /></svg></button>
        <button type="button" class="icon" data-world-clock="zoom-in" aria-label="放大地球" title="放大"><svg aria-hidden="true"><use href="#world-clock-plus" /></svg></button>
        <button type="button" class="icon" data-world-clock="rotate" aria-label="自动旋转" aria-pressed="false" title="自动旋转"><svg aria-hidden="true"><use href="#world-clock-rotate" /></svg></button>
        <button type="button" class="icon" data-world-clock="focus" aria-label="定位当前城市" title="定位当前城市"><svg aria-hidden="true"><use href="#world-clock-focus" /></svg></button>
      </div>
    </div>
  </div>
  <dialog class="world-clock-dialog" data-world-clock="dialog" aria-labelledby="worldClockAddTitle">
    <div class="world-clock-dialog-header"><h2 id="worldClockAddTitle">添加城市</h2><button type="button" class="icon" data-world-clock="close" aria-label="关闭添加城市"><svg aria-hidden="true"><use href="#world-clock-close" /></svg></button></div>
    <label class="world-clock-search"><svg aria-hidden="true"><use href="#world-clock-search" /></svg><input type="search" data-world-clock="search" placeholder="搜索城市或国家" aria-label="搜索可添加的城市" autocomplete="off" /></label>
    <div class="world-clock-results" data-world-clock="results"></div>
  </dialog>
</section>
