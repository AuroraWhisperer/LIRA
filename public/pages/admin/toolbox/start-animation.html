            <section
              id="otherStartAnimationFeature"
              class="other-feature-panel"
              role="tabpanel"
              aria-labelledby="otherStartAnimationFeatureTab"
              data-other-feature-panel
              hidden
            >
              <div class="opening-animation-panel">
                <header class="opening-animation-header">
                  <div>
                    <span class="opening-animation-kicker">STARTING SOON</span>
                    <h2>开播动画</h2>
                    <p>把粉黑甜心歌房放进浏览器源，编辑后即可预览整套开场特效。</p>
                  </div>
                  <label class="opening-master-toggle">
                    <input id="openingEnabled" type="checkbox" checked>
                    <span class="opening-master-toggle-ui" aria-hidden="true"></span>
                    <span>显示整套特效</span>
                  </label>
                </header>

                <div class="opening-animation-layout">
                  <form id="openingAnimationForm" class="opening-animation-editor" novalidate>
                    <div class="opening-editor-heading">
                      <div>
                        <span>画面文案</span>
                        <strong>编辑开播时的第一句话</strong>
                      </div>
                      <span class="opening-editor-chip">URL 即时预览</span>
                    </div>
                    <label>主标题<input id="openingTitle" name="title" maxlength="40" value="今晚唱给你听" autocomplete="off"></label>
                    <label>副标题<input id="openingSubtitle" name="subtitle" maxlength="40" value="开播准备中" autocomplete="off"></label>
                    <label>主播名<input id="openingName" name="name" maxlength="32" value="主播名" autocomplete="off"></label>
                    <label>底部文案<input id="openingFooter" name="footer" maxlength="48" value="SINGING LIVE" autocomplete="off"></label>
                    <label>画质<select id="openingQuality" name="quality">
                      <option value="normal" selected>普通 · 推荐</option>
                      <option value="high">高 · 更多氛围粒子</option>
                      <option value="low">低 · 轻量模式</option>
                    </select></label>
                    <div class="opening-editor-checks">
                      <label><input id="openingShowNotes" type="checkbox" checked>漂浮音符</label>
                      <label><input id="openingShowEq" type="checkbox" checked>音乐 EQ</label>
                    </div>
                    <p class="opening-editor-note">关闭总开关时仍会保留你的文案配置；复制新地址到 Browser Source 后才会应用。</p>
                  </form>

                  <section class="opening-animation-preview" aria-labelledby="openingPreviewHeading">
                    <div class="opening-preview-heading">
                      <div><span>LIVE PREVIEW</span><strong id="openingPreviewHeading">开播动画预览</strong></div>
                      <span id="openingPreviewState">已开启</span>
                    </div>
                    <iframe id="openingPreview" title="开播动画预览" loading="lazy"></iframe>
                  </section>
                </div>

                <div class="opening-animation-address">
                  <div>
                    <span>浏览器源地址</span>
                    <code id="openingUrl"></code>
                  </div>
                  <button id="openingCopyUrl" class="button-secondary" type="button">复制地址</button>
                </div>
                <p id="openingAnimationStatus" class="opening-animation-status" role="status" aria-live="polite">编辑文案或开关即可刷新预览。</p>
              </div>
            </section>
