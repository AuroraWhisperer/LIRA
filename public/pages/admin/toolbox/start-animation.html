<section
  id="otherStartAnimationFeature"
  class="other-feature-panel"
  role="tabpanel"
  aria-labelledby="otherStartAnimationFeatureTab"
  data-other-feature-panel
  hidden
>
  <div class="other-feature-panel-body opening-animation-panel">
    <div class="opening-animation-toolbar component-page-heading">
      <div class="opening-animation-title">
        <div>
          <h2>开播动画</h2>
        </div>
      </div>
      <label class="opening-master-toggle">
        <input id="openingEnabled" type="checkbox" disabled />
        <span class="opening-master-toggle-ui" aria-hidden="true"></span>
        <span class="opening-master-toggle-copy">
          <strong>显示整套特效（动画 + 音乐）</strong>
          <small>同时控制画布预览与直播画面</small>
        </span>
      </label>
    </div>

    <div id="openingLoadState">
      <p id="openingConfigStatus" class="opening-audio-status" role="status">正在读取开播配置…</p>
      <button id="openingReload" class="button-quiet" type="button" hidden>重新读取</button>
    </div>
    <section class="opening-style-picker" aria-label="动画样式">
      <div class="component-subsection-heading">
        <h3>动画样式</h3>
        <div class="component-heading-actions" data-style-library-actions></div>
      </div>
      <div id="openingStyleOptions" class="opening-style-options">
        <button type="button" data-opening-style="classic" aria-pressed="true" disabled>经典舞台</button>
        <button type="button" data-opening-style="pixel-cassette" aria-pressed="false" disabled>像素卡带</button>
      </div>
    </section>
    <div class="opening-animation-layout">
      <div class="opening-animation-editor">
        <form id="openingAnimationForm" novalidate>
          <div id="openingSaveFeedback" class="opening-section-heading" hidden>
            <span id="openingSaveStatus" class="opening-audio-status" role="status" aria-live="polite">修改自动保存</span>
            <button id="openingRetrySave" class="button-quiet" type="button" hidden>重试保存</button>
          </div>
          <div hidden><select id="openingStyle" name="style" aria-label="动画样式" hidden>
            <option value="classic" selected>经典舞台</option>
            <option value="pixel-cassette">像素卡带</option>
          </select></div>
          <p id="openingPixelHint" class="opening-audio-status" hidden>大头贴需单独上传，建议使用透明背景头像。</p>
        <div id="openingCopyHeading" class="opening-editor-heading">
          <div>
            <div class="opening-editor-title">
              <span>开场文案</span>
            </div>
          </div>
        </div>
        <div id="openingCopyFields" class="opening-copy-fields">
          <label class="opening-field-wide"
            ><span class="opening-field-label"
              ><span>主标题</span><output id="openingTitleCount" for="openingTitle">12/20</output></span
            ><input id="openingTitle" name="title" maxlength="20" value="唱一首，在一首，给你的歌" autocomplete="off"
          /></label>
          <label
            >副标题<input id="openingSubtitle" name="subtitle" maxlength="40" value="开播准备中" autocomplete="off"
          /></label>
          <label>主播名<input id="openingName" name="name" maxlength="32" value="" autocomplete="off" /></label>
          <label class="opening-field-wide"
            >底部文案<input id="openingFooter" name="footer" maxlength="48" value="欢迎来到直播间" autocomplete="off"
          /></label>
        </div>

        <section class="opening-editor-section" aria-labelledby="openingEffectsHeading">
          <div class="opening-section-heading">
            <strong id="openingEffectsHeading">画面效果</strong>
          </div>
          <div class="opening-select-grid">
            <label
              >画质<select id="openingQuality" name="quality">
                <option value="normal" selected>普通 · 推荐</option>
                <option value="high">高 · 更多氛围粒子</option>
                <option value="low">低 · 轻量模式</option>
              </select></label
            >
            <label id="openingTrackMotionField"
              >轨道动效<select id="openingTrackMotion" name="trackMotion">
                <option value="heart" selected>心形巡航</option>
                <option value="barber">灯带循环</option>
                <option value="progress">流光进度</option>
              </select></label
            >
          </div>
          <div class="opening-editor-checks">
            <label>
              <span id="openingNotesLabel" class="opening-switch-label">漂浮音符</span>
              <input id="openingShowNotes" type="checkbox" checked />
              <span class="opening-switch-ui" aria-hidden="true"></span>
            </label>
            <label>
              <span id="openingEqLabel" class="opening-switch-label">氛围律动</span>
              <input id="openingShowEq" type="checkbox" checked />
              <span class="opening-switch-ui" aria-hidden="true"></span>
            </label>
          </div>
        </section>

        <section id="openingCharacterSection" class="opening-music-card" aria-labelledby="openingCharacterHeading">
          <div class="opening-music-heading">
            <div>
              <strong id="openingCharacterHeading">人物图片</strong>
              <span id="openingCharacterName">未上传人物图</span>
            </div>
            <div class="opening-music-actions">
              <label class="opening-upload-button">
                <input
                  id="openingCharacterFile"
                  type="file"
                  accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp"
                />
                <span>上传图片</span>
              </label>
              <button id="openingResetCharacter" class="button-quiet" type="button">清除人物图</button>
            </div>
          </div>
          <p id="openingCharacterStatus" class="opening-audio-status" role="status" aria-live="polite">
            支持 PNG、JPG、WebP，最大 16 MB。
          </p>
        </section>

        <section class="opening-music-card" aria-labelledby="openingMusicHeading">
          <div class="opening-music-heading">
            <div>
              <strong id="openingMusicHeading">开场音乐</strong>
              <span id="openingAudioName">未上传音乐</span>
            </div>
            <div class="opening-music-actions">
              <label class="opening-upload-button">
                <input id="openingAudioFile" type="file" accept="audio/*,.mp3,.flac,.wav,.aac,.ogg,.m4a,.wma" />
                <span>上传歌曲</span>
              </label>
              <button id="openingResetAudio" class="button-quiet" type="button">清除音乐</button>
            </div>
          </div>
          <label class="opening-volume-field" for="openingAudioVolume">
            <span>音乐音量 <output id="openingAudioVolumeValue" for="openingAudioVolume">35%</output></span>
            <input id="openingAudioVolume" type="range" min="0" max="100" step="1" value="35" />
          </label>
          <p id="openingAudioStatus" class="opening-audio-status" role="status" aria-live="polite"></p>
        </section>
        </form>
        <div id="openingImportedSettings" hidden></div>
      </div>

      <section class="opening-animation-preview" aria-labelledby="openingPreviewHeading">
        <div class="opening-preview-heading">
          <div>
            <strong id="openingPreviewHeading">预览</strong>
          </div>
        </div>
        <button id="openingPreviewBtn" class="primary" type="button" disabled>预览</button>

        <div id="openingSourceAddress" class="opening-animation-address">
          <div>
            <span>直播画面链接</span>
            <code id="openingUrl"></code>
          </div>
          <button id="openingCopyUrl" class="button-secondary" type="button">复制地址</button>
        </div>
      </section>
    </div>
  </div>
</section>
