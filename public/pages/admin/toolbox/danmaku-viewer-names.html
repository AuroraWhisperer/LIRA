<section id="danmakuViewerNamesPanel" data-fixed-editor="names" hidden>
  <div class="daily-library-list-actions">
    <p class="hint">每个 UID 只保留一个昵称，再次改名会替换原昵称；每页 20 人。</p>
    <span id="danmakuViewerNamesCount" class="hint"></span>
    <button id="danmakuViewerNamesRefresh" class="danmaku-text-action" type="button" disabled>刷新名单</button>
  </div>
  <p id="danmakuViewerNamesEmpty" class="danmaku-blessing-empty" hidden>还没有观众设置昵称。在直播间发送“叫我 xx”即可设置。</p>
  <div id="danmakuViewerNamesList" class="danmaku-blessing-list"></div>
  <p id="danmakuViewerNamesNotice" class="hint" role="status"></p>
  <div id="danmakuViewerNamesPagination" class="danmaku-library-pagination" hidden>
    <button id="danmakuViewerNamesPrev" class="ghost" type="button" disabled>上一页</button>
    <span id="danmakuViewerNamesPageLabel" class="hint"></span>
    <button id="danmakuViewerNamesNext" class="ghost" type="button" disabled>下一页</button>
  </div>
</section>
