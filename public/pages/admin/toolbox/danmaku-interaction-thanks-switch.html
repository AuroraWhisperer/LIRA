<div class="danmaku-fixed-item" data-fixed-item="likeThanks">
  <div class="danmaku-fixed-copy">
    <div class="danmaku-fixed-item-heading">
      <strong id="danmakulikeThanksTitle">点赞感谢</strong><lira-help label="点赞感谢说明">直播中收到个人点赞推送时，随机选一条文案自动感谢（同一观众 30 秒内最多触发一次；B 站未提供具体互动人时不发送）。云端运行，关掉软件也生效。</lira-help>
    </div>
    <span id="danmakulikeThanksSummary" class="danmaku-fixed-summary">收到个人互动后自动感谢</span>
    <span id="danmakulikeThanksState" class="danmaku-fixed-note" role="status">正在读取云端设置…</span>
  </div>
  <button class="danmaku-fixed-open" type="button" data-fixed-open="likeThanks" aria-label="编辑点赞感谢词库" aria-controls="danmakulikeThanksPanel" aria-expanded="false" disabled>
    词库<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m6 8 4 4 4-4" /></svg>
  </button>
  <label class="switch-control"><input id="danmakulikeThanksToggle" type="checkbox" aria-labelledby="danmakulikeThanksTitle" aria-describedby="danmakulikeThanksState" disabled /><span class="switch-track"></span></label>
</div>
