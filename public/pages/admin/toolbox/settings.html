<section
  id="otherSettingsFeature"
  class="other-feature-panel"
  role="tabpanel"
  aria-labelledby="otherSettingsFeatureTab"
  data-other-feature-panel
  hidden
>
  <div class="other-feature-panel-body stack license-account-panel">
    <header class="license-account-header">
      <div>
        <h2 class="ui-page-title">客户端与账户</h2>
      </div>
    </header>

    <section id="licenseAccountDevice" class="license-account-card" hidden aria-labelledby="licenseAccountTitle">
      <div class="license-account-card-heading">
        <div>
          <h3 id="licenseAccountTitle" class="ui-section-title">账号信息</h3>
        </div>
        <span class="pill good">已授权</span>
      </div>
      <dl class="license-account-details">
        <div>
          <dt>登录账户</dt>
          <dd id="licenseAccountName">正在读取…</dd>
        </div>
        <div>
          <dt>当前设备</dt>
          <dd id="licenseDeviceName">正在读取…</dd>
        </div>
      </dl>
    </section>

    <section id="clientAppearance" class="license-account-card" aria-labelledby="clientAppearanceTitle">
      <h3 id="clientAppearanceTitle" class="ui-section-title">客户端外观</h3>
      <fieldset class="client-appearance-choices" aria-label="客户端配色">
        <template data-client-theme-option>
          <label class="client-appearance-choice">
            <span class="client-appearance-choice-heading">
              <input type="radio" name="clientTheme" value="{{client-theme-id}}" {{client-theme-checked}} />
              <span class="client-appearance-choice-copy">
                <span>{{client-theme-name}}</span>
                <span class="client-appearance-current" data-client-theme-current="{{client-theme-id}}" hidden>当前使用</span>
              </span>
            </span>
            <span class="client-appearance-preview" data-client-theme-preview="{{client-theme-id}}" aria-hidden="true">
              <span class="client-appearance-preview-surface"></span>
              <span class="client-appearance-preview-primary"></span>
              <span class="client-appearance-preview-marker"></span>
            </span>
          </label>
        </template>
      </fieldset>
      <div class="client-appearance-actions">
        <button type="button" class="primary" data-client-theme-apply disabled>应用配色</button>
        <span class="client-appearance-feedback" data-client-theme-feedback role="status" aria-live="polite"></span>
      </div>
    </section>

    <section class="license-account-card" aria-labelledby="licenseWebsitesTitle">
      <div class="license-website-row">
        <div class="license-website-copy">
          <h3 id="licenseWebsitesTitle" class="ui-section-title">LIRA 官网</h3>
          <p>了解 LIRA，请访问官方网站。</p>
        </div>
        <a class="license-website-link" href="https://lirahub.cn/" target="_blank" rel="noopener noreferrer"
          >访问 lirahub.cn <span aria-hidden="true">↗</span></a
        >
      </div>
    </section>

    <section class="license-account-card" aria-labelledby="licenseAccountLoginTitle">
      <div class="license-website-row">
        <div class="license-website-copy">
          <h3 id="licenseAccountLoginTitle" class="ui-section-title">账号登录</h3>
          <p>前往账号登录页面。</p>
        </div>
        <a class="license-website-link" href="https://admin.lirahub.cn/" target="_blank" rel="noopener noreferrer"
          >账号登录 <span aria-hidden="true">↗</span></a
        >
      </div>
    </section>

    <section class="license-account-card license-account-note" aria-label="密码帮助">
      <span class="license-account-note-icon" aria-hidden="true">?</span>
      <div>
        <strong>忘记密码？</strong>
        <p>请联系管理员重置密码。</p>
      </div>
    </section>
  </div>
</section>
