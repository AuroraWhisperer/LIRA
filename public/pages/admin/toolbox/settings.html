<section
  id="otherSettingsFeature"
  class="other-feature-panel"
  role="tabpanel"
  aria-labelledby="otherSettingsFeatureTab"
  data-other-feature-panel
  hidden
>
  <div class="other-feature-panel-body stack license-account-panel">
    <header class="license-account-header">
      <div>
        <h2 class="ui-page-title">账户与安全</h2>
      </div>
    </header>

    <section
      id="licenseAccountDevice"
      class="license-account-card"
      hidden
      aria-labelledby="licenseAccountTitle"
    >
      <div class="license-account-card-heading">
        <div>
          <h3 id="licenseAccountTitle" class="ui-section-title">
            账号信息
          </h3>
        </div>
        <span class="pill good">已授权</span>
      </div>
      <dl class="license-account-details">
        <div>
          <dt>登录账户</dt>
          <dd id="licenseAccountName">正在读取…</dd>
        </div>
        <div>
          <dt>当前设备</dt>
          <dd id="licenseDeviceName">正在读取…</dd>
        </div>
      </dl>
    </section>

    <section
      class="license-account-card license-account-note"
      aria-label="密码帮助"
    >
      <span class="license-account-note-icon" aria-hidden="true">?</span>
      <div>
        <strong>忘记密码？</strong>
        <p>请联系管理员重置密码。</p>
      </div>
    </section>
  </div>
</section>
