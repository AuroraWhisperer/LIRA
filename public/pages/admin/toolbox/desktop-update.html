<section
  id="otherDesktopUpdateFeature"
  class="client-settings-panel client-settings-panel--narrow"
  role="tabpanel"
  aria-labelledby="settingsAboutTab"
  hidden
>
  <section class="client-settings-card desktop-update-card" aria-labelledby="desktopUpdateTitle">
    <h3 id="desktopUpdateTitle" class="sr-only">版本与更新</h3>
    <div class="desktop-hero-main">
      <header class="client-about-heading">
        <img class="client-about-logo" src="/img/shared/lira-app-icon.png" width="48" height="48" alt="" />
        <div class="client-about-copy">
          <div class="client-about-name">
            <h4><svg class="lira-wordmark" width="58" height="22" viewBox="0 0 516.1275080721146 200" role="img" aria-label="LIRA"><use href="/img/shared/lira-wordmark.svg#wordmark"></use></svg></h4>
            <span class="desktop-current-version"><strong id="desktopVersionPill">--</strong></span>
            <span id="desktopUpdateStatus" role="status" data-status="idle">等待桌面端连接</span>
          </div>
          <p class="client-about-tagline">B 站直播点歌、互动与画面工具</p>
          <p id="desktopUpdateHint" class="hint" hidden></p>
        </div>
      </header>
      <div class="desktop-update-controls desktop-only" hidden>
        <div id="desktopUpdateActions" class="actions desktop-update-actions">
          <button id="desktopCheckUpdateBtn" class="primary" type="button">检查并下载更新</button>
          <button id="desktopDownloadUpdateBtn" class="primary" type="button" disabled hidden>下载更新</button>
          <button id="desktopInstallUpdateBtn" class="primary" type="button" disabled hidden>重启并安装更新</button>
        </div>
      </div>
    </div>

    <div id="desktopUpdateDownload" class="desktop-update-download" hidden>
      <div class="desktop-update-download-head">
        <span class="desktop-update-download-label">更新包下载进度</span>
        <span id="desktopUpdatePercent" hidden></span>
      </div>
      <div
        id="desktopUpdateProgress"
        class="desktop-update-progress"
        role="progressbar"
        aria-label="更新包下载进度"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <span id="desktopUpdateProgressBar"></span>
      </div>
      <div id="desktopUpdateDownloadDetails" class="desktop-update-download-details" hidden>
        <span class="desktop-update-transfer-meta">
          <span id="desktopUpdateTransferred"></span>
          <span id="desktopUpdateSpeed"></span>
        </span>
        <span class="desktop-update-note">直播中留意带宽 · 退出后自动安装</span>
      </div>
    </div>

    <div class="desktop-auto-update-row desktop-only" hidden>
      <label id="desktopAutoUpdateTitle" for="autoUpdateToggle">启动时自动检查更新</label>
      <label class="switch-control">
        <span id="autoUpdateLabel" class="sr-only">已关闭</span>
        <input id="autoUpdateToggle" type="checkbox" aria-labelledby="desktopAutoUpdateTitle" />
        <span class="switch-track"></span>
      </label>
    </div>
  </section>

  <section id="resourceDownloads" class="client-settings-section" aria-labelledby="resourceDownloadsTitle" hidden>
    <div class="client-settings-section-head">
      <h4 id="resourceDownloadsTitle" class="client-settings-section-label">资源下载任务</h4>
    </div>
    <div class="client-settings-card resource-downloads-card">
      <ul id="resourceDownloadList" class="resource-download-list"></ul>
    </div>
  </section>

  <section class="client-settings-section desktop-support-section desktop-only" aria-labelledby="desktopSupportTitle" hidden>
    <div class="client-settings-section-head">
      <h3 id="desktopSupportTitle" class="client-settings-section-label">本地数据与诊断</h3>
      <span class="client-settings-section-meta">更新时自动保留歌库与设置</span>
    </div>
    <div class="client-settings-card desktop-support-card">
      <div class="desktop-support-row">
        <div class="client-settings-row-leading">
          <span class="client-settings-icon-box client-settings-icon-box--sm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
          <div class="desktop-support-copy">
            <strong>数据目录</strong>
            <span>歌库与本地设置位置</span>
          </div>
        </div>
        <button id="desktopOpenDataBtn" class="desktop-support-action" type="button" aria-label="打开数据目录">打开目录</button>
      </div>

      <div class="desktop-support-row">
        <div class="client-settings-row-leading">
          <span class="client-settings-icon-box client-settings-icon-box--sm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg></span>
          <div class="desktop-support-copy">
            <strong>日志目录</strong>
            <span>运行记录（错误详情在 <code>errors</code> 内）</span>
          </div>
        </div>
        <button id="desktopOpenLogBtn" class="desktop-support-action" type="button" aria-label="打开日志目录">打开目录</button>
      </div>

      <div class="desktop-support-row-block">
        <div class="desktop-support-row">
          <div class="client-settings-row-leading">
            <span class="client-settings-icon-box client-settings-icon-box--sm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7v6c0 5 3.5 7.5 8 9 4.5-1.5 8-4 8-9V7l-8-4z"/><path d="m9 12 2 2 4-4"/></svg></span>
            <div class="desktop-support-copy">
              <strong>客户端资源检查</strong>
              <span>校验应用文件是否缺失或损坏</span>
            </div>
          </div>
          <button id="desktopIntegrityCheckBtn" class="desktop-support-action" type="button" disabled>开始检查</button>
        </div>
        <div id="desktopIntegrityResult" class="desktop-integrity-result" aria-labelledby="desktopIntegrityStatus" hidden>
          <svg class="desktop-integrity-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path id="desktopIntegrityIcon" d="M12 11v5 M12 8h.01" />
          </svg>
          <p id="desktopIntegrityStatus" role="status" aria-live="polite">等待桌面端连接</p>
          <p id="desktopIntegrityMeta" class="hint" hidden></p>
          <ul id="desktopIntegrityDetails" hidden></ul>
          <p id="desktopIntegrityHint" class="hint" hidden></p>
          <button id="desktopIntegrityGithubBtn" class="desktop-support-action" type="button" hidden>前往官方项目页面</button>
        </div>
      </div>
    </div>
  </section>

  <footer class="client-about-links" aria-label="产品信息与协议">
    <a id="licenseWebsitesTitle" href="https://lirahub.cn/" target="_blank" rel="noopener noreferrer">LIRA 官网</a>
    <span class="client-about-dot" aria-hidden="true">·</span>
    <button id="licenseAgreementOpen" type="button" aria-haspopup="dialog" aria-controls="licenseAgreementDialog">用户协议</button>
    <span class="client-about-dot" aria-hidden="true">·</span>
    <button id="licensePrivacyOpen" type="button" aria-haspopup="dialog" aria-controls="licenseAgreementDialog">隐私政策</button>
  </footer>
</section>
