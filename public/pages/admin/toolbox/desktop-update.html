<section
  id="otherDesktopUpdateFeature"
  class="client-settings-panel"
  role="tabpanel"
  aria-labelledby="settingsAboutTab"
  hidden
>
    <header class="client-about-heading">
      <img class="client-about-logo" src="/img/shared/lira-app-icon.png" width="52" height="52" alt="" />
      <div>
        <div class="client-about-name"><h3>LIRA</h3><span class="desktop-current-version"><span>版本</span><strong id="desktopVersionPill">--</strong></span></div>
        <p>为 B 站直播提供点歌、互动与直播画面工具。</p>
      </div>
    </header>

    <div class="client-settings-columns">
    <div class="client-update-column">
    <section class="desktop-update-card client-settings-group desktop-only" aria-labelledby="desktopUpdateTitle" hidden>
      <div class="desktop-update-content">
        <div class="desktop-update-card-heading">
          <h3 id="desktopUpdateTitle" class="ui-section-title">版本更新</h3>
        </div>
        <div class="desktop-update-status-row">
          <div class="desktop-update-status-copy">
            <p id="desktopUpdateStatus" role="status">等待桌面端连接</p>
            <p id="desktopUpdateHint" class="hint" hidden></p>
          </div>
          <span id="desktopUpdatePercent" hidden></span>
          <div id="desktopUpdateActions" class="actions desktop-update-actions">
            <button id="desktopCheckUpdateBtn" class="primary" type="button">检查并下载更新</button>
            <button id="desktopDownloadUpdateBtn" class="primary" type="button" disabled hidden>下载更新</button>
            <button id="desktopInstallUpdateBtn" class="primary" type="button" disabled hidden>重启并安装更新</button>
          </div>
        </div>
        <div id="desktopUpdateDownload" class="desktop-update-download" hidden>
          <div
            id="desktopUpdateProgress"
            class="desktop-update-progress"
            role="progressbar"
            aria-label="更新包下载进度"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <span id="desktopUpdateProgressBar"></span>
          </div>
          <div id="desktopUpdateDownloadDetails" class="desktop-update-download-details" hidden>
            <span id="desktopUpdateTransferred"></span>
            <span id="desktopUpdateSpeed"></span>
          </div>
        </div>
        <p class="hint desktop-update-note">发现新版本后会自动下载，直播中请留意下载带宽。退出后显示安装进度，完成后自动关闭。</p>
      </div>

      <div class="desktop-auto-update-row">
        <div class="client-settings-row-copy"><label id="desktopAutoUpdateTitle" for="autoUpdateToggle">启动时自动检查更新</label><p>打开 LIRA 时检查是否有新版本</p></div>
        <label class="switch-control">
          <span id="autoUpdateLabel">已关闭</span>
          <input id="autoUpdateToggle" type="checkbox" aria-labelledby="desktopAutoUpdateTitle" />
          <span class="switch-track"></span>
        </label>
      </div>
    </section>

    <section id="resourceDownloads" class="client-settings-group" aria-labelledby="resourceDownloadsTitle" hidden>
      <header>
        <h4 id="resourceDownloadsTitle" class="ui-card-title">正在下载</h4>
      </header>
      <ul id="resourceDownloadList" class="resource-download-list"></ul>
    </section>

    </div>
    <section class="desktop-support-card client-settings-group desktop-only" aria-labelledby="desktopSupportTitle" hidden>
      <header class="client-settings-group-heading">
        <div><h3 id="desktopSupportTitle" class="ui-section-title">本地数据与支持</h3><p>歌库和设置独立存储，版本更新后会保留。</p></div>
      </header>
      <div class="desktop-support-row">
        <div class="desktop-support-copy">
          <strong>数据目录</strong>
          <span>查看歌库与设置的存放位置</span>
        </div>
        <button id="desktopOpenDataBtn" class="desktop-support-action" type="button" aria-label="打开数据目录">
          打开目录
        </button>
      </div>
      <div class="desktop-support-row">
        <div class="desktop-support-copy">
          <strong>日志目录</strong>
          <span>运行记录在目录内，错误详情在 errors 子目录</span>
        </div>
        <button id="desktopOpenLogBtn" class="desktop-support-action" type="button" aria-label="打开日志目录">
          打开目录
        </button>
      </div>
      <div class="desktop-support-row">
        <div class="desktop-support-copy">
          <strong>客户端资源检查</strong>
          <span>检查应用文件是否缺失或损坏</span>
        </div>
        <button id="desktopIntegrityCheckBtn" class="desktop-support-action" type="button" disabled>开始检查</button>
      </div>
      <div id="desktopIntegrityResult" class="desktop-integrity-result" aria-labelledby="desktopIntegrityStatus">
        <svg class="desktop-integrity-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path id="desktopIntegrityIcon" d="M12 11v5 M12 8h.01" />
        </svg>
        <p id="desktopIntegrityStatus" role="status" aria-live="polite">等待桌面端连接</p>
        <p id="desktopIntegrityMeta" class="hint" hidden></p>
        <ul id="desktopIntegrityDetails" hidden></ul>
        <p id="desktopIntegrityHint" class="hint" hidden></p>
        <button id="desktopIntegrityGithubBtn" class="desktop-support-action" type="button" hidden>
          前往官方项目页面
        </button>
      </div>
    </section>
    </div>
    <footer class="client-about-links" aria-label="产品信息与协议">
      <a id="licenseWebsitesTitle" href="https://lirahub.cn/" target="_blank" rel="noopener noreferrer">LIRA 官网 <span aria-hidden="true">↗</span></a>
      <button id="licenseAgreementOpen" type="button" aria-haspopup="dialog" aria-controls="licenseAgreementDialog">用户协议与隐私说明</button>
    </footer>
</section>
