<section
  id="otherGiftEffectsFeature"
  class="other-feature-panel"
  role="tabpanel"
  aria-labelledby="otherGiftEffectsFeatureTab"
  data-other-feature-panel
  hidden
>
  <div class="other-feature-panel-body gift-effect-tool-panel">
    <section class="gift-effect-find-card" aria-labelledby="giftEffectFindTitle">
      <div>
        <h3 id="giftEffectFindTitle" class="ui-section-title">查找礼物 ID</h3>
        <p>前往礼物特效档案查找礼物 ID，用于测试播放或弹幕触发。</p>
      </div>
      <a
        class="gift-effect-find-link"
        href="https://gifts.lirahub.cn/"
        target="_blank"
        rel="noopener noreferrer"
      >查找礼物 ID
        <svg
          aria-hidden="true"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        ><path d="M7 17 17 7M7 7h10v10" /></svg>
      </a>
    </section>
    <div class="gift-effect-tool-grid">
      <section
        class="gift-effect-control-card"
        aria-labelledby="giftEffectLookupTitle"
      >
        <div class="gift-effect-card-heading">
          <h3 id="giftEffectLookupTitle" class="ui-section-title">测试播放</h3>
          <span id="giftEffectLookupState" class="pill">待播放</span>
        </div>
        <form id="giftEffectLookupForm" class="gift-effect-lookup-form">
          <div class="gift-effect-field-heading">
            <label for="giftEffectGiftId">礼物 ID</label>
          </div>
          <div class="gift-effect-input-row">
            <input
              id="giftEffectGiftId"
              type="text"
              inputmode="numeric"
              pattern="[0-9]{1,12}"
              maxlength="12"
              autocomplete="off"
              placeholder="例如 32132"
              required
            />
            <button id="giftEffectLookupBtn" class="primary" type="submit">
              播放特效
            </button>
          </div>
        </form>
        <div
          id="giftEffectMatchSummary"
          class="gift-effect-match-summary"
          role="status"
          aria-live="polite"
        ></div>
      </section>

      <section
        class="gift-effect-address-card"
        aria-labelledby="giftEffectAddressTitle"
      >
        <div class="gift-effect-card-heading">
          <h3 id="giftEffectAddressTitle" class="ui-section-title">直播投屏</h3>
        </div>
        <div class="gift-effect-url-block">
          <span>OBS 浏览器源地址</span>
          <div class="gift-effect-url-row">
            <code id="giftEffectOverlayUrl"></code>
            <div class="gift-effect-url-actions">
              <button id="giftEffectCopyBtn" class="secondary" type="button">
                复制地址
              </button>
              <button id="giftEffectOpenBtn" class="secondary" type="button">
                预览
              </button>
            </div>
          </div>
        </div>
      </section>
      <section class="gift-effect-command-card" aria-labelledby="giftEffectCommandTitle">
        <div class="gift-effect-card-heading">
          <h3 id="giftEffectCommandTitle" class="ui-section-title">弹幕触发</h3>
          <label class="switch-control">
            <input
              id="giftEffectDanmakuEnabled"
              type="checkbox"
              aria-labelledby="giftEffectCommandTitle"
              aria-describedby="giftEffectCommandHelp"
            />
            <span class="switch-track" aria-hidden="true"></span>
            <span id="giftEffectCommandState" class="gift-effect-command-state" role="status">未开启</span>
          </label>
        </div>
        <div id="giftEffectCommandHelp" class="gift-effect-command-help">
          <p>开启后，观众发送以下任一弹幕即可播放，礼物 ID 前有无空格均可。</p>
          <div class="gift-effect-command-examples">
            <code>礼物特效 32132</code><code>礼物特效32132</code>
            <code>🎁 32132</code><code>🎁32132</code>
          </div>
          <p>将 32132 替换为礼物 ID，特效按顺序播放。</p>
        </div>
      </section>
    </div>
  </div>
</section>
