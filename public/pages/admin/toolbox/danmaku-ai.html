<section
  id="xiaomiAiSection"
  class="danmaku-feature-section xiaomi-ai-section"
  aria-labelledby="xiaomiAiTitle"
>
  <div class="xiaomi-ai-heading">
    <div class="xiaomi-ai-title-wrap">
      <svg
        class="xiaomi-ai-icon"
        viewBox="0 0 48 48"
        fill="none"
        stroke="currentColor"
        stroke-width="3.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M24 8v5" />
        <circle cx="24" cy="5.5" r="2.5" fill="currentColor" />
        <path
          d="M15 13h18a9 9 0 0 1 9 9v8a9 9 0 0 1-9 9H21l-9 5v-5.5A9 9 0 0 1 6 30v-8a9 9 0 0 1 9-9Z"
          fill="var(--surface)"
        />
        <rect
          x="12"
          y="19"
          width="24"
          height="14"
          rx="6"
          fill="currentColor"
          fill-opacity="0.12"
          stroke="none"
        />
        <path d="M18 23v3m12-3v3m-9 3a5 5 0 0 0 6 0" />
      </svg>
      <div><h3 id="xiaomiAiTitle">AI 互动助手</h3></div>
    </div>
    <label class="switch-control"
      ><input id="xiaomiAiEnabled" type="checkbox" checked /><span
        class="switch-track"
      ></span
      ><span>启用 AI</span></label
    >
  </div>
  <div class="xiaomi-ai-status-grid" aria-label="AI 互动助手状态">
    <div>
      <span>配置状态</span><strong id="xiaomiAiConfigState">正在读取</strong>
    </div>
    <div><span>等待队列</span><strong id="xiaomiAiQueueState">0</strong></div>
    <div>
      <span>运行模型</span><strong id="xiaomiAiModelState">未配置</strong>
    </div>
  </div>
  <form id="xiaomiAiForm" class="xiaomi-ai-form">
    <fieldset class="xiaomi-ai-primary-config">
      <legend>模型服务</legend>
      <div class="xiaomi-ai-provider-note">
        <span class="xiaomi-ai-provider-label"
          ><span id="xiaomiAiProviderBadge">自动识别</span
          ><lira-help
            ><span id="xiaomiAiProviderNote"
              >选择你使用的 AI 平台，也可以填写第三方平台地址。</span
            ></lira-help
          ></span
        >
      </div>
      <div class="xiaomi-ai-field-grid">
        <label
          ><span
            >AI 平台
            <lira-help>选择官方平台后，地址会自动填好。</lira-help></span
          >
          <select id="xiaomiAiModelProvider" data-dropdown-variant="toolbox">
            <option value="auto">自动识别（兼容旧设置）</option>
            <option value="deepseek">DeepSeek 官方</option>
            <option value="openai">OpenAI 官方</option>
            <option value="anthropic">Claude 官方兼容</option>
            <option value="gemini">Gemini 官方兼容</option>
            <option value="custom">自定义 / 第三方兼容</option>
          </select>
        </label>
        <label
          >密钥（API Key）<input
            id="xiaomiAiDeepSeekKey"
            type="password"
            autocomplete="off"
            spellcheck="false"
            data-ai-secret
            placeholder="粘贴 AI 平台提供的密钥"
          /><small id="xiaomiAiDeepSeekKeyHint">尚未保存</small></label
        >
        <label id="xiaomiAiEndpointControl" class="wide"
          ><span
            >API 请求地址
            <lira-help
              ><span id="xiaomiAiEndpointHelp"
                >接受服务根地址、v1 地址或完整接口地址。</span
              ></lira-help
            ></span
          ><input
            id="xiaomiAiDeepSeekUrl"
            type="url"
            autocomplete="off"
            placeholder="例如：https://gcli.ggchan.dev/ 或 https://api.openai.com/v1"
        /></label>
        <label id="xiaomiAiProtocolControl"
          ><span
            >接口协议
            <lira-help
              >不确定时保持「自动识别」；平台有明确要求时再修改。</lira-help
            ></span
          >
          <select id="xiaomiAiModelApiProtocol" data-dropdown-variant="toolbox">
            <option value="auto">自动识别</option>
            <option value="responses">Responses API</option>
            <option value="chat_completions">Chat Completions</option>
          </select>
        </label>
        <label class="wide"
          >模型
          <span class="xiaomi-ai-model-picker">
            <span class="xiaomi-ai-model-input-wrap">
              <input
                id="xiaomiAiModel"
                type="text"
                maxlength="80"
                autocomplete="off"
                placeholder="填写模型 ID"
                role="combobox"
                aria-autocomplete="list"
                aria-haspopup="listbox"
                aria-controls="xiaomiAiModelMenu"
                aria-expanded="false"
              />
              <span
                id="xiaomiAiModelMenu"
                class="xiaomi-ai-model-menu"
                role="listbox"
                aria-label="可用模型"
                hidden
              ></span>
            </span>
            <button
              id="xiaomiAiFetchModelsBtn"
              class="secondary"
              type="button"
              aria-controls="xiaomiAiModelMenu"
              aria-expanded="false"
            >
              获取模型
            </button>
          </span>
          <small id="xiaomiAiModelFetchState"
            >可直接填写模型 ID，或从当前服务获取可用模型。</small
          >
        </label>
      </div>
    </fieldset>
    <fieldset class="xiaomi-ai-reply-config">
      <legend>回复规则</legend>
      <div class="xiaomi-ai-field-grid">
        <label
          ><span
            >触发关键词 <lira-help>弹幕包含该昵称时唤醒助手。</lira-help></span
          ><input
            id="xiaomiAiTrigger"
            type="text"
            maxlength="12"
            placeholder="例如：小米"
        /></label>
        <label
          ><span
            >回复长度偏好
            <lira-help>优先一条；内容较多时两条，必要时三条。</lira-help></span
          ><input
            id="xiaomiAiReplyMaxChars"
            type="number"
            min="10"
            max="50"
            value="50"
        /></label>
      </div>
      <div class="xiaomi-ai-capability-rail" aria-label="当前模型服务能力">
        <div>
          <span>协议</span
          ><strong id="xiaomiAiProtocolCapability">等待配置</strong>
        </div>
        <div>
          <span>联网</span
          ><strong id="xiaomiAiWebSearchCapability">等待配置</strong>
        </div>
        <div>
          <span>深度思考</span
          ><strong id="xiaomiAiReasoningCapability">等待配置</strong>
        </div>
      </div>
      <div class="xiaomi-ai-toggle-row">
        <label
          class="switch-control xiaomi-ai-capability-control xiaomi-ai-toggle-control"
        >
          <input id="xiaomiAiWebSearch" type="checkbox" role="switch" checked />
          <span class="switch-track" aria-hidden="true"></span>
          <span class="xiaomi-ai-control-copy"
            ><span
              ><b id="xiaomiAiWebSearchLabel">联网搜索</b
              ><lira-help
                ><span id="xiaomiAiWebSearchHelp"
                  >使用所选平台支持的搜索方式。</span
                ></lira-help
              ></span
            ><small>使用当前服务支持的方式检索信息。</small></span
          >
        </label>
        <label
          id="xiaomiAiReasoningControl"
          class="switch-control xiaomi-ai-capability-control xiaomi-ai-toggle-control"
          hidden
        >
          <input id="xiaomiAiReasoning" type="checkbox" role="switch" />
          <span class="switch-track" aria-hidden="true"></span>
          <span class="xiaomi-ai-control-copy"
            ><span
              ><b id="xiaomiAiReasoningLabel">深度思考</b
              ><lira-help
                ><span id="xiaomiAiReasoningHelp"></span></lira-help></span
            ><small>让模型在回答前进行额外思考。</small></span
          >
        </label>
        <label
          id="xiaomiAiReasoningEffortControl"
          class="xiaomi-ai-capability-control xiaomi-ai-effort-control"
          hidden
        >
          <span class="xiaomi-ai-control-copy"
            ><b>思考强度</b><small>开启深度思考后可调整。</small></span
          >
          <select id="xiaomiAiReasoningEffort" data-dropdown-variant="toolbox">
            <option value="auto">服务默认</option>
            <option value="minimal">最低</option>
            <option value="low">低</option>
            <option value="medium">中</option>
            <option value="high">高</option>
            <option value="xhigh">很高</option>
            <option value="max">最高</option>
          </select>
        </label>
        <p
          id="xiaomiAiProviderManagedReasoning"
          class="xiaomi-ai-provider-managed"
          hidden
        >
          是否支持深度思考，由所选平台和模型决定。
        </p>
      </div>
    </fieldset>
    <details class="xiaomi-ai-collapsible">
      <summary>
        <span><strong>扩展能力</strong></span>
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path
            d="m5 8 5 5 5-5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </summary>
      <div class="xiaomi-ai-collapsible-body xiaomi-ai-integration-grid">
        <section aria-labelledby="xiaomiAiWeatherTitle">
          <div class="xiaomi-ai-subheading">
            <h4 id="xiaomiAiWeatherTitle">和风天气</h4>
            <span>天气</span>
          </div>
          <div class="xiaomi-ai-field-grid">
            <label class="wide"
              >专属 API Host（无需 https://）<input
                id="xiaomiAiQWeatherHost"
                type="text"
                inputmode="url"
                autocomplete="off"
                spellcheck="false"
                placeholder="nn7mdbwku9.re.qweatherapi.com"
            /></label>
            <label class="wide"
              >密钥（API Key）<input
                id="xiaomiAiQWeatherKey"
                type="password"
                autocomplete="off"
                spellcheck="false"
                data-ai-secret
                placeholder="直接粘贴和风天气 API Key"
              /><small id="xiaomiAiQWeatherKeyHint">尚未保存</small></label
            >
          </div>
        </section>
        <section aria-labelledby="xiaomiAiAmapTitle">
          <div class="xiaomi-ai-subheading">
            <h4 id="xiaomiAiAmapTitle">高德地图</h4>
            <span>地点 · 路线</span>
          </div>
          <div class="xiaomi-ai-field-grid">
            <label class="wide"
              >Web 服务 API Host<input
                id="xiaomiAiAmapHost"
                type="url"
                autocomplete="off"
                placeholder="留空，填写你的高德 API Host"
            /></label>
            <label class="wide"
              >Web 服务 Key<input
                id="xiaomiAiAmapKey"
                type="password"
                autocomplete="off"
                spellcheck="false"
                data-ai-secret
                placeholder="留空，填写高德 Web 服务 Key"
              /><small id="xiaomiAiAmapKeyHint">尚未保存</small></label
            >
          </div>
        </section>
      </div>
    </details>
    <details class="xiaomi-ai-collapsible xiaomi-ai-advanced">
      <summary>
        <span><strong>高级设置</strong></span>
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path
            d="m5 8 5 5 5-5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </summary>
      <div class="xiaomi-ai-collapsible-body xiaomi-ai-field-grid">
        <label
          >同时处理的提问数<input
            id="xiaomiAiConcurrency"
            type="number"
            min="1"
            max="5"
            value="3"
        /></label>
        <label
          >发送间隔（毫秒）<input
            type="text"
            value="不同回复随机 500–2000 毫秒；同一回复分段随机 200–600 毫秒"
            readonly
        /></label>
        <label
          >同一观众提问间隔（秒）<input
            id="xiaomiAiUserCooldown"
            type="number"
            min="0"
            max="3600"
            value="0"
        /></label>
        <label
          >每分钟提问上限<input
            id="xiaomiAiRoomLimit"
            type="number"
            min="1"
            max="120"
            value="20"
        /></label>
        <label class="wide"
          >AI 的性格和说话方式<textarea
            id="xiaomiAiSystemPrompt"
            rows="10"
            minlength="20"
            maxlength="8000"
          ></textarea>
        </label>
      </div>
    </details>
    <div class="xiaomi-ai-actions">
      <span id="xiaomiAiSaveState" class="hint" role="status" aria-live="polite"
        >修改后自动保存，也可以点击「保存设置」。密钥保存后不会完整显示。</span
      >
      <div class="xiaomi-ai-test-actions" aria-label="API 连接测试">
        <button id="xiaomiAiSaveBtn" class="primary" type="submit">
          保存设置
        </button>
        <button id="xiaomiAiTestBtn" class="secondary" type="button">
          测试 AI 连接
        </button>
        <button id="xiaomiAiQWeatherTestBtn" class="secondary" type="button">
          测试和风天气
        </button>
        <button id="xiaomiAiAmapTestBtn" class="secondary" type="button">
          测试高德地图
        </button>
      </div>
    </div>
  </form>
</section>
