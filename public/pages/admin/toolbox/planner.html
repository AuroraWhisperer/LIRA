            <section
              id="otherDailyTodoFeature"
              class="other-feature-panel"
              role="tabpanel"
              aria-labelledby="otherDailyTodoFeatureTab"
              data-other-feature-panel
              hidden
            >
              <div id="streamerPlanner" class="other-feature-panel-body streamer-planner">
                <header class="planner-hero">
                  <div class="planner-hero-copy">
                    <span class="planner-eyebrow">我的直播节奏</span>
                    <h2>主播计划</h2>
                    <p>把学歌、开播准备和下播复盘放到合适的时间里，一次只做眼前这件事。</p>
                  </div>
                  <div class="planner-hero-status">
                    <time id="plannerDateLabel">今天</time>
                    <strong id="plannerSummary">0 / 0 已完成</strong>
                    <span id="plannerSummaryNote">先安排今天最重要的事</span>
                  </div>
                </header>

                <section class="planner-capture" aria-labelledby="plannerCaptureTitle">
                  <div class="planner-section-heading">
                    <div>
                      <h3 id="plannerCaptureTitle">记下一件事</h3>
                      <p>写清楚要做什么，再选什么时候做。内容会自动保存。</p>
                    </div>
                    <span class="planner-local-note">
                      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 10V8a5 5 0 0 1 10 0v2M6 10h12v10H6z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                      所有安排只保存在这台电脑
                    </span>
                  </div>
                  <form id="plannerTaskForm" class="planner-quick-add" autocomplete="off">
                    <label class="planner-title-field">
                      <span>要做什么</span>
                      <input id="plannerTaskTitle" type="text" maxlength="80" required placeholder="例如：学《晴天》，练到能跟伴奏唱">
                    </label>
                    <label>
                      <span>什么时候</span>
                      <select id="plannerTaskPeriod" data-dropdown-variant="toolbox">
                        <option value="today">今天</option>
                        <option value="week">本周</option>
                        <option value="month">本月</option>
                      </select>
                    </label>
                    <label>
                      <span>属于哪类</span>
                      <select id="plannerTaskCategory" data-dropdown-variant="toolbox">
                        <option value="song">学歌</option>
                        <option value="prep">开播准备</option>
                        <option value="content">内容发布</option>
                        <option value="review">直播复盘</option>
                      </select>
                    </label>
                    <button class="primary planner-add-button" type="submit">
                      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                      添加安排
                    </button>
                  </form>
                  <div class="planner-template-row" aria-label="常用安排示例">
                    <span>不会写？点一个再改：</span>
                    <button type="button" data-planner-template data-title="学一首新歌" data-period="week" data-category="song">学一首歌</button>
                    <button type="button" data-planner-template data-title="检查麦克风、耳返和网络" data-period="today" data-category="prep">开播前检查</button>
                    <button type="button" data-planner-template data-title="剪出一条直播切片" data-period="week" data-category="content">整理直播切片</button>
                    <button type="button" data-planner-template data-title="记下本场高光和需要改进的问题" data-period="today" data-category="review">下播后复盘</button>
                  </div>
                </section>

                <div class="planner-timeline" aria-label="今天、本周和本月安排">
                  <section class="planner-period-card planner-period-today" data-planner-period="today">
                    <header class="planner-period-heading">
                      <span class="planner-period-marker" aria-hidden="true"></span>
                      <div><h3>今天</h3><p>开播前后马上处理</p></div>
                      <strong id="plannerTodayCount">0 项</strong>
                    </header>
                    <div id="plannerTodayList" class="planner-task-list" role="list" aria-live="polite"></div>
                  </section>
                  <section class="planner-period-card planner-period-week" data-planner-period="week">
                    <header class="planner-period-heading">
                      <span class="planner-period-marker" aria-hidden="true"></span>
                      <div><h3>本周</h3><p>练习、发布与固定安排</p></div>
                      <strong id="plannerWeekCount">0 项</strong>
                    </header>
                    <div id="plannerWeekList" class="planner-task-list" role="list" aria-live="polite"></div>
                  </section>
                  <section class="planner-period-card planner-period-month" data-planner-period="month">
                    <header class="planner-period-heading">
                      <span class="planner-period-marker" aria-hidden="true"></span>
                      <div><h3>本月</h3><p>歌单、内容和成长目标</p></div>
                      <strong id="plannerMonthCount">0 项</strong>
                    </header>
                    <div id="plannerMonthList" class="planner-task-list" role="list" aria-live="polite"></div>
                  </section>
                </div>
              </div>
            </section>
