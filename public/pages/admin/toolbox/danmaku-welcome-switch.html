<div class="danmaku-fixed-item" data-fixed-item="welcome">
  <div class="danmaku-fixed-copy">
    <div class="danmaku-fixed-item-heading">
      <strong id="danmakuWelcomeTitle">进场欢迎</strong><lira-help label="进场欢迎说明">观众进场后发送欢迎词，可设置延时、荣耀门槛、本直播间粉丝牌筛选、黑白名单、二次问候和不同欢迎文案。</lira-help>
    </div
    ><span id="danmakuWelcomeSummary" class="danmaku-fixed-summary">尚未确认服务器设置</span
    ><span id="danmakuWelcomeOverviewStatus" class="danmaku-fixed-note" role="status"></span>
  </div>
  <button
    class="danmaku-fixed-open"
    type="button"
    data-fixed-open="welcome"
    aria-label="进场欢迎设置"
    aria-controls="danmakuWelcomePanel"
    aria-expanded="false"
  >
    设置<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m6 8 4 4 4-4" /></svg>
  </button>
  <label class="switch-control">
    <input id="danmakuWelcomeToggle" type="checkbox" disabled aria-labelledby="danmakuWelcomeTitle" aria-describedby="danmakuWelcomeEnableHint" />
    <span class="switch-track"></span>
  </label>
</div>
<div class="danmaku-fixed-item" data-fixed-item="liveGreeting">
  <div class="danmaku-fixed-copy">
    <div class="danmaku-fixed-item-heading">
      <strong id="danmakuWelcomeLiveGreetingTitle">开播连接提示</strong><lira-help label="开播连接提示说明">每场开播且弹幕连接就绪后，机器人会发弹幕确认连接，例如“欢迎「虚拟主播」分区「小梨」回家”。关闭后只停发这条提示，不影响进场欢迎和其他自动回复。</lira-help>
    </div>
    <span id="danmakuWelcomeLiveGreetingHint" class="danmaku-fixed-summary">用于确认弹幕发送连接是否正常，不建议关闭</span>
    <span id="danmakuWelcomeLiveGreetingCapability" class="danmaku-fixed-note" role="status" hidden>服务器暂不支持此开关，请更新服务器；当前仍按服务器原有规则发送。</span>
  </div>
  <label class="switch-control">
    <input id="danmakuWelcomeLiveGreetingToggle" type="checkbox" disabled aria-labelledby="danmakuWelcomeLiveGreetingTitle" aria-describedby="danmakuWelcomeLiveGreetingHint danmakuWelcomeLiveGreetingCapability" />
    <span class="switch-track"></span>
  </label>
</div>
