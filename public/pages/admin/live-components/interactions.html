<section id="livePollFeature" class="other-feature-panel" role="tabpanel" aria-labelledby="livePollFeatureTab" data-other-feature-panel data-interaction-kind="poll" hidden>
  <div id="interactionsAdmin" class="other-feature-panel-body interaction-component">
    <div class="component-toolbar">
      <h3 class="ui-section-title">本场互动</h3>
      <div class="component-toolbar-group">
        <button id="interactionsUrl" class="secondary" type="button">复制地址</button>
        <lira-help label="互动链接说明">复制后在 OBS 或哔哩哔哩直播姬里新建浏览器源并粘贴。投票和评分共用此地址，一次只能进行一场。<code id="interactionsSourceUrl"></code></lira-help>
        <button id="interactionsOpen" class="secondary" type="button">打开预览</button>
      </div>
    </div>
    <div id="interactionWorkspace" class="interaction-workspace">
      <div class="interaction-editor">
        <div id="interactionActivityView">
          <div class="interaction-section-heading">
            <h4 id="interactionActivityTitle">本场设置</h4>
          </div>
          <form id="pollForm" class="interaction-config">
            <fieldset id="pollFields">
              <div class="interaction-setting-group interaction-title-setting">
                <label
                  ><span class="interaction-field-label">投票主题<small>选填 · 最多 60 字符</small></span
                  ><input id="pollTitle" type="text" placeholder="下一首想听什么？"
                /></label>
              </div>
              <div class="interaction-setting-group interaction-options-group">
                <div class="interaction-field-label">投票选项<small>1–6 项 · 每项 10 字符内</small></div>
                <div id="pollOptions" aria-label="投票选项"></div>
                <button id="pollAddOption" type="button" class="secondary interaction-quiet">添加选项</button>
                <p class="interaction-rule">
                  发送完整选项，每个账号仅计首次有效投票。<lira-help label="查看计票规则"><span id="pollRule"></span></lira-help>
                </p>
              </div>
              <div
                class="interaction-setting-group interaction-duration-setting"
                role="group"
                aria-labelledby="pollDurationLabel"
              >
                <div id="pollDurationLabel" class="interaction-field-label">投票时长</div>
                <div class="interaction-duration-controls">
                  <div class="interaction-duration">
                    <label
                      ><input
                        id="pollDurationMinutes"
                        type="number"
                        min="0"
                        max="60"
                        step="1"
                        value="1"
                        required
                        aria-label="投票分钟"
                      />分</label
                    >
                    <label
                      ><input
                        id="pollDurationSeconds"
                        type="number"
                        min="0"
                        max="59"
                        step="1"
                        value="0"
                        required
                        aria-label="投票秒数"
                      />秒</label
                    >
                  </div>
                  <div class="interaction-presets">
                    <button type="button" class="secondary" data-poll-seconds="60" aria-pressed="true">1 分钟</button
                    ><button type="button" class="secondary" data-poll-seconds="120" aria-pressed="false">2 分钟</button
                    ><button type="button" class="secondary" data-poll-seconds="300" aria-pressed="false">
                      5 分钟
                    </button>
                    <button type="button" class="secondary" data-poll-seconds="600" aria-pressed="false">10 分钟</button>
                  </div>
                </div>
              </div>
              <div class="interaction-form-actions">
                <button id="pollStart" type="submit" class="primary" disabled>开始投票</button>
              </div>
            </fieldset>
          </form>
          <form id="ratingForm" class="interaction-config" hidden>
            <fieldset id="ratingFields">
              <div class="interaction-setting-group interaction-title-setting">
                <label
                  ><span class="interaction-field-label">评分主题<small>选填 · 最多 60 字符</small></span
                  ><input id="ratingTitle" type="text" placeholder="为这次演唱打个分"
                /></label>
              </div>
              <div class="interaction-setting-group interaction-rating-setting">
                <div class="interaction-field-label">
                  <span>评分规则 <lira-help label="查看评分规则"><span id="ratingRule"></span></lira-help></span>
                </div>
                <dl class="interaction-rating-details">
                  <dt>参与方式</dt><dd>弹幕发送整数 1–10</dd>
                  <dt>重复评分</dt><dd>每个账号取最后一次</dd>
                  <dt>公布结果</dt><dd>手动结束后显示均分</dd>
                </dl>
              </div>
              <div class="interaction-form-actions">
                <button id="ratingStart" type="submit" class="primary" disabled>开始评分</button>
              </div>
            </fieldset>
          </form>
          <section id="interactionResults" hidden aria-label="本场互动结果">
            <p id="interactionSessionTitle" class="interaction-session-title" hidden></p>
            <div id="interactionHostRows" class="interaction-rows"></div>
            <strong id="interactionHostAverage"></strong>
            <p id="interactionRatingPending" hidden>结束评分后公布均分。</p>
            <div class="interaction-result-actions">
              <button id="interactionFinish" class="primary" type="button">结束本场</button
              ><button id="interactionClear" class="secondary" type="button">取消本场</button>
            </div>
          </section>
          <p id="interactionHostStatus" role="status" aria-live="polite">正在读取实时连接状态</p>
        </div>
        <div id="interactionAppearanceView" hidden>
          <div class="interaction-section-heading">
            <h4 id="interactionAppearanceTitle">画面样式</h4>
            <button id="interactionAppearanceBack" class="secondary interaction-quiet" type="button">
              返回设置
            </button>
          </div>
          <form
            id="interactionAppearanceForm"
            class="interaction-config interaction-appearance-form"
            aria-labelledby="interactionAppearanceTitle"
          >
            <fieldset id="interactionAppearanceFields" disabled>
              <section class="interaction-setting-group" aria-label="画面内容">
                <label>画面标题<input id="interactionOverlayTitle" type="text" placeholder="留空不显示标题" /></label>
                <label>提示文字<input id="interactionOverlayHint" type="text" placeholder="留空不显示" /></label>
                <label id="interactionRatingRulesField" hidden
                  >评分规则<textarea
                    id="interactionRatingRules"
                    rows="3"
                    placeholder="支持换行，留空不显示"
                  ></textarea>
                </label>
              </section>
              <section class="interaction-setting-group" aria-labelledby="interactionColorHeading">
                <h5 id="interactionColorHeading">配色</h5>
                <div class="interaction-color-fields">
                  <label>文字<input id="interactionTextColor" type="color" value="#172b3a" /></label>
                  <label>进度 / 得分<input id="interactionBarColor" type="color" value="#bee9e2" /></label>
                  <label>轨道底色<input id="interactionTrackColor" type="color" value="#f0f3f6" /></label>
                </div>
              </section>
              <section class="interaction-setting-group" aria-labelledby="interactionLayoutHeading">
                <h5 id="interactionLayoutHeading">布局与显示</h5>
                <div class="interaction-range-field">
                  <label for="interactionOverallOpacity">不透明度</label>
                  <input
                    id="interactionOverallOpacity"
                    class="parameter-range"
                    type="range"
                    min="0"
                    max="100"
                    step="1"
                    value="100"
                  />
                  <output id="interactionOverallOpacityValue" for="interactionOverallOpacity">100%</output>
                </div>
                <div class="interaction-range-field">
                  <label for="interactionFontSize">文字大小</label>
                  <input
                    id="interactionFontSize"
                    class="parameter-range"
                    type="range"
                    min="16"
                    max="24"
                    step="1"
                    value="20"
                  />
                  <output id="interactionFontSizeValue" for="interactionFontSize">20px</output>
                </div>
                <div class="interaction-range-field">
                  <label for="interactionCornerRadius">条形圆角</label>
                  <input
                    id="interactionCornerRadius"
                    class="parameter-range"
                    type="range"
                    min="0"
                    max="32"
                    step="1"
                    value="20"
                  />
                  <output id="interactionCornerRadiusValue" for="interactionCornerRadius">20px</output>
                </div>
                <div class="interaction-visibility-fields">
                  <label><input id="interactionShowStatus" type="checkbox" checked />显示状态</label>
                  <label><input id="interactionShowParticipants" type="checkbox" checked />显示人数</label>
                </div>
              </section>
              <div class="interaction-form-actions">
                <button id="interactionAppearanceApply" class="primary" type="submit" disabled>应用样式</button>
                <button id="interactionAppearanceReset" class="secondary interaction-quiet" type="button">
                  恢复默认
                </button>
              </div>
            </fieldset>
            <p id="interactionAppearanceStatus" role="status" aria-live="polite"></p>
            <button id="interactionAppearanceRetry" class="secondary" type="button" hidden>重新读取</button>
          </form>
        </div>
      </div>
      <aside class="interaction-preview-area" aria-label="直播画面预览">
        <div class="interaction-section-heading">
          <div class="interaction-preview-heading">
            <h4>画面预览</h4>
            <span>示例</span>
          </div>
          <button
            id="interactionAppearanceToggle"
            class="secondary"
            type="button"
            aria-expanded="false"
            aria-controls="interactionAppearanceView"
          >
            样式设置
          </button>
        </div>
        <div class="interaction-preview-canvas">
          <article id="interactionPreview" class="interaction-stage" aria-label="互动样式预览">
            <header class="interaction-header">
              <h4 id="interactionPreviewTitle" class="interaction-heading" hidden></h4>
              <span id="interactionPreviewStatus" class="interaction-status">剩余 00:52</span>
            </header>
            <p id="interactionPreviewHint" class="interaction-hint"></p>
            <div id="interactionPreviewRows" class="interaction-rows"></div>
            <div id="interactionPreviewRatingRules" class="interaction-rating-rules" hidden></div>
            <section id="interactionPreviewScore" class="interaction-score is-revealed" hidden>
              <span>最终均分</span>
              <div class="interaction-score-value">
                <strong>8.60</strong><span class="interaction-score-scale">/ 10</span>
              </div>
            </section>
            <footer class="interaction-footer"><span id="interactionPreviewParticipants">100 人参与</span></footer>
          </article>
        </div>
        <div class="interaction-preview-footer"><span>透明背景</span><span>800 × 600</span></div>
      </aside>
    </div>
  </div>
</section>
<section id="liveRatingFeature" class="other-feature-panel" role="tabpanel" aria-labelledby="liveRatingFeatureTab" data-other-feature-panel data-interaction-kind="rating" hidden></section>
