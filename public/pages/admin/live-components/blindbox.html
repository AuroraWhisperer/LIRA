<section id="giftBlindboxFeature" class="other-feature-panel" role="tabpanel" aria-labelledby="giftAssistantBlindboxTab" data-other-feature-panel hidden>
  <div class="other-feature-panel-body stack">
    <section class="gift-blindbox-broadcast-panel">
      <div class="panel-header">
        <div class="blindbox-broadcast-heading">
          <h2 class="gift-section-title ui-section-title">盲盒盈亏榜</h2>
          <span class="blindbox-broadcast-caption">观众画面</span>
        </div>
        <p id="blindboxSaveState" class="blindbox-save-state" role="status">修改后自动保存</p>
      </div>
      <div class="panel-body blindbox-builder">
        <div class="blindbox-builder-row">
          <label>
            <span class="blindbox-builder-label">投屏标题</span>
            <input id="blindboxOverlayTitle" type="text" placeholder="默认：今日盲盒盈亏" />
          </label>
          <label>
            <span class="blindbox-builder-label"
              >排行人数 <lira-help>-1 显示全部，0 仅显示汇总，1-10 显示对应人数。</lira-help></span
            >
            <input id="blindboxOverlayTop" type="number" min="-1" max="10" value="3" placeholder="3" />
          </label>
        </div>

        <div class="blindbox-builder-switches">
          <label class="switch-control">
            <input id="blindboxWinnersOnly" type="checkbox" role="switch" checked />
            <span class="switch-track" aria-hidden="true"></span>
            <span>仅显示盈利</span>
          </label>
          <label class="switch-control">
            <input id="blindboxHeartBoxOnly" type="checkbox" role="switch" />
            <span class="switch-track" aria-hidden="true"></span>
            <span>仅显示心动盲盒</span>
          </label>
        </div>

        <div id="blindboxHeartBoxSettings" class="blindbox-heart-settings" hidden>
          <div class="blindbox-subpanel-title">
            <strong>心动盲盒</strong>
            <span class="hint">仅统计今天</span>
          </div>
          <div class="blindbox-heart-fields">
            <div class="blindbox-heart-field">
              <label class="blindbox-field-label" for="blindboxCastleMultiplier">今天几倍堡</label>
              <div class="blindbox-heart-control">
                <input id="blindboxCastleMultiplier" type="number" min="0.01" max="1000" step="0.01" placeholder="留空不显示" />
                <span class="blindbox-unit">倍堡</span>
              </div>
            </div>
            <div class="blindbox-heart-field">
              <span class="blindbox-field-label">还剩几个堡</span>
              <div class="blindbox-heart-control">
                <label class="switch-control">
                  <input id="blindboxShowCastlesRemaining" type="checkbox" role="switch" aria-label="显示剩余城堡" />
                  <span class="switch-track" aria-hidden="true"></span>
                </label>
                <input id="blindboxCastlesRemaining" type="number" min="0" max="99999" step="1" value="0" aria-label="剩余城堡数，手动填写" disabled />
                <span class="blindbox-unit">个堡</span>
              </div>
            </div>
            <div class="blindbox-heart-field">
              <span class="blindbox-field-label"
                >出堡后已开盒数 <lira-help>统计今天上一次开出浪漫城堡后又开了多少个心动盲盒，出堡后归零；直送城堡不计入。</lira-help></span
              >
              <div class="blindbox-heart-control">
                <label class="switch-control">
                  <input id="blindboxShowOpenedSinceCastle" type="checkbox" role="switch" aria-label="显示出堡后已开盒数" />
                  <span class="switch-track" aria-hidden="true"></span>
                  <span>显示</span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <section class="blindbox-appearance" aria-labelledby="blindboxAppearanceTitle">
          <div class="blindbox-section-head">
            <h3 id="blindboxAppearanceTitle" class="blindbox-section-title">外观</h3>
            <span class="hint">字体和配色与点歌板共用，修改后同时生效</span>
          </div>
          <div id="blindboxAppearanceFields" class="blindbox-appearance-fields"></div>
        </section>

        <div class="blindbox-url-bar">
          <div class="blindbox-url-copy">
            <span class="blindbox-url-label">浏览器源地址</span>
            <button id="blindboxOverlayUrl" class="copy-url" type="button" aria-label="复制盲盒盈亏榜浏览器源地址" title="点击复制地址"></button>
          </div>
          <div class="blindbox-url-actions">
            <button id="blindboxPreviewBtn" class="secondary" type="button">打开画布</button>
          </div>
        </div>
      </div>
    </section>
  </div>
</section>
