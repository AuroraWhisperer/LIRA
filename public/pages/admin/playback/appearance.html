<section id="playerAppearance" class="player-appearance" hidden>
  <div class="player-appearance-layout">
    <div class="player-appearance-controls">
      <div class="tabs player-appearance-tabs" role="tablist" aria-label="播放器外观分类">
        <button type="button" class="tab active" data-tab="playerAppearanceStyle">样式</button>
        <button type="button" class="tab" data-tab="playerAppearanceColors">配色</button>
        <button type="button" class="tab" data-tab="playerAppearanceSong">歌曲</button>
        <button type="button" class="tab" data-tab="playerAppearanceLyrics">歌词</button>
      </div>
      <fieldset id="playerAppearanceStyle" data-appearance-group aria-label="样式">
        <div class="player-appearance-styles">
          <label class="player-appearance-style">
            <input type="radio" name="playerAppearanceStyle" value="turntable" data-appearance-key="style" checked />
            <span class="player-appearance-style-art" data-appearance-thumbnail="turntable" aria-hidden="true"></span>
            <span>默认唱片机</span>
          </label>
          <label class="player-appearance-style">
            <input type="radio" name="playerAppearanceStyle" value="vinyl" data-appearance-key="style" />
            <span class="player-appearance-style-art" data-appearance-thumbnail="vinyl" aria-hidden="true"></span>
            <span>黑胶唱片</span>
          </label>
          <label class="player-appearance-style">
            <input type="radio" name="playerAppearanceStyle" value="cover" data-appearance-key="style" />
            <span class="player-appearance-style-art" data-appearance-thumbnail="cover" aria-hidden="true"></span>
            <span>专辑封面</span>
          </label>
        </div>
        <div class="player-appearance-range">
          <label for="playerArtworkSize">唱片／封面大小</label>
          <input id="playerArtworkSize" class="parameter-range" type="range" min="60" max="110" value="100" data-appearance-key="artworkSize" />
          <label class="player-appearance-number"><input type="number" min="60" max="110" value="100" required aria-label="唱片／封面大小百分比" data-appearance-key="artworkSize" /><span>%</span></label>
        </div>
        <label class="player-appearance-check"><input type="checkbox" checked data-appearance-key="rotation" />播放时旋转唱片</label>
        <label>文字对齐
          <select data-appearance-key="textAlign">
            <option value="left">左对齐</option>
            <option value="center">居中</option>
          </select>
        </label>
      </fieldset>
      <fieldset id="playerAppearanceColors" data-appearance-group aria-label="配色" hidden>
        <label>背景模式
          <select data-appearance-key="backgroundMode">
            <option value="auto">跟随当前配色</option>
            <option value="solid">纯色</option>
            <option value="gradient">双色渐变</option>
          </select>
        </label>
        <div class="player-appearance-colors" data-appearance-background-colors hidden>
          <label>背景颜色<input type="color" value="#fff1f4" data-appearance-key="backgroundColor" data-color-opacity="playerBackgroundOpacity" /></label>
          <label data-appearance-gradient hidden>渐变终点<input type="color" value="#c9dced" data-appearance-key="gradientColor" data-color-opacity="playerBackgroundOpacity" /></label>
        </div>
        <div class="player-appearance-range">
          <label for="playerBackgroundOpacity">背景不透明度</label>
          <input id="playerBackgroundOpacity" class="parameter-range" type="range" min="0" max="100" value="100" data-appearance-key="backgroundOpacity" />
          <label class="player-appearance-number"><input type="number" min="0" max="100" value="100" required aria-label="背景不透明度百分比" data-appearance-key="backgroundOpacity" /><span>%</span></label>
        </div>
        <label>文字配色
          <select data-appearance-key="textColors">
            <option value="theme">跟随当前配色</option>
            <option value="custom">自定义颜色</option>
          </select>
        </label>
        <div class="player-appearance-colors" data-appearance-text-colors hidden>
          <label>歌名颜色<input type="color" value="#302a27" data-appearance-key="titleColor" /></label>
          <label>歌手颜色<input type="color" value="#665b53" data-appearance-key="artistColor" /></label>
          <label>普通歌词<input type="color" value="#796d63" data-appearance-key="lyricColor" /></label>
          <label>当前歌词<input type="color" value="#302a27" data-appearance-key="activeLyricColor" /></label>
        </div>
      </fieldset>
      <fieldset id="playerAppearanceSong" data-appearance-group aria-label="歌曲" hidden>
        <label>歌曲字体
          <select data-appearance-key="fontFamily" data-select-search data-select-font-preview>
            <option value="system">跟随客户端</option>
            <optgroup label="内置字体">
              <option value="maiyuan" data-font-family="&quot;Lira Maiyuan&quot;">荆南麦圆</option>
              <option value="kuaile" data-font-family="&quot;Lira Kuaile&quot;">站酷快乐体</option>
              <option value="smiley" data-font-family="&quot;Lira Smiley&quot;">得意黑</option>
            </optgroup>
            <optgroup label="系统常用字体">
            <option value="sans" data-font-family="&quot;Microsoft YaHei&quot;">黑体</option>
            <option value="serif" data-font-family="&quot;SimSun&quot;">宋体</option>
            <option value="kai" data-font-family="&quot;KaiTi&quot;">楷体</option>
            </optgroup>
          </select>
        </label>
        <div class="player-appearance-range">
          <label for="playerTitleSize">歌名字号</label>
          <input id="playerTitleSize" class="parameter-range" type="range" min="8" max="200" value="42" data-appearance-key="titleSize" />
          <label class="player-appearance-number"><input type="number" min="8" max="200" value="42" required aria-label="歌名字号像素" data-appearance-key="titleSize" /><span>px</span></label>
        </div>
        <div class="player-appearance-range">
          <label for="playerArtistSize">歌手字号</label>
          <input id="playerArtistSize" class="parameter-range" type="range" min="8" max="120" value="20" data-appearance-key="artistSize" />
          <label class="player-appearance-number"><input type="number" min="8" max="120" value="20" required aria-label="歌手字号像素" data-appearance-key="artistSize" /><span>px</span></label>
        </div>
      </fieldset>
      <fieldset id="playerAppearanceLyrics" data-appearance-group aria-label="歌词" hidden>
        <label>歌词字体
          <select data-appearance-key="lyricFontFamily" data-select-search data-select-font-preview>
            <option value="inherit">跟随歌曲字体</option>
            <option value="system">跟随客户端</option>
            <optgroup label="内置字体">
              <option value="maiyuan" data-font-family="&quot;Lira Maiyuan&quot;">荆南麦圆</option>
              <option value="kuaile" data-font-family="&quot;Lira Kuaile&quot;">站酷快乐体</option>
              <option value="smiley" data-font-family="&quot;Lira Smiley&quot;">得意黑</option>
            </optgroup>
            <optgroup label="系统常用字体">
              <option value="sans" data-font-family="&quot;Microsoft YaHei&quot;">黑体</option>
              <option value="serif" data-font-family="&quot;SimSun&quot;">宋体</option>
              <option value="kai" data-font-family="&quot;KaiTi&quot;">楷体</option>
            </optgroup>
          </select>
        </label>
        <div class="player-appearance-range">
          <label for="playerLyricSize">歌词字号</label>
          <input id="playerLyricSize" class="parameter-range" type="range" min="8" max="160" value="32" data-appearance-key="lyricSize" />
          <label class="player-appearance-number"><input type="number" min="8" max="160" value="32" required aria-label="歌词字号像素" data-appearance-key="lyricSize" /><span>px</span></label>
        </div>
        <div class="player-appearance-range">
          <label for="playerLyricLineHeight">歌词行高</label>
          <input id="playerLyricLineHeight" class="parameter-range" type="range" min="0.8" max="4" step="0.1" value="1.4" data-appearance-key="lyricLineHeight" />
          <label class="player-appearance-number"><input type="number" min="0.8" max="4" step="0.1" value="1.4" required aria-label="歌词行高倍数" data-appearance-key="lyricLineHeight" /><span>倍</span></label>
        </div>
        <div class="player-appearance-range">
          <label for="playerLyricLineGap">每句歌词间距</label>
          <input id="playerLyricLineGap" class="parameter-range" type="range" min="0" max="200" value="28" data-appearance-key="lyricLineGap" />
          <label class="player-appearance-number"><input type="number" min="0" max="200" value="28" required aria-label="每句歌词间距像素" data-appearance-key="lyricLineGap" /><span>px</span></label>
        </div>
        <details class="player-appearance-advanced">
          <summary>更多歌词排版</summary>
          <div class="player-appearance-advanced-fields">
            <label>歌词粗细
              <select data-appearance-key="lyricFontWeight">
                <option value="400">常规</option>
                <option value="500">适中</option>
                <option value="600">半粗</option>
                <option value="700">加粗（默认）</option>
              </select>
            </label>
            <div class="player-appearance-range">
              <label for="playerLyricLetterSpacing">歌词字间距</label>
              <input id="playerLyricLetterSpacing" class="parameter-range" type="range" min="-2" max="24" step="0.5" value="0" data-appearance-key="lyricLetterSpacing" />
              <label class="player-appearance-number"><input type="number" min="-2" max="24" step="0.5" value="0" required aria-label="歌词字间距像素" data-appearance-key="lyricLetterSpacing" /><span>px</span></label>
            </div>
            <div class="player-appearance-range">
              <label for="playerActiveLyricScale">当前歌词放大</label>
              <input id="playerActiveLyricScale" class="parameter-range" type="range" min="100" max="300" step="0.5" value="112.5" data-appearance-key="activeLyricScale" />
              <label class="player-appearance-number"><input type="number" min="100" max="300" step="0.5" value="112.5" required aria-label="当前歌词放大百分比" data-appearance-key="activeLyricScale" /><span>%</span></label>
            </div>
          </div>
        </details>
      </fieldset>
      <div class="player-appearance-actions">
        <button type="button" class="secondary" data-appearance-group-reset>恢复本组默认</button>
        <button type="button" class="secondary" data-appearance-reset>恢复全部默认</button>
      </div>
    </div>
    <div class="player-appearance-preview-column">
      <div class="player-appearance-preview-toolbar">
        <span class="ui-card-title">效果预览</span>
        <label class="player-appearance-check"><input type="checkbox" data-appearance-long-sample />长句与译文</label>
      </div>
      <div class="player-appearance-preview" aria-hidden="true" inert>
        <div class="player-appearance-canvas"></div>
      </div>
      <div class="player-appearance-preview-caption">
        <p class="hint">按当前窗口比例预览 · 播放时显示实际歌曲</p>
        <button id="playerAppearanceOpenBtn" type="button">打开大播放器</button>
      </div>
      <p class="hint player-appearance-feedback" data-appearance-feedback role="status" aria-live="polite">设置保存在这台电脑上。</p>
    </div>
  </div>
</section>
