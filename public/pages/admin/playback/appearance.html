<section id="playerAppearance" class="player-appearance" inert>
  <div class="player-appearance-layout">
    <div class="player-appearance-controls">
      <div class="tabs player-appearance-tabs" role="tablist" aria-label="播放器外观分类">
        <button type="button" class="tab active" data-tab="playerAppearanceStyle">
          <svg class="player-appearance-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="8" height="8" rx="2" />
            <circle cx="17" cy="7" r="4" />
            <rect x="3" y="14" width="18" height="7" rx="2" />
          </svg>
          <span>样式</span>
        </button>
        <button type="button" class="tab" data-tab="playerAppearanceColors">
          <svg class="player-appearance-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a9 9 0 1 0 0 18c1.5 0 2.5-1 2.5-2.3 0-.8-.3-1.4-.3-2 0-1 .8-1.7 1.8-1.7H18a3 3 0 0 0 3-3c0-4.9-4-9-9-9Z" />
            <circle cx="8" cy="11" r="1" fill="currentColor" stroke="none" />
            <circle cx="11" cy="7.5" r="1" fill="currentColor" stroke="none" />
            <circle cx="15.5" cy="9" r="1" fill="currentColor" stroke="none" />
          </svg>
          <span>配色</span>
        </button>
        <button type="button" class="tab" data-tab="playerAppearanceSong">
          <svg class="player-appearance-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18V5l12-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="18" cy="16" r="3" />
          </svg>
          <span>歌曲</span>
        </button>
        <button type="button" class="tab" data-tab="playerAppearanceLyrics">
          <svg class="player-appearance-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7h12M4 12h16M4 17h10" />
          </svg>
          <span>歌词</span>
        </button>
      </div>
      <div class="player-appearance-groups">
        <fieldset id="playerAppearanceStyle" data-appearance-group aria-label="样式">
          <section class="player-appearance-section" aria-labelledby="playerLayoutHeading">
            <h3 id="playerLayoutHeading">播放器布局</h3>
            <div class="player-appearance-layouts" role="radiogroup" aria-label="播放器布局">
              <label class="player-appearance-style">
                <input type="radio" name="playerAppearanceLayout" value="classic" data-appearance-key="layout" checked />
                <svg class="player-appearance-layout-art" viewBox="0 0 100 56" fill="none" aria-hidden="true">
                  <circle cx="27" cy="28" r="15" fill="currentColor" opacity=".6" />
                  <path d="M53 18h31M53 28h31M53 38h23" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
                </svg>
                <span>经典</span>
              </label>
              <label class="player-appearance-style">
                <input type="radio" name="playerAppearanceLayout" value="vinyl" data-appearance-key="layout" />
                <svg class="player-appearance-layout-art" viewBox="0 0 100 56" fill="none" aria-hidden="true">
                  <circle cx="50" cy="21" r="15" fill="currentColor" opacity=".6" />
                  <path d="M29 46h42" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
                </svg>
                <span>黑胶</span>
              </label>
              <label class="player-appearance-style">
                <input type="radio" name="playerAppearanceLayout" value="lyrics" data-appearance-key="layout" />
                <svg class="player-appearance-layout-art" viewBox="0 0 100 56" fill="none" aria-hidden="true">
                  <path d="M36 10h28M27 19h46M22 28h56M27 37h46M36 46h28" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
                </svg>
                <span>歌词</span>
              </label>
            </div>
          </section>
          <section class="player-appearance-section player-appearance-artwork-controls" data-appearance-artwork-controls aria-labelledby="playerArtworkHeading">
            <h3 id="playerArtworkHeading">封面外观</h3>
            <div class="player-appearance-styles" role="radiogroup" aria-label="封面外观">
              <label class="player-appearance-style">
                <input type="radio" name="playerAppearanceStyle" value="turntable" data-appearance-key="style" checked />
                <span class="player-appearance-style-art" data-appearance-thumbnail="turntable" aria-hidden="true"></span>
                <span>默认唱片机</span>
              </label>
              <label class="player-appearance-style">
                <input type="radio" name="playerAppearanceStyle" value="vinyl" data-appearance-key="style" />
                <span class="player-appearance-style-art" data-appearance-thumbnail="vinyl" aria-hidden="true"></span>
                <span>黑胶唱片</span>
              </label>
              <label class="player-appearance-style">
                <input type="radio" name="playerAppearanceStyle" value="cover" data-appearance-key="style" />
                <span class="player-appearance-style-art" data-appearance-thumbnail="cover" aria-hidden="true"></span>
                <span>专辑封面</span>
              </label>
              <label class="player-appearance-style">
                <input type="radio" name="playerAppearanceStyle" value="vinyl-arm" data-appearance-key="style" />
                <span class="player-appearance-style-art" data-appearance-thumbnail="vinyl-arm" aria-hidden="true"></span>
                <span>唱臂黑胶</span>
              </label>
            </div>
            <div class="player-appearance-range">
              <label for="playerArtworkSize">唱片 / 封面大小</label>
              <label class="player-appearance-number lira-number-field"><input type="number" min="60" max="110" value="100" required aria-label="唱片 / 封面大小百分比" data-appearance-key="artworkSize" /><span class="lira-number-field-unit" aria-hidden="true">%</span></label>
              <input id="playerArtworkSize" class="parameter-range" type="range" min="60" max="110" value="100" data-appearance-key="artworkSize" />
            </div>
            <label class="switch-control switch-control--fill-hit player-appearance-switch-row">
              <span class="player-appearance-switch-label">播放时旋转唱片</span>
              <input type="checkbox" checked data-appearance-key="rotation" />
              <span class="switch-track" aria-hidden="true"></span>
            </label>
          </section>
          <section class="player-appearance-section player-appearance-section--inline" aria-labelledby="playerTextLayoutHeading">
            <h3 id="playerTextLayoutHeading">文字对齐</h3>
            <div class="player-appearance-segmented" role="radiogroup" aria-labelledby="playerTextLayoutHeading">
              <label class="player-appearance-segment">
                <input type="radio" name="playerAppearanceTextAlign" value="left" data-appearance-key="textAlign" checked />
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                  <path d="M2.5 4h11M2.5 8h7.5M2.5 12h9.5" />
                </svg>
                <span>左对齐</span>
              </label>
              <label class="player-appearance-segment">
                <input type="radio" name="playerAppearanceTextAlign" value="center" data-appearance-key="textAlign" />
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                  <path d="M2.5 4h11M4.25 8h7.5M3.25 12h9.5" />
                </svg>
                <span>居中</span>
              </label>
            </div>
          </section>
        </fieldset>
        <fieldset id="playerAppearanceColors" data-appearance-group aria-label="配色" hidden>
          <section class="player-appearance-section" aria-labelledby="playerBackgroundHeading">
            <h3 id="playerBackgroundHeading">背景</h3>
            <div class="player-appearance-segmented player-appearance-segmented--full" role="radiogroup" aria-label="背景模式">
              <label class="player-appearance-segment">
                <input type="radio" name="playerAppearanceBackgroundMode" value="auto" data-appearance-key="backgroundMode" checked />
                <span>自动</span>
              </label>
              <label class="player-appearance-segment">
                <input type="radio" name="playerAppearanceBackgroundMode" value="solid" data-appearance-key="backgroundMode" />
                <span>纯色</span>
              </label>
              <label class="player-appearance-segment">
                <input type="radio" name="playerAppearanceBackgroundMode" value="gradient" data-appearance-key="backgroundMode" />
                <span>双色渐变</span>
              </label>
            </div>
            <p class="player-appearance-mode-note" data-appearance-auto-note>主题未指定时按歌曲配色</p>
            <div class="player-appearance-colors" data-appearance-background-colors hidden>
              <label>背景颜色<input type="color" value="#fff1f4" data-appearance-key="backgroundColor" data-color-opacity="playerBackgroundOpacity" /></label>
              <label data-appearance-gradient hidden>渐变终点<input type="color" value="#c9dced" data-appearance-key="gradientColor" data-color-opacity="playerBackgroundOpacity" /></label>
            </div>
            <div class="player-appearance-range">
              <label for="playerBackgroundOpacity">背景不透明度</label>
              <label class="player-appearance-number lira-number-field"><input type="number" min="0" max="100" value="100" required aria-label="背景不透明度百分比" data-appearance-key="backgroundOpacity" /><span class="lira-number-field-unit" aria-hidden="true">%</span></label>
              <input id="playerBackgroundOpacity" class="parameter-range" type="range" min="0" max="100" value="100" data-appearance-key="backgroundOpacity" />
            </div>
          </section>
          <section class="player-appearance-section" aria-labelledby="playerTextColorHeading">
            <h3 id="playerTextColorHeading">文字</h3>
            <div class="player-appearance-segmented player-appearance-segmented--full" role="radiogroup" aria-label="文字配色">
              <label class="player-appearance-segment">
                <input type="radio" name="playerAppearanceTextColors" value="theme" data-appearance-key="textColors" checked />
                <span>跟随主题</span>
              </label>
              <label class="player-appearance-segment">
                <input type="radio" name="playerAppearanceTextColors" value="custom" data-appearance-key="textColors" />
                <span>自定义颜色</span>
              </label>
            </div>
            <div class="player-appearance-colors" data-appearance-text-colors hidden>
              <label>歌名颜色<input type="color" value="#302a27" data-appearance-key="titleColor" /></label>
              <label>歌手颜色<input type="color" value="#665b53" data-appearance-key="artistColor" /></label>
              <label>普通歌词<input type="color" value="#796d63" data-appearance-key="lyricColor" /></label>
              <label>当前歌词<input type="color" value="#302a27" data-appearance-key="activeLyricColor" /></label>
            </div>
          </section>
        </fieldset>
        <fieldset id="playerAppearanceSong" data-appearance-group aria-label="歌曲" hidden>
          <div class="player-appearance-section">
            <label class="player-appearance-section-label">歌名与歌手字体
              <select data-appearance-key="fontFamily" data-select-search data-select-font-preview>
                <option value="system">使用 LIRA 界面字体</option>
                <optgroup label="系统字体库">
                  <option value="sans" data-font-family="&quot;Microsoft YaHei&quot;">微软雅黑</option>
                  <option value="serif" data-font-family="&quot;SimSun&quot;">宋体</option>
                  <option value="kai" data-font-family="&quot;KaiTi&quot;">楷体</option>
                </optgroup>
              </select>
            </label>
          </div>
          <section class="player-appearance-section" aria-labelledby="playerSongSizeHeading">
            <h3 id="playerSongSizeHeading">字号</h3>
            <div class="player-appearance-range">
              <label for="playerTitleSize">歌名字号</label>
              <label class="player-appearance-number lira-number-field"><input type="number" min="8" max="200" value="42" required aria-label="歌名字号像素" data-appearance-key="titleSize" /><span class="lira-number-field-unit" aria-hidden="true">px</span></label>
              <input id="playerTitleSize" class="parameter-range" type="range" min="8" max="200" value="42" data-appearance-key="titleSize" />
            </div>
            <div class="player-appearance-range">
              <label for="playerArtistSize">歌手字号</label>
              <label class="player-appearance-number lira-number-field"><input type="number" min="8" max="120" value="20" required aria-label="歌手字号像素" data-appearance-key="artistSize" /><span class="lira-number-field-unit" aria-hidden="true">px</span></label>
              <input id="playerArtistSize" class="parameter-range" type="range" min="8" max="120" value="20" data-appearance-key="artistSize" />
            </div>
          </section>
        </fieldset>
        <fieldset id="playerAppearanceLyrics" data-appearance-group aria-label="歌词" hidden>
          <section class="player-appearance-section" aria-labelledby="playerLyricTextHeading">
            <h3 id="playerLyricTextHeading">歌词文字</h3>
            <label>歌词字体
              <select data-appearance-key="lyricFontFamily" data-select-search data-select-font-preview>
                <option value="inherit">与歌名、歌手一致</option>
                <option value="system">使用 LIRA 界面字体</option>
                <optgroup label="系统字体库">
                  <option value="sans" data-font-family="&quot;Microsoft YaHei&quot;">微软雅黑</option>
                  <option value="serif" data-font-family="&quot;SimSun&quot;">宋体</option>
                  <option value="kai" data-font-family="&quot;KaiTi&quot;">楷体</option>
                </optgroup>
              </select>
            </label>
            <div class="player-appearance-range">
              <label for="playerLyricSize">歌词字号</label>
              <label class="player-appearance-number lira-number-field"><input type="number" min="8" max="160" value="32" required aria-label="歌词字号像素" data-appearance-key="lyricSize" /><span class="lira-number-field-unit" aria-hidden="true">px</span></label>
              <input id="playerLyricSize" class="parameter-range" type="range" min="8" max="160" value="32" data-appearance-key="lyricSize" />
            </div>
          </section>
          <section class="player-appearance-section" aria-labelledby="playerLyricSpacingHeading">
            <h3 id="playerLyricSpacingHeading">行间排版</h3>
            <div class="player-appearance-range">
              <label for="playerLyricLineHeight">歌词行高</label>
              <label class="player-appearance-number lira-number-field"><input type="number" min="0.8" max="4" step="0.1" value="1.4" required aria-label="歌词行高倍数" data-appearance-key="lyricLineHeight" /><span class="lira-number-field-unit" aria-hidden="true">倍</span></label>
              <input id="playerLyricLineHeight" class="parameter-range" type="range" min="0.8" max="4" step="0.1" value="1.4" data-appearance-key="lyricLineHeight" />
            </div>
            <div class="player-appearance-range">
              <label for="playerLyricLineGap">每句歌词间距</label>
              <label class="player-appearance-number lira-number-field"><input type="number" min="0" max="200" value="28" required aria-label="每句歌词间距像素" data-appearance-key="lyricLineGap" /><span class="lira-number-field-unit" aria-hidden="true">px</span></label>
              <input id="playerLyricLineGap" class="parameter-range" type="range" min="0" max="200" value="28" data-appearance-key="lyricLineGap" />
            </div>
          </section>
          <details class="player-appearance-advanced">
            <summary>更多歌词排版</summary>
            <div class="player-appearance-advanced-fields">
              <div class="player-appearance-field-group">
                <span class="player-appearance-field-label" id="playerLyricWeightLabel">歌词粗细</span>
                <div class="player-appearance-segmented player-appearance-segmented--full" role="radiogroup" aria-labelledby="playerLyricWeightLabel">
                  <label class="player-appearance-segment">
                    <input type="radio" name="playerAppearanceLyricWeight" value="400" data-appearance-key="lyricFontWeight" />
                    <span>常规</span>
                  </label>
                  <label class="player-appearance-segment">
                    <input type="radio" name="playerAppearanceLyricWeight" value="500" data-appearance-key="lyricFontWeight" />
                    <span>适中</span>
                  </label>
                  <label class="player-appearance-segment">
                    <input type="radio" name="playerAppearanceLyricWeight" value="600" data-appearance-key="lyricFontWeight" />
                    <span>半粗</span>
                  </label>
                  <label class="player-appearance-segment">
                    <input type="radio" name="playerAppearanceLyricWeight" value="700" data-appearance-key="lyricFontWeight" checked />
                    <span>加粗</span>
                  </label>
                </div>
              </div>
              <div class="player-appearance-range">
                <label for="playerLyricLetterSpacing">歌词字间距</label>
                <label class="player-appearance-number lira-number-field"><input type="number" min="-2" max="24" step="0.5" value="0" required aria-label="歌词字间距像素" data-appearance-key="lyricLetterSpacing" /><span class="lira-number-field-unit" aria-hidden="true">px</span></label>
                <input id="playerLyricLetterSpacing" class="parameter-range" type="range" min="-2" max="24" step="0.5" value="0" data-appearance-key="lyricLetterSpacing" />
              </div>
              <div class="player-appearance-range">
                <label for="playerActiveLyricScale">当前歌词放大</label>
                <label class="player-appearance-number lira-number-field"><input type="number" min="100" max="300" step="0.5" value="112.5" required aria-label="当前歌词放大百分比" data-appearance-key="activeLyricScale" /><span class="lira-number-field-unit" aria-hidden="true">%</span></label>
                <input id="playerActiveLyricScale" class="parameter-range" type="range" min="100" max="300" step="0.5" value="112.5" data-appearance-key="activeLyricScale" />
              </div>
            </div>
          </details>
        </fieldset>
        <p class="hint player-appearance-feedback" data-appearance-feedback role="status" aria-live="polite" hidden></p>
      </div>
      <div class="player-appearance-actions">
        <button type="button" class="player-appearance-reset-btn" data-appearance-group-reset>恢复本组默认</button>
        <button type="button" class="player-appearance-reset-btn" data-appearance-reset>恢复全部默认</button>
      </div>
    </div>
    <div class="player-appearance-preview-column">
      <div class="player-appearance-preview-stage">
        <div class="player-appearance-preview" aria-hidden="true" inert>
          <div class="player-appearance-canvas"></div>
        </div>
        <div class="player-appearance-preview-toolbar">
          <label class="switch-control switch-control--fill-hit player-appearance-toolbar-switch">
            <input type="checkbox" data-appearance-long-sample />
            <span class="switch-track" aria-hidden="true"></span>
            <span>预览长句与译文</span>
          </label>
          <button id="playerAppearanceOpenBtn" class="primary player-appearance-open-btn" type="button">
            <span>打开大播放器</span>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5.5 3.5h7v7M12.5 3.5 4.5 11.5" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
