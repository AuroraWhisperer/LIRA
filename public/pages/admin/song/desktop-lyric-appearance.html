<details class="desktop-lyric-settings-group is-basic" open>
  <summary>
    <span><strong>基础样式</strong></span
    ><span class="desktop-lyric-group-count">7 项</span>
  </summary>
  <div class="desktop-lyric-group-body desktop-lyric-settings-fields">
    <div class="desktop-lyric-control desktop-lyric-font-control">
      <label class="desktop-lyric-control-copy" for="desktopLyricFontFamily"><strong>字体 <lira-help>支持多语言歌词，缺字自动补齐。</lira-help></strong></label>
      <div class="desktop-lyric-font-picker">
        <select id="desktopLyricFontFamily" data-select-search data-select-font-preview data-dropdown-variant="settings">
          <option value="Lira Maiyuan">荆南麦圆 · 圆润可爱</option>
        </select>
      </div>
    </div>
    <label class="desktop-lyric-control desktop-lyric-range-control">
      <span class="desktop-lyric-control-copy"><strong><span id="desktopLyricFontSizeLabel">字体大小</span></strong></span>
      <span class="range-row"
        ><input
          aria-labelledby="desktopLyricFontSizeLabel" id="desktopLyricFontSize"
          class="parameter-range parameter-range--scale"
          type="range"
          min="24"
          max="72"
          step="2"
          value="56"
        /><input aria-labelledby="desktopLyricFontSizeLabel" id="desktopLyricFontSizeNumber" type="number" min="24" max="72" step="2" value="56" /><span
          class="desktop-lyric-unit"
          >px</span
        ></span
      >
    </label>
    <label class="desktop-lyric-control">
      <span class="desktop-lyric-control-copy"><strong>字重</strong></span>
      <select id="desktopLyricFontWeight" data-dropdown-variant="settings">
        <option value="400">正常</option>
        <option value="500">略粗</option>
        <option value="600">半粗</option>
        <option value="700">粗体</option>
        <option value="800" selected>很粗（默认）</option>
        <option value="900">超粗</option>
      </select>
    </label>
    <div class="desktop-lyric-control">
      <span class="desktop-lyric-control-copy"><strong>对齐方式</strong></span>
      <div id="desktopLyricTextAlign" class="desktop-lyric-align-options" role="radiogroup" aria-label="歌词对齐方式">
        <label title="左对齐"
          ><input type="radio" name="desktopLyricTextAlign" value="left" checked /><span
            class="desktop-lyric-align-icon is-left"
            aria-hidden="true"
            ><i></i><i></i><i></i><i></i></span
          ><span class="sr-only">左对齐</span></label
        >
        <label title="居中"
          ><input type="radio" name="desktopLyricTextAlign" value="center" /><span
            class="desktop-lyric-align-icon is-center"
            aria-hidden="true"
            ><i></i><i></i><i></i><i></i></span
          ><span class="sr-only">居中</span></label
        >
        <label title="右对齐"
          ><input type="radio" name="desktopLyricTextAlign" value="right" /><span
            class="desktop-lyric-align-icon is-right"
            aria-hidden="true"
            ><i></i><i></i><i></i><i></i></span
          ><span class="sr-only">右对齐</span></label
        >
        <label title="两端对齐"
          ><input type="radio" name="desktopLyricTextAlign" value="justify" /><span
            class="desktop-lyric-align-icon is-justify"
            aria-hidden="true"
            ><i></i><i></i><i></i><i></i></span
          ><span class="sr-only">两端对齐</span></label
        >
      </div>
    </div>
    <label class="desktop-lyric-control desktop-lyric-range-control">
      <span class="desktop-lyric-control-copy"><strong><span id="desktopLyricLetterSpacingLabel">字间距</span></strong></span>
      <span class="range-row"
        ><input
          aria-labelledby="desktopLyricLetterSpacingLabel" id="desktopLyricLetterSpacing"
          class="parameter-range parameter-range--centered"
          data-range-scale="balanced"
          type="range"
          min="-0.1"
          max="2"
          step="0.01"
          value="0"
        /><input aria-labelledby="desktopLyricLetterSpacingLabel" id="desktopLyricLetterSpacingNumber" type="number" min="-0.1" max="2" step="0.01" value="0" /><span
          class="desktop-lyric-unit"
          >em</span
        ></span
      >
    </label>
    <label class="desktop-lyric-control desktop-lyric-range-control">
      <span class="desktop-lyric-control-copy"><strong><span id="desktopLyricLineHeightLabel">行间距</span></strong></span>
      <span class="range-row"
        ><input
          aria-labelledby="desktopLyricLineHeightLabel" id="desktopLyricLineHeight"
          class="parameter-range parameter-range--scale"
          type="range"
          min="1"
          max="2"
          step="0.1"
          value="1.4"
        /><input aria-labelledby="desktopLyricLineHeightLabel" id="desktopLyricLineHeightNumber" type="number" min="100" max="200" step="10" value="140" /><span
          class="desktop-lyric-unit"
          >%</span
        ></span
      >
    </label>
    <label class="desktop-lyric-control"
      ><span class="desktop-lyric-control-copy"
        ><strong>显示歌词行数 <lira-help>同步到浏览器源与预览。0 显示整首；1 只显示当前句；偶数向下多一行。</lira-help></strong></span
      ><input id="desktopLyricVisibleLines" type="number" min="0" max="99" step="1" value="0" inputmode="numeric"
    /></label>
  </div>
</details>

<details class="desktop-lyric-settings-group is-effect">
  <summary>
    <span><strong>描边与阴影</strong></span
    ><span class="desktop-lyric-group-count">9 项</span>
  </summary>
  <div class="desktop-lyric-group-body desktop-lyric-settings-fields">
    <div class="desktop-lyric-control">
      <span class="desktop-lyric-control-copy"><strong><span id="desktopLyricStrokeEnabledLabel">文字描边</span></strong></span
      ><label class="switch-control"
        ><input aria-labelledby="desktopLyricStrokeEnabledLabel" id="desktopLyricStrokeEnabled" type="checkbox" /><span
          class="switch-track"
          aria-hidden="true"
        ></span
      ></label>
    </div>
    <div class="desktop-lyric-control">
      <span class="desktop-lyric-control-copy"><strong>描边颜色</strong></span
      ><input
        id="desktopLyricStrokeColor"
        type="color"
        value="#ffffff"
        aria-label="描边颜色"
      />
    </div>
    <label class="desktop-lyric-control desktop-lyric-range-control"
      ><span class="desktop-lyric-control-copy"><strong><span id="desktopLyricStrokeWidthLabel">描边宽度</span></strong></span
      ><span class="range-row"
        ><input
          aria-labelledby="desktopLyricStrokeWidthLabel" id="desktopLyricStrokeWidth"
          class="parameter-range parameter-range--scale"
          type="range"
          min="0"
          max="6"
          step="0.5"
          value="3"
        /><input aria-labelledby="desktopLyricStrokeWidthLabel" id="desktopLyricStrokeWidthNumber" type="number" min="0" max="6" step="0.5" value="3" /><span
          class="desktop-lyric-unit"
          >px</span
        ></span
      ></label
    >
    <div class="desktop-lyric-control">
      <span class="desktop-lyric-control-copy"><strong><span id="desktopLyricShadowEnabledLabel">文字阴影</span></strong></span
      ><label class="switch-control"
        ><input aria-labelledby="desktopLyricShadowEnabledLabel" id="desktopLyricShadowEnabled" type="checkbox" checked /><span
          class="switch-track"
          aria-hidden="true"
        ></span
      ></label>
    </div>
    <div class="desktop-lyric-control">
      <span class="desktop-lyric-control-copy"><strong>阴影颜色</strong></span
      ><input
        id="desktopLyricShadowColor" data-color-opacity="desktopLyricShadowIntensity"
        type="color"
        value="#000000"
        aria-label="阴影颜色"
      />
    </div>
    <label class="desktop-lyric-control desktop-lyric-range-control"
      ><span class="desktop-lyric-control-copy"><strong><span id="desktopLyricShadowIntensityLabel">阴影强度</span></strong></span
      ><span class="range-row"
        ><input
          aria-labelledby="desktopLyricShadowIntensityLabel" id="desktopLyricShadowIntensity"
          class="parameter-range parameter-range--intensity"
          type="range"
          min="0"
          max="1"
          step="0.05"
          value="0.35"
        /><input aria-labelledby="desktopLyricShadowIntensityLabel" id="desktopLyricShadowIntensityNumber" type="number" min="0" max="100" step="5" value="35" /><span
          class="desktop-lyric-unit"
          >%</span
        ></span
      ></label
    >
    <label class="desktop-lyric-control desktop-lyric-range-control"
      ><span class="desktop-lyric-control-copy"><strong><span id="desktopLyricShadowBlurLabel">阴影模糊</span></strong></span
      ><span class="range-row"
        ><input
          aria-labelledby="desktopLyricShadowBlurLabel" id="desktopLyricShadowBlur"
          class="parameter-range parameter-range--scale"
          type="range"
          min="0"
          max="30"
          step="1"
          value="8"
        /><input aria-labelledby="desktopLyricShadowBlurLabel" id="desktopLyricShadowBlurNumber" type="number" min="0" max="30" step="1" value="8" /><span
          class="desktop-lyric-unit"
          >px</span
        ></span
      ></label
    >
    <label class="desktop-lyric-control desktop-lyric-range-control"
      ><span class="desktop-lyric-control-copy"><strong><span id="desktopLyricShadowOffsetXLabel">阴影水平偏移</span></strong></span
      ><span class="range-row"
        ><input
          aria-labelledby="desktopLyricShadowOffsetXLabel" id="desktopLyricShadowOffsetX"
          class="parameter-range parameter-range--centered"
          type="range"
          min="-20"
          max="20"
          step="1"
          value="0"
        /><input aria-labelledby="desktopLyricShadowOffsetXLabel" id="desktopLyricShadowOffsetXNumber" type="number" min="-20" max="20" step="1" value="0" /><span
          class="desktop-lyric-unit"
          >px</span
        ></span
      ></label
    >
    <label class="desktop-lyric-control desktop-lyric-range-control"
      ><span class="desktop-lyric-control-copy"><strong><span id="desktopLyricShadowOffsetYLabel">阴影垂直偏移</span></strong></span
      ><span class="range-row"
        ><input
          aria-labelledby="desktopLyricShadowOffsetYLabel" id="desktopLyricShadowOffsetY"
          class="parameter-range parameter-range--centered"
          type="range"
          min="-20"
          max="20"
          step="1"
          value="3"
        /><input aria-labelledby="desktopLyricShadowOffsetYLabel" id="desktopLyricShadowOffsetYNumber" type="number" min="-20" max="20" step="1" value="3" /><span
          class="desktop-lyric-unit"
          >px</span
        ></span
      ></label
    >
  </div>
</details>
