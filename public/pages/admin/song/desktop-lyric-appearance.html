<details class="desktop-lyric-settings-group is-basic" open>
  <summary>
    <span><strong>基础样式</strong></span
    ><span class="desktop-lyric-group-count">8 项</span>
  </summary>
  <div class="desktop-lyric-group-body desktop-lyric-settings-fields">
    <div class="desktop-lyric-control desktop-lyric-font-control">
      <span class="desktop-lyric-control-copy"><strong>主字体</strong></span>
      <div class="desktop-lyric-font-picker">
        <select id="desktopLyricFontFamily" data-dropdown-variant="settings">
          <option
            value="Microsoft YaHei, Microsoft JhengHei, PingFang SC, Hiragino Sans GB, Yu Gothic, Meiryo, Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK SC, Noto Sans JP, Noto Sans KR, Segoe UI, Arial, sans-serif"
          >
            中日英韩通用
          </option>
          <option value="Microsoft YaHei">微软雅黑（默认）</option>
          <option value="PingFang SC, Microsoft YaHei, sans-serif">苹方 · 现代简约</option>
          <option value="SimHei, Microsoft YaHei, sans-serif">黑体 · 醒目有力</option>
          <option value="KaiTi, STKaiti, serif">楷体 · 优雅手写</option>
          <option value="system-ui, -apple-system, sans-serif">系统圆体 · 圆润可爱</option>
          <option value="SimSun, STSong, serif">宋体 · 传统典雅</option>
          <option value="Noto Sans SC, Noto Sans JP, Microsoft YaHei, sans-serif">思源黑体 · 清晰现代</option>
          <option value="YouYuan, STYuanti, PingFang SC, sans-serif">幼圆 · 圆润亲切</option>
          <option value="Georgia, Times New Roman, STSong, serif">Georgia · 优雅衬线</option>
          <option value="Courier New, Consolas, monospace">等宽字体 · 极客风格</option>
        </select>
      </div>
    </div>
    <label class="desktop-lyric-control">
      <span class="desktop-lyric-control-copy"
        ><strong>备选字体 <lira-help>主字体缺少字符时使用。</lira-help></strong></span
      >
      <input
        id="desktopLyricFallbackFontFamily"
        type="text"
        value="Microsoft JhengHei"
        placeholder="Microsoft JhengHei"
      />
    </label>
    <label class="desktop-lyric-control desktop-lyric-range-control">
      <span class="desktop-lyric-control-copy"><strong>字体大小</strong></span>
      <span class="range-row"
        ><input
          id="desktopLyricFontSize"
          class="parameter-range parameter-range--scale"
          type="range"
          min="24"
          max="72"
          step="2"
          value="56"
        /><input id="desktopLyricFontSizeNumber" type="number" min="24" max="72" step="2" value="56" /><span
          class="desktop-lyric-unit"
          >px</span
        ></span
      >
    </label>
    <label class="desktop-lyric-control">
      <span class="desktop-lyric-control-copy"><strong>字重</strong></span>
      <select id="desktopLyricFontWeight" data-dropdown-variant="settings">
        <option value="400">正常</option>
        <option value="500">略粗</option>
        <option value="600">较粗</option>
        <option value="700">粗体</option>
        <option value="800" selected>很粗（默认）</option>
        <option value="900">超粗</option>
      </select>
    </label>
    <div class="desktop-lyric-control">
      <span class="desktop-lyric-control-copy"><strong>文字颜色</strong></span>
      <input
        id="desktopLyricTextColor"
        class="desktop-lyric-color"
        type="color"
        value="#000000"
        aria-label="文字颜色"
      />
    </div>
    <div class="desktop-lyric-control">
      <span class="desktop-lyric-control-copy"><strong>对齐方式</strong></span>
      <div id="desktopLyricTextAlign" class="desktop-lyric-align-options" role="radiogroup" aria-label="歌词对齐方式">
        <label title="左对齐"
          ><input type="radio" name="desktopLyricTextAlign" value="left" checked /><span
            class="desktop-lyric-align-icon is-left"
            aria-hidden="true"
            ><i></i><i></i><i></i><i></i></span
          ><span class="sr-only">左对齐</span></label
        >
        <label title="居中"
          ><input type="radio" name="desktopLyricTextAlign" value="center" /><span
            class="desktop-lyric-align-icon is-center"
            aria-hidden="true"
            ><i></i><i></i><i></i><i></i></span
          ><span class="sr-only">居中</span></label
        >
        <label title="右对齐"
          ><input type="radio" name="desktopLyricTextAlign" value="right" /><span
            class="desktop-lyric-align-icon is-right"
            aria-hidden="true"
            ><i></i><i></i><i></i><i></i></span
          ><span class="sr-only">右对齐</span></label
        >
        <label title="两端对齐"
          ><input type="radio" name="desktopLyricTextAlign" value="justify" /><span
            class="desktop-lyric-align-icon is-justify"
            aria-hidden="true"
            ><i></i><i></i><i></i><i></i></span
          ><span class="sr-only">两端对齐</span></label
        >
      </div>
    </div>
    <label class="desktop-lyric-control desktop-lyric-range-control">
      <span class="desktop-lyric-control-copy"><strong>字间距</strong></span>
      <span class="range-row"
        ><input
          id="desktopLyricLetterSpacing"
          class="parameter-range parameter-range--centered"
          type="range"
          min="-0.1"
          max="0.3"
          step="0.01"
          value="0"
        /><input id="desktopLyricLetterSpacingNumber" type="number" min="-0.1" max="0.3" step="0.01" value="0" /><span
          class="desktop-lyric-unit"
          >em</span
        ></span
      >
    </label>
    <label class="desktop-lyric-control desktop-lyric-range-control">
      <span class="desktop-lyric-control-copy"><strong>行间距</strong></span>
      <span class="range-row"
        ><input
          id="desktopLyricLineHeight"
          class="parameter-range parameter-range--scale"
          type="range"
          min="1"
          max="2"
          step="0.1"
          value="1.4"
        /><input id="desktopLyricLineHeightNumber" type="number" min="100" max="200" step="10" value="140" /><span
          class="desktop-lyric-unit"
          >%</span
        ></span
      >
    </label>
  </div>
</details>

<details class="desktop-lyric-settings-group is-effect">
  <summary>
    <span><strong>描边与阴影</strong></span
    ><span class="desktop-lyric-group-count">9 项</span>
  </summary>
  <div class="desktop-lyric-group-body desktop-lyric-settings-fields">
    <div class="desktop-lyric-control">
      <span class="desktop-lyric-control-copy"><strong>文字描边</strong></span
      ><label class="switch-control"
        ><input id="desktopLyricStrokeEnabled" type="checkbox" checked /><span
          class="switch-track"
          aria-hidden="true"
        ></span
      ></label>
    </div>
    <div class="desktop-lyric-control">
      <span class="desktop-lyric-control-copy"><strong>描边颜色</strong></span
      ><input
        id="desktopLyricStrokeColor"
        class="desktop-lyric-color"
        type="color"
        value="#ffffff"
        aria-label="描边颜色"
      />
    </div>
    <label class="desktop-lyric-control desktop-lyric-range-control"
      ><span class="desktop-lyric-control-copy"><strong>描边宽度</strong></span
      ><span class="range-row"
        ><input
          id="desktopLyricStrokeWidth"
          class="parameter-range parameter-range--scale"
          type="range"
          min="0"
          max="6"
          step="0.5"
          value="3"
        /><input id="desktopLyricStrokeWidthNumber" type="number" min="0" max="6" step="0.5" value="3" /><span
          class="desktop-lyric-unit"
          >px</span
        ></span
      ></label
    >
    <div class="desktop-lyric-control">
      <span class="desktop-lyric-control-copy"><strong>文字阴影</strong></span
      ><label class="switch-control"
        ><input id="desktopLyricShadowEnabled" type="checkbox" checked /><span
          class="switch-track"
          aria-hidden="true"
        ></span
      ></label>
    </div>
    <div class="desktop-lyric-control">
      <span class="desktop-lyric-control-copy"><strong>阴影颜色</strong></span
      ><input
        id="desktopLyricShadowColor"
        class="desktop-lyric-color"
        type="color"
        value="#000000"
        aria-label="阴影颜色"
      />
    </div>
    <label class="desktop-lyric-control desktop-lyric-range-control"
      ><span class="desktop-lyric-control-copy"><strong>阴影强度</strong></span
      ><span class="range-row"
        ><input
          id="desktopLyricShadowIntensity"
          class="parameter-range parameter-range--intensity"
          type="range"
          min="0"
          max="1"
          step="0.05"
          value="0.35"
        /><input id="desktopLyricShadowIntensityNumber" type="number" min="0" max="100" step="5" value="35" /><span
          class="desktop-lyric-unit"
          >%</span
        ></span
      ></label
    >
    <label class="desktop-lyric-control desktop-lyric-range-control"
      ><span class="desktop-lyric-control-copy"><strong>阴影模糊</strong></span
      ><span class="range-row"
        ><input
          id="desktopLyricShadowBlur"
          class="parameter-range parameter-range--scale"
          type="range"
          min="0"
          max="30"
          step="1"
          value="8"
        /><input id="desktopLyricShadowBlurNumber" type="number" min="0" max="30" step="1" value="8" /><span
          class="desktop-lyric-unit"
          >px</span
        ></span
      ></label
    >
    <label class="desktop-lyric-control desktop-lyric-range-control"
      ><span class="desktop-lyric-control-copy"><strong>阴影水平偏移</strong></span
      ><span class="range-row"
        ><input
          id="desktopLyricShadowOffsetX"
          class="parameter-range parameter-range--centered"
          type="range"
          min="-20"
          max="20"
          step="1"
          value="0"
        /><input id="desktopLyricShadowOffsetXNumber" type="number" min="-20" max="20" step="1" value="0" /><span
          class="desktop-lyric-unit"
          >px</span
        ></span
      ></label
    >
    <label class="desktop-lyric-control desktop-lyric-range-control"
      ><span class="desktop-lyric-control-copy"><strong>阴影垂直偏移</strong></span
      ><span class="range-row"
        ><input
          id="desktopLyricShadowOffsetY"
          class="parameter-range parameter-range--centered"
          type="range"
          min="-20"
          max="20"
          step="1"
          value="3"
        /><input id="desktopLyricShadowOffsetYNumber" type="number" min="-20" max="20" step="1" value="3" /><span
          class="desktop-lyric-unit"
          >px</span
        ></span
      ></label
    >
  </div>
</details>
