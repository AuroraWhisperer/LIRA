<details class="desktop-lyric-settings-group is-content" open>
  <summary>
    <span><strong>显示策略</strong></span
    ><span class="desktop-lyric-group-count">6 项</span>
  </summary>
  <div class="desktop-lyric-group-body desktop-lyric-settings-fields">
    <section
      class="desktop-lyric-karaoke-card"
      aria-labelledby="desktopLyricKaraokeTitle"
    >
      <div class="desktop-lyric-karaoke-heading">
        <div class="desktop-lyric-control-copy">
          <strong id="desktopLyricKaraokeTitle"
            >逐字高亮方式
            <lira-help
              ><span id="desktopLyricKaraokeHint"
                >连续填充更细腻；逐字点亮按时间点切换，更省资源。</span
              ></lira-help
            ></strong
          >
        </div>
        <span class="desktop-lyric-karaoke-badge">高亮</span>
      </div>
      <div
        id="desktopLyricKaraokeMode"
        class="desktop-lyric-karaoke-options"
        role="radiogroup"
        aria-labelledby="desktopLyricKaraokeTitle"
        aria-describedby="desktopLyricKaraokeHint"
      >
        <label class="desktop-lyric-karaoke-option">
          <input type="radio" name="desktopLyricKaraokeMode" value="off" />
          <span class="desktop-lyric-karaoke-choice"
            ><strong>关闭</strong><small>整句显示</small></span
          >
        </label>
        <label class="desktop-lyric-karaoke-option">
          <input
            type="radio"
            name="desktopLyricKaraokeMode"
            value="continuous"
            checked
          />
          <span class="desktop-lyric-karaoke-choice"
            ><strong>连续填充</strong><small>细腻跟随</small></span
          >
        </label>
        <label class="desktop-lyric-karaoke-option">
          <input type="radio" name="desktopLyricKaraokeMode" value="discrete" />
          <span class="desktop-lyric-karaoke-choice"
            ><strong>逐字点亮</strong><small>低功耗</small></span
          >
        </label>
      </div>
      <div class="desktop-lyric-karaoke-legend" aria-label="逐字高亮状态示例">
        <span><i class="is-complete" aria-hidden="true">唱</i>已唱</span>
        <span><i class="is-upcoming" aria-hidden="true">词</i>未唱</span>
      </div>
    </section>
    <input id="desktopLyricKaraokeEnabled" type="checkbox" hidden />
    <div class="desktop-lyric-control">
      <span class="desktop-lyric-control-copy"
        ><strong>显示翻译歌词</strong></span
      ><label class="switch-control"
        ><input id="desktopLyricShowTranslation" type="checkbox" checked /><span
          class="switch-track"
          aria-hidden="true"
        ></span
      ></label>
    </div>
    <label class="desktop-lyric-control desktop-lyric-range-control"
      ><span class="desktop-lyric-control-copy"
        ><strong>翻译行缩放比例</strong></span
      ><span class="range-row"
        ><input
          id="desktopLyricTranslationScale"
          class="parameter-range parameter-range--scale"
          type="range"
          min="0.4"
          max="1"
          step="0.05"
          value="0.65"
        /><input
          id="desktopLyricTranslationScaleNumber"
          type="number"
          min="40"
          max="100"
          step="5"
          value="65"
        /><span class="desktop-lyric-unit">%</span></span
      ></label
    >
    <div class="desktop-lyric-control">
      <span class="desktop-lyric-control-copy"
        ><strong>隐藏已唱歌词</strong></span
      ><label class="switch-control"
        ><input id="desktopLyricHidePassedLines" type="checkbox" /><span
          class="switch-track"
          aria-hidden="true"
        ></span
      ></label>
    </div>
    <div class="desktop-lyric-control">
      <span class="desktop-lyric-control-copy"
        ><strong
          >繁体中文模式 <lira-help>优先使用字体的繁体字形。</lira-help></strong
        ></span
      ><label class="switch-control"
        ><input id="desktopLyricTraditionalMode" type="checkbox" /><span
          class="switch-track"
          aria-hidden="true"
        ></span
      ></label>
    </div>
    <label class="desktop-lyric-control desktop-lyric-range-control"
      ><span class="desktop-lyric-control-copy"
        ><strong>间奏提示点位置</strong></span
      ><span class="range-row"
        ><input
          id="desktopLyricInterludeOffsetEm"
          class="parameter-range parameter-range--centered"
          type="range"
          min="-10"
          max="10"
          step="0.5"
          value="0"
        /><input
          id="desktopLyricInterludeOffsetEmNumber"
          type="number"
          min="-10"
          max="10"
          step="0.5"
          value="0"
        /><span class="desktop-lyric-unit">em</span></span
      ></label
    >
  </div>
</details>

<details class="desktop-lyric-settings-group is-visibility">
  <summary>
    <span><strong>可见性与同步</strong></span
    ><span class="desktop-lyric-group-count">8 项</span>
  </summary>
  <div class="desktop-lyric-group-body desktop-lyric-settings-fields">
    <div class="desktop-lyric-control">
      <span class="desktop-lyric-control-copy"><strong>暂停时隐藏</strong></span
      ><label class="switch-control"
        ><input id="desktopLyricHideOnPause" type="checkbox" /><span
          class="switch-track"
          aria-hidden="true"
        ></span
      ></label>
    </div>
    <div class="desktop-lyric-control">
      <span class="desktop-lyric-control-copy"
        ><strong>增强当前歌词行</strong></span
      ><label class="switch-control"
        ><input
          id="desktopLyricCurrentLineEnhanced"
          type="checkbox"
          checked /><span class="switch-track" aria-hidden="true"></span
      ></label>
    </div>
    <label class="desktop-lyric-control desktop-lyric-range-control"
      ><span class="desktop-lyric-control-copy"
        ><strong>歌词文字不透明度</strong></span
      ><span class="range-row"
        ><input
          id="desktopLyricOpacity"
          class="parameter-range parameter-range--intensity"
          type="range"
          min="0"
          max="1"
          step="0.05"
          value="0.95"
        /><input
          id="desktopLyricOpacityNumber"
          type="number"
          min="0"
          max="100"
          step="5"
          value="95"
        /><span class="desktop-lyric-unit">%</span></span
      ></label
    >
    <label class="desktop-lyric-control desktop-lyric-range-control"
      ><span class="desktop-lyric-control-copy"
        ><strong>未唱歌词不透明度</strong></span
      ><span class="range-row"
        ><input
          id="desktopLyricBaseOpacity"
          class="parameter-range parameter-range--intensity"
          type="range"
          min="0"
          max="1"
          step="0.05"
          value="0.38"
        /><input
          id="desktopLyricBaseOpacityNumber"
          type="number"
          min="0"
          max="100"
          step="5"
          value="38"
        /><span class="desktop-lyric-unit">%</span></span
      ></label
    >
    <label class="desktop-lyric-control desktop-lyric-range-control"
      ><span class="desktop-lyric-control-copy"
        ><strong>翻译歌词不透明度</strong></span
      ><span class="range-row"
        ><input
          id="desktopLyricTranslationOpacity"
          class="parameter-range parameter-range--intensity"
          type="range"
          min="0"
          max="1"
          step="0.05"
          value="0.72"
        /><input
          id="desktopLyricTranslationOpacityNumber"
          type="number"
          min="0"
          max="100"
          step="5"
          value="72"
        /><span class="desktop-lyric-unit">%</span></span
      ></label
    >
    <label class="desktop-lyric-control desktop-lyric-range-control"
      ><span class="desktop-lyric-control-copy"
        ><strong
          >时间偏移
          <lira-help>正值让歌词提前；负值让歌词延后。</lira-help></strong
        ></span
      ><span class="range-row"
        ><input
          id="desktopLyricTimeOffsetMs"
          class="parameter-range parameter-range--centered"
          type="range"
          min="-5000"
          max="5000"
          step="50"
          value="0"
        /><input
          id="desktopLyricTimeOffsetMsNumber"
          type="number"
          min="-5000"
          max="5000"
          step="50"
          value="0"
        /><span class="desktop-lyric-unit">ms</span></span
      ></label
    >
    <div class="desktop-lyric-control">
      <span class="desktop-lyric-control-copy"
        ><strong>无歌词显示歌名</strong></span
      ><label class="switch-control"
        ><input id="desktopLyricShowTitleWhenNoLyric" type="checkbox" /><span
          class="switch-track"
          aria-hidden="true"
        ></span
      ></label>
    </div>
    <label class="desktop-lyric-control"
      ><span class="desktop-lyric-control-copy"
        ><strong
          >无歌词提示文字 <lira-help>没有歌词和歌名时显示。</lira-help></strong
        ></span
      ><input
        id="desktopLyricNoLyricText"
        type="text"
        value="纯音乐，请欣赏"
        maxlength="80"
    /></label>
  </div>
</details>
