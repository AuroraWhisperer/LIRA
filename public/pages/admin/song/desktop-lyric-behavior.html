<div class="desktop-lyric-control desktop-lyric-karaoke-control" aria-labelledby="desktopLyricKaraokeTitle">
  <div class="desktop-lyric-control-copy">
    <strong id="desktopLyricKaraokeTitle"
      >逐字高亮方式
      <lira-help
        ><span id="desktopLyricKaraokeHint">「连续填充」像 KTV 一样平滑扫过每个字；「逐字点亮」按节拍整字变色，更省显卡。</span></lira-help
      ></strong
    >
  </div>
  <div
    id="desktopLyricKaraokeMode"
    class="desktop-lyric-karaoke-options"
    role="radiogroup"
    aria-labelledby="desktopLyricKaraokeTitle"
    aria-describedby="desktopLyricKaraokeHint"
  >
    <label class="desktop-lyric-karaoke-option">
      <input type="radio" name="desktopLyricKaraokeMode" value="off" />
      <span class="desktop-lyric-karaoke-choice"><strong>关闭</strong><small>整句显示</small></span>
    </label>
    <label class="desktop-lyric-karaoke-option">
      <input type="radio" name="desktopLyricKaraokeMode" value="continuous" checked />
      <span class="desktop-lyric-karaoke-choice"><strong>连续填充</strong><small>细腻跟随</small></span>
    </label>
    <label class="desktop-lyric-karaoke-option">
      <input type="radio" name="desktopLyricKaraokeMode" value="discrete" />
      <span class="desktop-lyric-karaoke-choice"><strong>逐字点亮</strong><small>低功耗</small></span>
    </label>
  </div>
</div>
<div class="desktop-lyric-control">
  <div class="desktop-lyric-control-copy">
    <strong id="desktopLyricSungColorLabel">已唱颜色</strong>
    <label class="hint"><input id="desktopLyricSungColorInherited" type="checkbox" checked />跟随样式</label>
  </div>
  <input id="desktopLyricSungColor" type="color" value="#ffcf4a" aria-labelledby="desktopLyricSungColorLabel" disabled />
</div>
<div class="desktop-lyric-control">
  <div class="desktop-lyric-control-copy">
    <strong id="desktopLyricTextColorLabel">未唱颜色</strong>
    <small>同时用于普通整句、翻译和罗马音</small>
  </div>
  <input id="desktopLyricTextColor" type="color" value="#000000" aria-labelledby="desktopLyricTextColorLabel" />
</div>
<input id="desktopLyricKaraokeEnabled" type="checkbox" hidden />
<div class="desktop-lyric-control">
  <span class="desktop-lyric-control-copy"><strong><span id="desktopLyricShowTranslationLabel">显示翻译歌词</span></strong></span
  ><label class="switch-control"
    ><input aria-labelledby="desktopLyricShowTranslationLabel" id="desktopLyricShowTranslation" type="checkbox" checked /><span
      class="switch-track"
      aria-hidden="true"
    ></span
  ></label>
</div>
<div class="desktop-lyric-control">
  <span class="desktop-lyric-control-copy"><strong><span id="desktopLyricShowRomaLabel">显示罗马音</span></strong><small>用拉丁字母标注发音，由歌词来源提供</small></span
  ><label class="switch-control"
    ><input aria-labelledby="desktopLyricShowRomaLabel" id="desktopLyricShowRoma" type="checkbox" checked /><span
      class="switch-track"
      aria-hidden="true"
    ></span
  ></label>
</div>
<label class="desktop-lyric-control desktop-lyric-range-control"
  ><span class="desktop-lyric-control-copy"><strong><span id="desktopLyricTranslationScaleLabel">翻译 / 罗马音字号</span> <lira-help>按正文字号的比例缩放（例如设为 65%，翻译字号就是正文的 65%，罗马音会在此基础上再略小一点）。</lira-help></strong></span
  ><span class="range-row"
    ><input
      aria-labelledby="desktopLyricTranslationScaleLabel" id="desktopLyricTranslationScale"
      class="parameter-range parameter-range--scale"
      type="range"
      min="0.4"
      max="1"
      step="0.05"
      value="0.65"
    /><span class="lira-number-field"><input aria-labelledby="desktopLyricTranslationScaleLabel" id="desktopLyricTranslationScaleNumber" type="number" min="40" max="100" step="5" value="65" /><span class="lira-number-field-unit" aria-hidden="true">%</span></span></span
  ></label
>
<div class="desktop-lyric-control">
  <span class="desktop-lyric-control-copy"><strong><span id="desktopLyricHidePassedLinesLabel">隐藏已唱歌词</span></strong></span
  ><label class="switch-control"
    ><input aria-labelledby="desktopLyricHidePassedLinesLabel" id="desktopLyricHidePassedLines" type="checkbox" /><span class="switch-track" aria-hidden="true"></span
  ></label>
</div>
<div class="desktop-lyric-control">
  <span class="desktop-lyric-control-copy"
    ><strong><span id="desktopLyricTraditionalModeLabel">优先使用繁体字形</span> <lira-help>调用字体自带的繁体字形显示（需所选字体本身支持），不会改写原歌词文字。</lira-help></strong></span
  ><label class="switch-control"
    ><input aria-labelledby="desktopLyricTraditionalModeLabel" id="desktopLyricTraditionalMode" type="checkbox" /><span class="switch-track" aria-hidden="true"></span
  ></label>
</div>
<label class="desktop-lyric-control desktop-lyric-range-control"
  ><span class="desktop-lyric-control-copy"><strong><span id="desktopLyricInterludeOffsetEmLabel">间奏提示点位置</span></strong></span
  ><span class="range-row"
    ><input
      aria-labelledby="desktopLyricInterludeOffsetEmLabel" id="desktopLyricInterludeOffsetEm"
      class="parameter-range parameter-range--centered"
      type="range"
      min="-10"
      max="10"
      step="0.5"
      value="0"
    /><span class="lira-number-field"><input aria-labelledby="desktopLyricInterludeOffsetEmLabel" id="desktopLyricInterludeOffsetEmNumber" type="number" min="-10" max="10" step="0.5" value="0" /><span class="lira-number-field-unit" aria-hidden="true">em</span></span></span
  ></label
>

<div class="desktop-lyric-control">
  <span class="desktop-lyric-control-copy"><strong><span id="desktopLyricHideOnPauseLabel">暂停时隐藏</span></strong></span
  ><label class="switch-control"
    ><input aria-labelledby="desktopLyricHideOnPauseLabel" id="desktopLyricHideOnPause" type="checkbox" /><span class="switch-track" aria-hidden="true"></span
  ></label>
</div>
<div class="desktop-lyric-control">
  <span class="desktop-lyric-control-copy"><strong><span id="desktopLyricCurrentLineEnhancedLabel">当前行底板</span> <lira-help>为当前句添加半透明底板和光晕。关闭后仍保留逐字高亮。</lira-help></strong></span
  ><label class="switch-control"
    ><input aria-labelledby="desktopLyricCurrentLineEnhancedLabel" id="desktopLyricCurrentLineEnhanced" type="checkbox" /><span
      class="switch-track"
      aria-hidden="true"
    ></span
  ></label>
</div>
<label class="desktop-lyric-control desktop-lyric-range-control"
  ><span class="desktop-lyric-control-copy"><strong><span id="desktopLyricOpacityLabel">歌词文字不透明度</span> <lira-help>统一控制所有歌词文字的透明度；如果还想单独调已唱或未唱的透明度，可在上方颜色选择器里分别设置。</lira-help></strong></span
  ><span class="range-row"
    ><input
      aria-labelledby="desktopLyricOpacityLabel" id="desktopLyricOpacity"
      class="parameter-range parameter-range--intensity"
      type="range"
      min="0"
      max="1"
      step="0.05"
      value="0.95"
    /><span class="lira-number-field"><input aria-labelledby="desktopLyricOpacityLabel" id="desktopLyricOpacityNumber" type="number" min="0" max="100" step="5" value="95" /><span class="lira-number-field-unit" aria-hidden="true">%</span></span></span
  ></label
>
<label class="desktop-lyric-control desktop-lyric-range-control"
  ><span class="desktop-lyric-control-copy"><strong><span id="desktopLyricBaseOpacityLabel">非当前行不透明度</span></strong></span
  ><span class="range-row"
    ><input
      aria-labelledby="desktopLyricBaseOpacityLabel" id="desktopLyricBaseOpacity"
      class="parameter-range parameter-range--intensity"
      type="range"
      min="0"
      max="1"
      step="0.05"
      value="0.38"
    /><span class="lira-number-field"><input aria-labelledby="desktopLyricBaseOpacityLabel" id="desktopLyricBaseOpacityNumber" type="number" min="0" max="100" step="5" value="38" /><span class="lira-number-field-unit" aria-hidden="true">%</span></span></span
  ></label
>
<label class="desktop-lyric-control desktop-lyric-range-control"
  ><span class="desktop-lyric-control-copy"><strong><span id="desktopLyricTranslationOpacityLabel">翻译歌词不透明度</span></strong></span
  ><span class="range-row"
    ><input
      aria-labelledby="desktopLyricTranslationOpacityLabel" id="desktopLyricTranslationOpacity"
      class="parameter-range parameter-range--intensity"
      type="range"
      min="0"
      max="1"
      step="0.05"
      value="0.72"
    /><span class="lira-number-field"><input aria-labelledby="desktopLyricTranslationOpacityLabel" id="desktopLyricTranslationOpacityNumber" type="number" min="0" max="100" step="5" value="72" /><span class="lira-number-field-unit" aria-hidden="true">%</span></span></span
  ></label
>
<label class="desktop-lyric-control desktop-lyric-range-control"
  ><span class="desktop-lyric-control-copy"
    ><strong><span id="desktopLyricTimeOffsetMsLabel">歌词画面时间偏移</span> <lira-help>正数让歌词提前出现，负数让歌词延后。用全民 K 歌时，会与「播放 → 全民 K 歌」里的时间调整叠加。</lira-help></strong></span
  ><span class="range-row"
    ><input
      aria-labelledby="desktopLyricTimeOffsetMsLabel" id="desktopLyricTimeOffsetMs"
      class="parameter-range parameter-range--centered"
      type="range"
      min="-5000"
      max="5000"
      step="50"
      value="0"
    /><span class="lira-number-field"><input aria-labelledby="desktopLyricTimeOffsetMsLabel" id="desktopLyricTimeOffsetMsNumber" type="number" min="-5000" max="5000" step="50" value="0" /><span class="lira-number-field-unit" aria-hidden="true">ms</span></span></span
  ></label
>
<div class="desktop-lyric-control">
  <span class="desktop-lyric-control-copy"><strong><span id="desktopLyricShowTitleWhenNoLyricLabel">无歌词时显示歌名</span></strong></span
  ><label class="switch-control"
    ><input aria-labelledby="desktopLyricShowTitleWhenNoLyricLabel" id="desktopLyricShowTitleWhenNoLyric" type="checkbox" /><span
      class="switch-track"
      aria-hidden="true"
    ></span
  ></label>
</div>
<label class="desktop-lyric-control"
  ><span class="desktop-lyric-control-copy"
    ><strong>无歌词提示文字 <lira-help>纯音乐或搜不到歌词（且未开启「无歌词时显示歌名」）时显示的兜底文字。</lira-help></strong></span
  ><input id="desktopLyricNoLyricText" type="text" value="纯音乐，请欣赏" maxlength="80"
/></label>
