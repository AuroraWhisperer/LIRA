<section
  id="desktopLyricLivePreview"
  class="desktop-lyric-preview-card"
  aria-labelledby="desktopLyricPreviewTitle"
>
  <header class="desktop-lyric-preview-header">
    <div>
      <h3 id="desktopLyricPreviewTitle">桌面歌词实时预览</h3>
    </div>
    <div class="desktop-lyric-preview-tools">
      <div class="desktop-lyric-preview-backgrounds" aria-label="预览背景">
        <button
          class="active"
          type="button"
          data-lyric-preview-background="grid"
          aria-pressed="true"
        >
          网格背景
        </button>
        <button
          type="button"
          data-lyric-preview-background="solid"
          aria-pressed="false"
        >
          纯色背景
        </button>
      </div>
      <button id="desktopLyricCopyUrlBtn" type="button">复制桌面歌词</button>
      <span id="desktopLyricPreviewStatus" class="pill warn">等待播放</span>
    </div>
  </header>
  <div id="desktopLyricPreviewStage" class="desktop-lyric-preview-stage">
    <div
      id="desktopLyricPreviewViewport"
      class="desktop-lyric-preview-viewport"
      tabindex="0"
      aria-label="完整歌词，可上下滚动查看"
    >
      <div
        id="desktopLyricPreviewTimeline"
        class="desktop-lyric-preview-timeline"
        role="list"
      >
        <div class="desktop-lyric-preview-empty">
          等待播放 · 歌词将在载入后完整显示
        </div>
      </div>
    </div>
    <div
      id="desktopLyricPreviewPlayback"
      class="desktop-lyric-preview-playback"
      aria-live="polite"
    ></div>
    <div class="desktop-lyric-preview-progress" aria-hidden="true">
      <span id="desktopLyricPreviewProgress"></span>
    </div>
  </div>
</section>
