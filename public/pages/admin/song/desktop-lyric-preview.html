<section id="desktopLyricLivePreview" class="desktop-lyric-preview-card" aria-label="直播歌词预览">
  <header class="desktop-lyric-preview-header">
    <strong class="ui-section-title">歌词预览</strong>
    <span id="desktopLyricPreviewStatus" class="pill warn">等待播放</span>
  </header>
  <div id="desktopLyricPreviewStage" class="desktop-lyric-preview-stage is-solid">
    <div
      id="desktopLyricPreviewViewport"
      class="desktop-lyric-preview-viewport"
      tabindex="0"
      aria-label="完整歌词，可上下滚动查看"
    >
      <div id="desktopLyricPreviewTimeline" class="desktop-lyric-preview-timeline" role="list">
        <div class="desktop-lyric-preview-empty">等待播放 · 歌词将在载入后完整显示</div>
      </div>
    </div>
    <div id="advancedLyricPreviewStage" class="advanced-lyric-preview-stage" hidden></div>
    <div id="desktopLyricPreviewPlayback" class="desktop-lyric-preview-playback" aria-live="polite"></div>
  </div>
  <footer class="desktop-lyric-preview-footer">
    <div class="desktop-lyric-preview-backgrounds" role="group" aria-label="预览背景">
      <button class="active" type="button" data-lyric-preview-background="solid" aria-pressed="true">纯色</button>
      <button type="button" data-lyric-preview-background="grid" aria-pressed="false">网格</button>
    </div>
    <div class="desktop-lyric-preview-source">
      <button id="desktopLyricCopyUrlBtn" type="button">复制基础歌词地址</button>
      <lira-help label="歌词预览说明">复制地址，添加到 OBS / 哔哩哔哩直播姬的浏览器源。预览底色仅辅助查看，直播背景透明。高级样式可拖动预览调整位置，松开后自动保存；精确调整见「编排」。</lira-help>
    </div>
  </footer>
</section>
