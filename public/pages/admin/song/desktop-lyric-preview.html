<section id="desktopLyricLivePreview" class="desktop-lyric-preview-card" aria-label="直播歌词预览">
  <header class="desktop-lyric-preview-header">
    <strong class="ui-section-title">歌词预览</strong>
    <span id="desktopLyricPreviewStatus" class="pill warn">等待播放</span>
  </header>
  <div id="desktopLyricPreviewStage" class="desktop-lyric-preview-stage">
    <div
      id="desktopLyricPreviewViewport"
      class="desktop-lyric-preview-viewport"
      tabindex="0"
      aria-label="完整歌词，可上下滚动查看"
    >
      <div id="desktopLyricPreviewTimeline" class="desktop-lyric-preview-timeline" role="list">
        <div class="desktop-lyric-preview-empty">等待播放 · 歌词将在载入后完整显示</div>
      </div>
    </div>
    <div id="advancedLyricPreviewStage" class="advanced-lyric-preview-stage" hidden></div>
    <div id="desktopLyricPreviewPlayback" class="desktop-lyric-preview-playback" aria-live="polite"></div>
  </div>
  <footer class="desktop-lyric-preview-footer">
    <div class="desktop-lyric-preview-tools">
      <div class="desktop-lyric-preview-backgrounds" aria-label="试播编排">
        <button id="desktopLyricSampleBtn" type="button" aria-pressed="false" title="只在预览中试播短句、长句和快句">示例试播</button>
        <span class="desktop-lyric-preview-sample-select">
          <select id="desktopLyricSampleSegment" aria-label="跳到试播片段" title="选择片段，仅在预览中试播">
            <option value="" disabled selected>选段试播</option>
            <option value="0">短句</option>
            <option value="1">长句</option>
            <option value="2">快句</option>
            <option value="3">英文</option>
            <option value="4">长音</option>
          </select>
        </span>
        <button id="desktopLyricCurrentBtn" type="button" hidden>当前歌曲</button>
      </div>
      <div class="desktop-lyric-preview-backgrounds" aria-label="预览背景">
        <button class="active" type="button" data-lyric-preview-background="grid" aria-pressed="true">网格背景</button>
        <button type="button" data-lyric-preview-background="solid" aria-pressed="false">纯色背景</button>
      </div>
      <span>
        <button id="desktopLyricCopyUrlBtn" type="button" title="复制两种歌词共用的浏览器源地址">复制合并地址</button>
        <lira-help>用于 OBS / 哔哩哔哩直播姬浏览器源。外观设置会同步到画布中同样式的歌词组件。画布的位置、尺寸和图层需点击「保存并应用」。</lira-help>
      </span>
    </div>
    <p class="hint advanced-lyric-position-hint">拖动画面调整歌词位置，松开后自动保存；精确调整见「编排」。</p>
  </footer>
</section>
