<div id="songAssistantPage" class="main-page active">
  <section class="song-workspace" tabindex="0" aria-label="点歌工作区">
    <div class="queues-row">
      <section class="panel queue-panel sc-queue-panel">
        <div class="panel-header">
          <div class="queue-heading">
            <h2 class="ui-section-title">
              <span class="queue-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 15.5a2 2 0 0 1-2 2H8l-4 3.5V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z" /><path d="M8.5 9h7" /><path d="M8.5 12.5h4.5" /></svg></span>SC 队列
            </h2>
            <span id="superChatSize" class="pill">0 条</span>
          </div>
          <div class="actions">
            <button id="clearSuperChatsBtn" class="danger" type="button">
              <svg class="queue-action-icon" aria-hidden="true">
                <use href="/img/admin/workbench-icons.svg#trash"></use>
              </svg>
              清空 SC 记录
            </button>
          </div>
        </div>
        <div class="panel-body">
          <div id="superChatList" class="queue-list sc-list" tabindex="0" role="region" aria-label="SC 队列"></div>
        </div>
      </section>

      <section class="panel queue-panel song-queue-panel">
        <div class="panel-header">
          <div class="queue-heading">
            <h2 class="ui-section-title">
              <span class="queue-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 15V6" /><path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" /><path d="M12 12H3" /><path d="M16 6H3" /><path d="M12 18H3" /></svg></span>点歌队列
            </h2>
            <span id="queueSize" class="pill">0 首</span>
          </div>
          <div class="actions">
            <button id="randomSongBtn" class="primary" type="button">
              <svg class="queue-action-icon" aria-hidden="true">
                <use href="/img/admin/workbench-icons.svg#shuffle"></use>
              </svg>
              随机点歌
            </button>
            <button id="nextBtn" class="primary" type="button">
              <svg class="queue-action-icon" aria-hidden="true">
                <use href="/img/admin/workbench-icons.svg#skip-forward"></use>
              </svg>
              切歌
            </button>
            <button id="clearBtn" class="danger" type="button">
              <svg class="queue-action-icon" aria-hidden="true">
                <use href="/img/admin/workbench-icons.svg#trash"></use>
              </svg>
              清空全部队列
            </button>
          </div>
        </div>
        <div class="panel-body">
          <div id="queueList" class="queue-list" tabindex="0" role="region" aria-label="点歌队列"></div>
        </div>
      </section>
    </div>

    <div class="tools-section">
      <section class="panel song-management-panel">
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="songsPage" type="button">
            歌库
          </button>
          <button class="tab" data-tab="settingsPage" type="button">
            设置
          </button>
          <button class="tab" data-tab="themePage" type="button">点歌板</button>
          <button class="tab" data-tab="displayPage" type="button">
            展示板
          </button>
          <div class="tab-with-help">
            <button class="tab" data-tab="overlayPage" type="button">
              浏览器源
            </button>
            <lira-help label="浏览器源使用说明"
              >将直播画面地址添加到 OBS 或哔哩哔哩直播姬的浏览器源 / 网页来源。「网页页面」可直接用浏览器打开。
              本机地址需要 LIRA 保持运行，并与直播软件在同一台电脑；在线弹幕姬地址在关闭 LIRA 后仍可展示。</lira-help
            >
          </div>
          <button class="tab" data-tab="importPage" type="button">
            导入导出
          </button>
          <button class="tab" data-tab="desktopLyricPage" type="button">
            桌面歌词设置
          </button>
        </div>
