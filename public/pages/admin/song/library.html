<div id="songsPage" class="tab-page active">
  <div class="panel-body stack">
    <form id="songForm">
      <input id="songId" type="hidden" />
      <div class="song-form-fields">
        <label>
          歌曲名字
          <input id="songName" required />
        </label>
        <label>
          原唱/首发歌手
          <input id="songArtist" />
        </label>
        <label>
          歌曲分类
          <input id="songCategory" value="默认" />
        </label>
        <label>
          <span class="song-form-label-line">
            是否可点
            <span class="hint">停用后不公开</span>
          </span>
          <select id="songIsEnabled" data-dropdown-variant="settings">
            <option value="true">是</option>
            <option value="false">否</option>
          </select>
        </label>
        <label>
          歌曲标签
          <input id="songTags" placeholder="逗号分隔" />
        </label>
        <label>
          语言
          <input id="songLanguage" placeholder="如：国语" />
        </label>
        <label>
          核对平台
          <input id="songSourcePlatform" placeholder="QQ音乐 / 网易云音乐" />
        </label>
        <label>
          核对备注
          <input id="songNote" />
        </label>
      </div>
      <div class="song-form-details">
        <label>
          <span class="song-form-detail-heading">歌切</span>
          <textarea id="songClip" rows="3" placeholder="链接 / BV号 / 时间点 / 说明"></textarea>
        </label>
        <div class="song-form-pricing">
          <div class="song-form-detail-heading">
            <label for="songRequestPrice">点歌价格</label>
            <div class="song-form-preset">
              <select id="songPricePreset" aria-label="点歌价格快捷填写" data-dropdown-variant="settings">
                <option value="">快捷填写</option>
                <option value="免费">免费</option>
                <option value="舰长">舰长</option>
                <option value="提督">提督</option>
                <option value="总督">总督</option>
                <option value="金额元SC">SC（填写金额）</option>
              </select>
            </div>
          </div>
          <textarea id="songRequestPrice" rows="3" aria-describedby="songPriceHint songPriceLength"></textarea>
          <div class="song-form-price-meta">
            <span id="songPriceHint" class="hint">留空时网页不显示价格</span>
            <span id="songPriceLength" class="hint">0 / 1000</span>
          </div>
          <div class="song-form-price-preview">
            <span class="hint">价格预览</span>
            <p id="songPricePreview"></p>
          </div>
        </div>
      </div>
      <div class="form-actions-row song-form-actions">
        <button id="resetSongForm" type="button">清空表单</button>
        <button class="primary" type="submit">保存歌曲</button>
      </div>
    </form>

    <hr class="section-divider" />

    <div class="grid-3">
      <label>
        搜索
        <input id="songSearch" placeholder="歌名、歌手、分类或标签" />
      </label>
      <div class="category-filter-field">
        <span>分类</span>
        <details id="categoryFilter" class="category-filter" name="songLibraryFilter">
          <summary>
            <span id="categoryFilterSummary">全部分类</span>
            <span class="category-filter-hint">可多选</span>
          </summary>
          <div class="category-filter-menu">
            <div
              id="categoryFilterOptions"
              class="category-filter-options"
              role="group"
              aria-label="分类（可多选）"
            ></div>
            <button id="clearCategoryFilter" class="category-filter-clear" type="button">清除选择</button>
          </div>
        </details>
      </div>
      <label>
        语言
        <select id="languageFilter" data-dropdown-variant="filter"></select>
      </label>
    </div>
    <div class="grid-3">
      <label>
        歌手
        <select id="artistFilter" data-dropdown-variant="filter"></select>
      </label>
      <div class="category-filter-field">
        <span>标签</span>
        <details id="tagFilter" class="category-filter" name="songLibraryFilter">
          <summary>
            <span id="tagFilterSummary" class="category-filter-summary">全部标签</span>
            <span class="category-filter-hint">可多选</span>
          </summary>
          <div class="category-filter-menu">
            <div id="tagFilterOptions" class="category-filter-options" role="group" aria-label="标签（可多选）"></div>
            <button id="clearTagFilter" class="category-filter-clear" type="button">清除选择</button>
          </div>
        </details>
      </div>
      <label>
        只看可点
        <select id="enabledFilter" data-dropdown-variant="filter">
          <option value="false">全部歌曲</option>
          <option value="true">只看可点</option>
        </select>
      </label>
    </div>

    <div class="song-library-summary">
      <span id="songCount" class="pill">歌库共 0 首</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>首字母</th>
            <th>歌曲名字</th>
            <th>原唱/首发歌手</th>
            <th>歌曲分类</th>
            <th>歌曲标签</th>
            <th>语言</th>
            <th>状态</th>
            <th>点歌价格</th>
            <th id="songNoteColumnHeader">核对备注</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="songsTable"></tbody>
      </table>
    </div>
  </div>
</div>
