<div class="desktop-lyric-control">
  <span class="desktop-lyric-control-copy"><strong><span id="desktopLyricBackgroundEnabledLabel">显示背景</span></strong></span
  ><label class="switch-control"
    ><input aria-labelledby="desktopLyricBackgroundEnabledLabel" id="desktopLyricBackgroundEnabled" type="checkbox" /><span
      class="switch-track"
      aria-hidden="true"
    ></span
  ></label>
</div>
<label class="desktop-lyric-control"
  ><span class="desktop-lyric-control-copy"><strong>背景效果</strong></span
  ><select id="desktopLyricBackgroundRenderer" data-dropdown-variant="settings">
    <option value="mesh" selected>网格渐变</option>
    <option value="aurora">柔光渐变</option>
    <option value="solid">纯色暗幕</option>
  </select></label
>
<label class="desktop-lyric-control desktop-lyric-range-control"
  ><span class="desktop-lyric-control-copy"
    ><strong><span id="desktopLyricBgOpacityLabel">背景不透明度</span> <lira-help>控制背景图层的不透明度。</lira-help></strong></span
  ><span class="range-row"
    ><input
      aria-labelledby="desktopLyricBgOpacityLabel" id="desktopLyricBgOpacity"
      class="parameter-range parameter-range--intensity"
      type="range"
      min="0"
      max="1"
      step="0.05"
      value="0.15"
    /><input aria-labelledby="desktopLyricBgOpacityLabel" id="desktopLyricBgOpacityNumber" type="number" min="0" max="100" step="5" value="15" /><span
      class="desktop-lyric-unit"
      >%</span
    ></span
  ></label
>
<label class="desktop-lyric-control desktop-lyric-range-control"
  ><span class="desktop-lyric-control-copy"
    ><strong><span id="desktopLyricGlobalOpacityLabel">全局不透明度</span> <lira-help>控制整个歌词画面的不透明度。</lira-help></strong></span
  ><span class="range-row"
    ><input
      aria-labelledby="desktopLyricGlobalOpacityLabel" id="desktopLyricGlobalOpacity"
      class="parameter-range parameter-range--intensity"
      type="range"
      min="0"
      max="1"
      step="0.05"
      value="1"
    /><input aria-labelledby="desktopLyricGlobalOpacityLabel" id="desktopLyricGlobalOpacityNumber" type="number" min="0" max="100" step="5" value="100" /><span
      class="desktop-lyric-unit"
      >%</span
    ></span
  ></label
>
<label class="desktop-lyric-control desktop-lyric-range-control"
  ><span class="desktop-lyric-control-copy"><strong><span id="desktopLyricBrightnessLabel">亮度</span></strong></span
  ><span class="range-row"
    ><input
      aria-labelledby="desktopLyricBrightnessLabel" id="desktopLyricBrightness"
      class="parameter-range parameter-range--intensity"
      type="range"
      min="0.2"
      max="2"
      step="0.05"
      value="1"
    /><input aria-labelledby="desktopLyricBrightnessLabel" id="desktopLyricBrightnessNumber" type="number" min="20" max="200" step="5" value="100" /><span
      class="desktop-lyric-unit"
      >%</span
    ></span
  ></label
>
<label class="desktop-lyric-control desktop-lyric-range-control"
  ><span class="desktop-lyric-control-copy"><strong><span id="desktopLyricContrastLabel">对比度</span></strong></span
  ><span class="range-row"
    ><input
      aria-labelledby="desktopLyricContrastLabel" id="desktopLyricContrast"
      class="parameter-range parameter-range--intensity"
      type="range"
      min="0.2"
      max="2"
      step="0.05"
      value="1"
    /><input aria-labelledby="desktopLyricContrastLabel" id="desktopLyricContrastNumber" type="number" min="20" max="200" step="5" value="100" /><span
      class="desktop-lyric-unit"
      >%</span
    ></span
  ></label
>
<label class="desktop-lyric-control desktop-lyric-range-control"
  ><span class="desktop-lyric-control-copy"><strong><span id="desktopLyricSaturationLabel">饱和度</span></strong></span
  ><span class="range-row"
    ><input
      aria-labelledby="desktopLyricSaturationLabel" id="desktopLyricSaturation"
      class="parameter-range parameter-range--intensity"
      type="range"
      min="0"
      max="2"
      step="0.05"
      value="1"
    /><input aria-labelledby="desktopLyricSaturationLabel" id="desktopLyricSaturationNumber" type="number" min="0" max="200" step="5" value="100" /><span
      class="desktop-lyric-unit"
      >%</span
    ></span
  ></label
>

<section class="desktop-lyric-settings-group desktop-lyric-reset-group">
  <header>
    <span
      ><strong>操作 <lira-help>恢复基础歌词外观与播放设置；高级歌词外观、两种显示开关和音乐来源设置会保留。</lira-help></strong></span
    >
  </header>
  <button id="desktopLyricResetBtn" class="desktop-lyric-reset-button" type="button">恢复基础歌词默认设置</button>
</section>
