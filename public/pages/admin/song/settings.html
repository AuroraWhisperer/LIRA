<div id="settingsPage" class="tab-page">
  <div class="panel-body stack">
    <form id="settingsForm" class="stack">
      <div class="grid-2 bilibili-login-grid">
        <fieldset class="theme-section">
          <legend>
            🔐 B 站账号登录
            <lira-help
              >用于收发弹幕和统计礼物，也可以登录专门的机器人小号。扫码登录后，在右侧填好直播间号并保存即可。默认由云端持续监控，关掉软件也会继续接收（可在弹幕姬和礼物页分别关闭）；退出账号会同时停止弹幕和礼物监控。</lira-help
            >
          </legend>
          <div class="bilibili-auth-row">
            <span id="bilibiliAuthStatus" class="pill warn" style="padding: 2px 7px">本机未登录</span>
            <span id="bilibiliAuthProfile" class="bilibili-auth-profile" hidden>
              <img id="bilibiliAuthAvatar" class="bilibili-auth-avatar" alt="" hidden />
              <span class="bilibili-auth-identity">
                <strong id="bilibiliAuthName" class="bilibili-auth-name"></strong>
                <span id="bilibiliAuthUid" class="bilibili-auth-uid ui-caption"></span>
              </span>
            </span>
            <button
              id="bilibiliLoginBtn"
              class="primary"
              type="button"
              style="padding: 3px 10px; min-height: 30px"
            >
              扫码登录 B 站账号
            </button>
            <button
              id="bilibiliLogoutBtn"
              class="danger"
              type="button"
              style="display: none; padding: 3px 10px; min-height: 30px"
            >
              退出登录
            </button>
          </div>
        </fieldset>

        <fieldset class="theme-section">
          <legend>
            连接你的 B 站直播间
          </legend>
          <div class="bilibili-room-row" aria-live="polite">
            <span id="bilibiliRoomStatus" class="pill warn" style="padding: 2px 7px">未设置</span>
            <strong id="bilibiliRoomHint" class="bilibili-auth-name">填写直播间号后保存设置</strong>
            <input
              id="roomId"
              class="bilibili-room-input"
              aria-label="B 站直播间号或链接"
              placeholder="例如：123456，或粘贴 B 站直播间链接"
            />
          </div>
        </fieldset>
        <fieldset id="bilibiliRoomOverview" class="theme-section bilibili-room-overview" hidden>
          <legend id="bilibiliRoomTitle">直播间资料</legend>
          <div class="bilibili-room-details">
            <div class="bilibili-auth-profile">
              <img id="bilibiliRoomAvatar" class="bilibili-auth-avatar" alt="" hidden />
              <div class="bilibili-auth-identity">
                <div class="bilibili-room-owner-heading">
                  <strong id="bilibiliRoomName" class="bilibili-auth-name"></strong>
                  <span id="bilibiliRoomLevel" class="bilibili-room-level ui-caption" hidden></span>
                </div>
                <div class="bilibili-room-owner-facts ui-caption">
                  <span>粉丝 <span id="bilibiliRoomFollowers">—</span></span>
                  <span>UID <span id="bilibiliRoomUid">—</span></span>
                  <span>粉丝牌 <span id="bilibiliRoomMedal">—</span></span>
                </div>
              </div>
            </div>
            <div class="bilibili-room-info ui-caption">
              <div class="bilibili-room-owner-heading">
                <span>房间号 <span id="bilibiliRoomId"></span></span>
                <span id="bilibiliRoomLiveStatus" class="pill">状态未知</span>
              </div>
              <div>直播分区 <span id="bilibiliRoomArea">—</span></div>
            </div>
            <div class="bilibili-room-news ui-caption">
              <span class="muted">主播公告</span>
              <span id="bilibiliRoomAnnouncement">—</span>
            </div>
            <button id="bilibiliRoomRefreshBtn" type="button">刷新资料</button>
          </div>
        </fieldset>
        <fieldset id="guardExpirySettings" class="theme-section guard-expiry-settings">
          <legend>
            大航海到期同步（可选）
            <lira-help>仅用于同步大航海到期时间（可在网页主播中心查看）。如果上面登录的是机器人小号，可以在这里单独登录主播大号；两边互不影响，切回「使用上方登录账号」会清除单独登录的账号。</lira-help>
          </legend>
          <div class="bilibili-auth-row">
            <label for="guardExpirySource">账号来源</label>
            <select id="guardExpirySource" disabled>
              <option value="shared">使用上方登录账号</option>
              <option value="separate">单独登录主播账号（可选）</option>
            </select>
            <span id="guardExpiryAccountStatus" class="pill" style="padding: 2px 7px">正在读取…</span>
            <span id="guardExpiryAccountProfile" class="bilibili-auth-profile" hidden>
              <img id="guardExpiryAccountAvatar" class="bilibili-auth-avatar" alt="" hidden />
              <span class="bilibili-auth-identity">
                <strong id="guardExpiryAccountName" class="bilibili-auth-name"></strong>
                <span id="guardExpiryAccountUid" class="bilibili-auth-uid ui-caption"></span>
              </span>
            </span>
            <button id="guardExpiryLoginBtn" class="primary" type="button" style="padding: 3px 10px; min-height: 30px" hidden>登录主播账号</button>
            <button id="guardExpiryLogoutBtn" class="danger" type="button" style="padding: 3px 10px; min-height: 30px" hidden>退出主播账号</button>
            <button id="guardExpiryRetryBtn" type="button" hidden>重试</button>
          </div>
          <p id="guardExpiryAccountMessage" class="ui-caption muted" role="status" aria-live="polite"></p>
        </fieldset>
      </div>

      <button class="primary" type="submit">保存设置</button>
    </form>
  </div>
</div>
