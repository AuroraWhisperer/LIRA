<div id="settingsPage" class="tab-page">
  <div class="panel-body stack">
    <form id="settingsForm" class="stack">
      <div class="grid-2 bilibili-login-grid">
        <fieldset class="theme-section">
          <legend>
            🔐 直播账号登录
            <lira-help
              >扫码登录后，填写自己的直播间号，开启接收并保存设置。显示「本机已登录」只说明扫码成功，还要确认连接正常。关闭
              LIRA 后仍会接收；需要停止时关闭接收并保存，或退出直播账号，等待保存成功。</lira-help
            >
          </legend>
          <div class="bilibili-auth-row">
            <span id="bilibiliAuthStatus" class="pill warn" style="padding: 2px 7px">本机未登录</span>
            <span id="bilibiliAuthProfile" class="bilibili-auth-profile" hidden>
              <img id="bilibiliAuthAvatar" class="bilibili-auth-avatar" alt="" hidden />
              <span class="bilibili-auth-identity">
                <strong id="bilibiliAuthName" class="bilibili-auth-name"></strong>
                <span id="bilibiliAuthUid" class="bilibili-auth-uid ui-caption"></span>
              </span>
            </span>
            <button
              id="bilibiliLoginBtn"
              class="primary"
              type="button"
              style="background: #fb7299; border-color: #fb7299; padding: 3px 8px; min-height: 26px"
            >
              📱 扫码登录直播账号
            </button>
            <button
              id="bilibiliLogoutBtn"
              class="danger"
              type="button"
              style="display: none; padding: 3px 8px; min-height: 26px"
            >
              退出登录
            </button>
          </div>
        </fieldset>

        <fieldset class="theme-section">
          <legend>
            连接你的直播间
            <lira-help>请务必填写你自己的直播间房间号或链接，保存设置后显示房主资料。</lira-help>
          </legend>
          <div class="bilibili-room-row" aria-live="polite">
            <span id="bilibiliRoomStatus" class="pill warn" style="padding: 2px 7px">未设置</span>
            <span class="bilibili-auth-profile">
              <img id="bilibiliRoomAvatar" class="bilibili-auth-avatar" alt="" hidden />
              <span class="bilibili-auth-identity">
                <strong id="bilibiliRoomName" class="bilibili-auth-name">填写直播间号后保存设置</strong>
              </span>
            </span>
            <input
              id="roomId"
              class="bilibili-room-input"
              aria-label="直播间号或链接"
              placeholder="例如：123456，或粘贴直播间链接"
            />
          </div>
        </fieldset>
      </div>

      <div class="grid-3">
        <label>
          接收弹幕和礼物
          <select id="enableBilibili" data-dropdown-variant="settings">
            <option value="false">暂不启用</option>
            <option value="true">启用</option>
          </select>
        </label>
        <label>
          暂停接收点歌
          <select id="paused" data-dropdown-variant="settings">
            <option value="false">接收点歌</option>
            <option value="true">暂停点歌</option>
          </select>
        </label>
        <label>
          最多排队歌曲数
          <input id="queueLimit" type="number" min="1" max="300" />
        </label>
        <label>
          同一观众点歌间隔（秒）
          <input id="userCooldownSeconds" type="number" min="0" max="3600" />
        </label>
        <label>
          只允许点歌库歌曲
          <select id="onlyFromLibrary" data-dropdown-variant="settings">
            <option value="false">不限制</option>
            <option value="true">只允许歌库歌曲</option>
          </select>
        </label>
        <label>
          允许重复点歌
          <select id="allowDuplicate" data-dropdown-variant="settings">
            <option value="true">允许</option>
            <option value="false">不允许</option>
          </select>
        </label>
      </div>
      <button class="primary" type="submit">保存设置</button>
    </form>
  </div>
</div>
