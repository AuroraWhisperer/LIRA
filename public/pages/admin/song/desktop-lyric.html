        <div id="desktopLyricPage" class="tab-page">
          <div class="panel-body">
            <div class="desktop-lyric-workspace">
            <section id="desktopLyricForm" class="desktop-lyric-settings stack" aria-labelledby="desktopLyricSettingsTitle">
              <header class="desktop-lyric-settings-header">
                <div>
                  <span class="desktop-lyric-preview-kicker">STYLE CONTROLS</span>
                  <h3 id="desktopLyricSettingsTitle">歌词样式</h3>
                </div>
                <span id="desktopLyricAutosaveState" class="desktop-lyric-autosave-state" aria-live="polite">更改会自动保存</span>
              </header>
              <fieldset class="theme-section">
                <legend>桌面歌词样式</legend>
                <div class="grid-2 desktop-lyric-settings-fields">
                  <label>
                    字体
                    <select id="desktopLyricFontFamily">
                      <option value="Microsoft YaHei, Microsoft JhengHei, PingFang SC, Hiragino Sans GB, Yu Gothic, Meiryo, Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK SC, Noto Sans JP, Noto Sans KR, Segoe UI, Arial, sans-serif">中日英韩通用</option>
                      <option value="Microsoft YaHei">微软雅黑（默认）</option>
                      <option value="PingFang SC, Microsoft YaHei, sans-serif">苹方 · 现代简约</option>
                      <option value="SimHei, Microsoft YaHei, sans-serif">黑体 · 醒目有力</option>
                      <option value="KaiTi, STKaiti, serif">楷体 · 优雅手写</option>
                      <option value="system-ui, -apple-system, sans-serif">系统圆体 · 圆润可爱</option>
                      <option value="SimSun, STSong, serif">宋体 · 传统典雅</option>
                      <option value="Noto Sans SC, Noto Sans JP, Microsoft YaHei, sans-serif">思源黑体 · 清晰现代</option>
                      <option value="YouYuan, STYuanti, PingFang SC, sans-serif">幼圆 · 圆润亲切</option>
                      <option value="STLiti, FZLiShu, KaiTi, serif">隶书 · 古朴庄重</option>
                      <option value="Georgia, Times New Roman, STSong, serif">Georgia · 优雅衬线</option>
                      <option value="Courier New, Consolas, monospace">等宽字体 · 极客风格</option>
                      <option value="STHupo, KaiTi, cursive">琥珀体 · 创意醒目</option>
                      <option value="Hannotate SC, KaiTi, serif">手札体 · 文艺清新</option>
                    </select>
                  </label>
                  <label>
                    字重
                    <select id="desktopLyricFontWeight">
                      <option value="400">正常</option>
                      <option value="500">略粗</option>
                      <option value="600">较粗</option>
                      <option value="700" selected>粗体（默认）</option>
                      <option value="800">很粗</option>
                      <option value="900">超粗</option>
                    </select>
                  </label>
                </div>
              </fieldset>

              <fieldset class="theme-section">
                <legend>颜色设置</legend>
                <div class="grid-2 desktop-lyric-settings-fields">
                  <label>
                    文字颜色
                    <input id="desktopLyricTextColor" type="color" value="#ffffff">
                  </label>
                  <label>
                    描边颜色
                    <input id="desktopLyricStrokeColor" type="color" value="#000000">
                  </label>
                </div>
              </fieldset>

              <fieldset class="theme-section">
                <legend>字号设置</legend>
                <div class="grid-2 desktop-lyric-settings-fields">
                  <label>
                    字号大小
                    <span class="range-row">
                      <input id="desktopLyricFontSize" class="parameter-range" type="range" min="24" max="72" step="2" value="36">
                      <input id="desktopLyricFontSizeNumber" type="number" min="24" max="72" step="2" value="36">
                    </span>
                    <span class="hint">推荐 36-48</span>
                  </label>
                  <label>
                    描边宽度
                    <span class="range-row">
                      <input id="desktopLyricStrokeWidth" class="parameter-range" type="range" min="0" max="5" step="0.5" value="2">
                      <input id="desktopLyricStrokeWidthNumber" type="number" min="0" max="5" step="0.5" value="2">
                    </span>
                    <span class="hint">0 为无描边</span>
                  </label>
                </div>
              </fieldset>

              <fieldset class="theme-section">
                <legend>透明度设置</legend>
                <div class="grid-2 desktop-lyric-settings-fields">
                  <label>
                    文字透明度
                    <span class="range-row">
                      <input id="desktopLyricOpacity" class="parameter-range" type="range" min="0" max="1" step="0.05" value="1">
                      <input id="desktopLyricOpacityNumber" type="number" min="0" max="1" step="0.05" value="1">
                    </span>
                    <span class="hint">1 为完全不透明</span>
                  </label>
                  <label>
                    背景透明度
                    <span class="range-row">
                      <input id="desktopLyricBgOpacity" class="parameter-range" type="range" min="0" max="1" step="0.05" value="0">
                      <input id="desktopLyricBgOpacityNumber" type="number" min="0" max="1" step="0.05" value="0">
                    </span>
                    <span class="hint">0 为完全透明</span>
                  </label>
                </div>
              </fieldset>

              <fieldset class="theme-section">
                <legend>窗口缩放</legend>
                <div class="grid-2 desktop-lyric-settings-fields">
                  <label>
                    整体缩放
                    <span class="range-row">
                      <input id="desktopLyricScale" class="parameter-range" type="range" min="0.5" max="2" step="0.1" value="1">
                      <input id="desktopLyricScaleNumber" type="number" min="0.5" max="2" step="0.1" value="1">
                    </span>
                    <span class="hint">1 为正常大小</span>
                  </label>
                  <label>
                    行间距
                    <span class="range-row">
                      <input id="desktopLyricLineHeight" class="parameter-range" type="range" min="1" max="2" step="0.1" value="1.3">
                      <input id="desktopLyricLineHeightNumber" type="number" min="1" max="2" step="0.1" value="1.3">
                    </span>
                    <span class="hint">推荐 1.2-1.5</span>
                  </label>
                </div>
              </fieldset>

              <fieldset class="theme-section">
                <legend>阴影与特效</legend>
                <div class="grid-2 desktop-lyric-settings-fields">
                  <label>
                    文字阴影强度
                    <span class="range-row">
                      <input id="desktopLyricShadowIntensity" class="parameter-range" type="range" min="0" max="1" step="0.1" value="0.5">
                      <input id="desktopLyricShadowIntensityNumber" type="number" min="0" max="1" step="0.1" value="0.5">
                    </span>
                    <span class="hint">0 为无阴影</span>
                  </label>
                  <label>
                    翻译字号比例
                    <span class="range-row">
                      <input id="desktopLyricTranslationScale" class="parameter-range" type="range" min="0.4" max="1" step="0.05" value="0.58">
                      <input id="desktopLyricTranslationScaleNumber" type="number" min="0.4" max="1" step="0.05" value="0.58">
                    </span>
                    <span class="hint">相对主歌词的大小</span>
                  </label>
                </div>
              </fieldset>

            </section>
            <section id="desktopLyricLivePreview" class="desktop-lyric-preview-card" aria-labelledby="desktopLyricPreviewTitle">
              <header class="desktop-lyric-preview-header">
                <div>
                  <span class="desktop-lyric-preview-kicker">LIVE PREVIEW</span>
                  <h3 id="desktopLyricPreviewTitle">桌面歌词实时预览</h3>
                </div>
                <div class="desktop-lyric-preview-tools">
                  <div class="desktop-lyric-preview-backgrounds" aria-label="预览背景">
                    <button class="active" type="button" data-lyric-preview-background="grid" aria-pressed="true">网格背景</button>
                    <button type="button" data-lyric-preview-background="solid" aria-pressed="false">纯色背景</button>
                  </div>
                  <button id="desktopLyricCopyUrlBtn" type="button">复制桌面歌词</button>
                  <span id="desktopLyricPreviewStatus" class="pill warn">等待播放</span>
                </div>
              </header>
              <div id="desktopLyricPreviewStage" class="desktop-lyric-preview-stage">
                <div id="desktopLyricPreviewViewport" class="desktop-lyric-preview-viewport" tabindex="0" aria-label="完整歌词，可上下滚动查看">
                  <div id="desktopLyricPreviewTimeline" class="desktop-lyric-preview-timeline" role="list">
                    <div class="desktop-lyric-preview-empty">等待播放 · 歌词将在载入后完整显示</div>
                  </div>
                </div>
                <div id="desktopLyricPreviewPlayback" class="desktop-lyric-preview-playback" aria-live="polite"></div>
                <div class="desktop-lyric-preview-progress" aria-hidden="true"><span id="desktopLyricPreviewProgress"></span></div>
              </div>
            </section>
            </div>
          </div>
        </div>
