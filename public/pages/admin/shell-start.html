<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LIRA</title>
    <!-- 在 CSS 加载前立即设置桌面主题，避免粉色闪烁 -->
    <script>
      if (new URLSearchParams(location.search).get('desktop') === '1') {
        document.documentElement.classList.add('desktop-shell');
      }
    </script>
    <link rel="stylesheet" href="/css/styles-base.css?v=20260728-01">
    <link rel="stylesheet" href="/css/styles-admin.css?v=20260824-01">
    <link rel="stylesheet" href="/css/styles-playback.css?v=20260803-01">
    <link rel="stylesheet" href="/css/overlays/desktop.css?v=20260802-01">
    <link rel="stylesheet" href="/css/admin/other-features/interactive-tour.css?v=20260820-01">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="titlebar-brand">
          <svg class="titlebar-logo" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <defs>
              <linearGradient id="titlebarLogoFill" x1="4" y1="3" x2="20" y2="21" gradientUnits="userSpaceOnUse">
                <stop stop-color="#ff7568"/>
                <stop offset="0.55" stop-color="#d92d20"/>
                <stop offset="1" stop-color="#9f1712"/>
              </linearGradient>
            </defs>
            <rect x="2.25" y="2.25" width="19.5" height="19.5" rx="6.25" fill="url(#titlebarLogoFill)"/>
            <path d="M7.15 6.55v6.72c0 2.55 1.55 4.08 4.12 4.08h5.58" stroke="#fffaf5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M11.25 10.6v2.45M14.15 8.45v4.6M17.05 9.85v3.2" stroke="#f7cf75" stroke-width="1.65" stroke-linecap="round"/>
            <path d="M5.65 5.72c.63-.72 1.42-1.26 2.33-1.58" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
          </svg>
        </div>
        <div class="primary-nav-slot">
          <nav class="main-page-tabs" aria-label="主功能">
            <button class="main-page-tab active" data-main-page="songAssistantPage" type="button">
              <img class="tab-icon" src="/img/admin/nav-icons/nav-song.webp" alt="" aria-hidden="true">
              <span>点歌</span>
            </button>
            <button class="main-page-tab" data-main-page="playbackAssistantPage" type="button">
              <img class="tab-icon" src="/img/admin/nav-icons/nav-play.webp" alt="" aria-hidden="true">
              <span>播放</span>
            </button>
            <button class="main-page-tab" data-main-page="giftAssistantPage" type="button">
              <img class="tab-icon" src="/img/admin/nav-icons/nav-gift.webp" alt="" aria-hidden="true">
              <span>礼物</span>
            </button>
            <!-- 百宝箱页面 — 集中承载相互独立的辅助工具。 -->
            <button class="main-page-tab" data-main-page="otherAssistantPage" type="button">
              <img class="tab-icon" src="/img/admin/nav-icons/nav-toolbox.webp" alt="" aria-hidden="true">
              <span>百宝箱</span>
            </button>
          </nav>
        </div>
        <div class="status-strip">
          <span id="wsStatus" class="pill warn" hidden></span>
          <span id="liveStatus" class="pill warn">弹幕监听未启用</span>
          <button id="reconnectBtn" class="secondary" type="button" title="重新检测直播间开播状态">刷新直播</button>
          <button id="shutdownBtn" class="danger" type="button">退出程序</button>
        </div>
        <div class="window-controls" id="windowControls">
          <button class="win-btn minimize" id="winMinBtn" type="button" title="最小化">
            <svg width="10" height="2" viewBox="0 0 10 2"><line x1="1" y1="1" x2="9" y2="1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <button class="win-btn maximize" id="winMaxBtn" type="button" title="最大化/还原">
            <svg class="maximize-icon" width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" rx="2.5" ry="2.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
            <svg class="restore-icon" width="10" height="10" viewBox="0 0 10 10" style="display: none;"><rect x="0.5" y="2" width="7" height="7" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="1.2"/><polyline points="2.5,2 2.5,0.5 9.5,0.5 9.5,7.5 8,7.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
          <button class="win-btn close-win" id="winCloseBtn" type="button" title="关闭">
            <svg width="10" height="10" viewBox="0 0 10 10"><line x1="0.5" y1="0.5" x2="9.5" y2="9.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><line x1="9.5" y1="0.5" x2="0.5" y2="9.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>
