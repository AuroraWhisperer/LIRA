<button
  id="audioAssistantFloat"
  class="audio-assistant-float"
  type="button"
  aria-label="打开电音助手，可拖动调整位置"
  title="电音助手 · 拖到左右边缘可收起"
  aria-expanded="false"
  aria-controls="audioAssistantPanel"
  popovertarget="audioAssistantPanel"
  hidden
>
  <svg class="audio-assistant-wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
    <path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4" />
  </svg>
  <svg class="audio-assistant-chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="m8 5 5 5-5 5" />
  </svg>
</button>
<section id="audioAssistantPanel" class="audio-assistant-panel" popover="auto" aria-labelledby="audioAssistantPanelTitle">
  <header class="audio-assistant-panel-header">
    <h2 id="audioAssistantPanelTitle">电音助手</h2>
    <button type="button" class="audio-assistant-close" popovertarget="audioAssistantPanel" popovertargetaction="hide" aria-label="收起电音助手" title="收起">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
    </button>
  </header>
  <div class="audio-assistant-compact">
    <div class="audio-assistant-current">
      <div><span class="hint" data-audio-source-label>当前歌曲</span><strong data-audio-song>等待播放器播放歌曲</strong></div>
      <label class="switch-control"><input type="checkbox" data-audio-active aria-label="处理当前歌曲" aria-describedby="audioAssistantCompactStatus" /><span class="switch-track"></span></label>
    </div>
    <p id="audioAssistantCompactStatus" class="hint audio-assistant-compact-status" data-audio-status role="status"></p>
    <div data-audio-controls="compact"></div>
  </div>
</section>
