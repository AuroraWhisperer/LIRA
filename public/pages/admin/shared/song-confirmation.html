<!-- 点歌确认悬浮通知 -->
<div id="pendingConfirmPopup" class="pending-confirm-popup">
  <div class="pending-confirm-inner">
    <div class="pending-confirm-header">
      <span class="pending-confirm-icon">🎵</span>
      <span class="pending-confirm-title">收到点歌请求</span>
      <span id="pendingConfirmCount" class="pending-confirm-count"></span>
    </div>
    <div class="pending-confirm-body">
      <div id="pendingConfirmSongName" class="pending-confirm-song"></div>
      <div id="pendingConfirmMatchInfo" class="pending-confirm-match"></div>
      <div id="pendingConfirmRequester" class="pending-confirm-requester"></div>
    </div>
    <div class="pending-confirm-actions">
      <button id="pendingConfirmAcceptBtn" type="button" class="primary">
        ✓ 下一首播放
      </button>
      <button id="pendingConfirmRejectBtn" type="button">✗ 跳过</button>
    </div>
  </div>
</div>
