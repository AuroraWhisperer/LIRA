<!-- 盲盒分析二级工作区：保留软件顶栏，接管其余可用区域。 -->
<section
  class="blind-analysis-workspace"
  id="blindBoxAnalysisWorkspace"
  role="region"
  aria-labelledby="blindBoxAnalysisTitle"
  hidden
>
  <header class="blind-analysis-header">
    <div class="blind-analysis-title-block">
      <span class="blind-analysis-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="M4 19V9m6 10V5m6 14v-7m4 7H2"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      <div>
        <h2 id="blindBoxAnalysisTitle" class="ui-page-title" tabindex="-1">今日盲盒分析</h2>
        <p id="blindBoxAnalysisSubtitle" class="ui-caption">今天的全部盲盒</p>
      </div>
    </div>
    <div class="blind-analysis-dates" id="blindBoxAnalysisDates">
      <button
        class="blind-analysis-date-trigger"
        id="blindBoxAnalysisDateTrigger"
        type="button"
        aria-label="选择统计日期，今天"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="blindBoxAnalysisDatePopover"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M8 3v4m8-4v4M4 10h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span id="blindBoxAnalysisDateLabel">今天</span>
        <svg class="blind-analysis-date-chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="m6 8 4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <div
        class="blind-analysis-date-popover"
        id="blindBoxAnalysisDatePopover"
        role="dialog"
        aria-label="选择统计日期"
        hidden
      >
        <div class="blind-analysis-date-modes" role="group" aria-label="日期选择方式">
          <button type="button" data-blind-date-mode="single" aria-pressed="true">指定日期</button>
          <button type="button" data-blind-date-mode="range" aria-pressed="false">日期区间</button>
        </div>
        <p class="blind-analysis-date-selection" id="blindBoxAnalysisDateSelection"></p>
        <div class="blind-analysis-calendar-nav">
          <button type="button" data-blind-date-month="-1" aria-label="上个月">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="m12 5-5 5 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <strong id="blindBoxAnalysisDateMonth" aria-live="polite"></strong>
          <button type="button" data-blind-date-month="1" aria-label="下个月">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="m8 5 5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <div class="blind-analysis-calendar-week" aria-hidden="true">
          <span>一</span>
          <span>二</span>
          <span>三</span>
          <span>四</span>
          <span>五</span>
          <span>六</span>
          <span>日</span>
        </div>
        <div
          class="blind-analysis-calendar-days"
          id="blindBoxAnalysisDateDays"
          role="group"
          aria-labelledby="blindBoxAnalysisDateMonth"
          aria-describedby="blindBoxAnalysisDateHint"
        ></div>
        <p class="blind-analysis-date-hint" id="blindBoxAnalysisDateHint" aria-live="polite">选择要查看的日期</p>
        <footer class="blind-analysis-date-footer">
          <button type="button" id="blindBoxAnalysisDateToday">今天</button>
          <button type="button" id="blindBoxAnalysisDateCancel">取消</button>
          <button type="button" class="blind-analysis-date-apply" id="blindBoxAnalysisDateApply">应用</button>
        </footer>
      </div>
    </div>
    <button
      id="blindBoxAnalysisClose"
      class="blind-analysis-close"
      type="button"
      title="关闭"
      aria-label="关闭盲盒分析"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
  </header>

  <div class="blind-analysis-content">
    <section class="blind-analysis-summary" aria-label="当前统计">
      <div><span class="ui-caption">盒数</span><strong id="blindBoxAnalysisCount" class="ui-metric">0</strong></div>
      <div>
        <span class="ui-caption">总成本</span><strong id="blindBoxAnalysisCost" class="ui-metric">¥0.00</strong>
      </div>
      <div>
        <span class="ui-caption">开出价值</span><strong id="blindBoxAnalysisValue" class="ui-metric">¥0.00</strong>
      </div>
      <div id="blindBoxAnalysisProfitItem">
        <span class="ui-caption">观众盈亏</span><strong id="blindBoxAnalysisProfit" class="ui-metric">¥0.00</strong>
      </div>
    </section>

    <div class="blind-analysis-toolbar">
      <div class="blind-analysis-filters" aria-label="筛选范围">
        <div class="blind-analysis-filter">
          <span>看哪位观众</span>
          <button
            class="blind-analysis-select"
            id="blindBoxAnalysisViewer"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="blindBoxAnalysisViewerMenu"
          >
            <span>全部观众</span>
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path
                d="m6 8 4 4 4-4"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <div
            class="blind-analysis-select-menu"
            id="blindBoxAnalysisViewerMenu"
            role="listbox"
            aria-label="看哪位观众"
            hidden
          ></div>
        </div>
        <div class="blind-analysis-filter">
          <span>看哪种盲盒</span>
          <button
            class="blind-analysis-select"
            id="blindBoxAnalysisBox"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="blindBoxAnalysisBoxMenu"
          >
            <span>全部盲盒</span>
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path
                d="m6 8 4 4 4-4"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <div
            class="blind-analysis-select-menu"
            id="blindBoxAnalysisBoxMenu"
            role="listbox"
            aria-label="看哪种盲盒"
            hidden
          ></div>
        </div>
        <button id="blindBoxAnalysisClear" class="blind-analysis-clear" type="button">清除选择</button>
      </div>
      <div class="blind-analysis-view-tabs" role="group" aria-label="查看方式">
        <button class="active" type="button" data-blind-analysis-view="users" aria-pressed="true">按观众看</button>
        <button type="button" data-blind-analysis-view="boxes" aria-pressed="false">按盲盒看</button>
        <button type="button" data-blind-analysis-view="records" aria-pressed="false">开盒记录</button>
      </div>
    </div>

    <section class="blind-analysis-results" aria-live="polite" aria-busy="false">
      <div class="blind-analysis-results-head">
        <div>
          <h3 id="blindBoxAnalysisViewTitle" class="ui-card-title">观众排行</h3>
          <span id="blindBoxAnalysisResultCount" class="ui-caption">共 0 人</span>
        </div>
        <span class="blind-analysis-updated ui-caption" id="blindBoxAnalysisUpdated"></span>
      </div>
      <div class="blind-analysis-table-wrap" tabindex="0" role="region" aria-label="盲盒分析明细">
        <table class="blind-analysis-table">
          <thead id="blindBoxAnalysisHead"></thead>
          <tbody id="blindBoxAnalysisBody">
            <tr>
              <td class="blind-analysis-empty">正在读取盲盒数据…</td>
            </tr>
          </tbody>
        </table>
      </div>
      <footer class="blind-analysis-pagination" id="blindBoxAnalysisPagination" hidden>
        <button id="blindBoxAnalysisPrev" type="button">上一页</button>
        <span id="blindBoxAnalysisPageInfo">第 1 页，共 1 页</span>
        <button id="blindBoxAnalysisNext" type="button">下一页</button>
      </footer>
    </section>
  </div>
</section>
