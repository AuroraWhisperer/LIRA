<!-- 全部礼物记录抽屉 -->
<div class="ui-drawer-backdrop gift-drawer-backdrop" id="giftHistoryBackdrop"></div>
<aside class="ui-drawer gift-drawer" id="giftHistoryDrawer" role="dialog" aria-modal="true" aria-labelledby="giftHistoryTitle" aria-hidden="true" tabindex="-1" inert>
  <div class="ui-drawer-head gift-drawer-head">
    <button id="giftHistoryClose" class="secondary sm" type="button" title="返回礼物（Esc）">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
      返回礼物
    </button>
    <div class="gift-drawer-title">
      <strong id="giftHistoryTitle" class="ui-section-title">全部礼物记录</strong>
      <span id="giftHistoryTotal" class="ui-caption" hidden></span>
      <span id="giftLedgerSyncStatus" class="ui-caption" role="status" aria-live="polite" hidden></span>
    </div>
    <button id="giftHistoryRetryBtn" class="secondary sm" type="button" hidden>重新加载</button>
    <button
      id="giftHistoryClearDatabaseBtn"
      class="danger sm"
      type="button"
      title="删除当前账号在本机和云端的全部礼物记录"
    >
      清空全部记录
    </button>
  </div>

  <form id="giftHistoryFilters" class="gift-history-filters" data-gift-pane="list">
    <label>用户<input id="giftHistoryUserQuery" type="search" maxlength="100" placeholder="名称关键词" /></label>
    <label>礼物<input id="giftHistoryGiftQuery" type="search" maxlength="100" placeholder="礼物名称" /></label>
    <label
      >金额大于（元）<input
        id="giftHistoryAmountAbove"
        type="number"
        min="0"
        step="0.01"
        inputmode="decimal"
        placeholder="不限"
        title="按单条礼物记录的总金额筛选，不包含等于门槛的记录"
    /></label>
    <label>开始日期<input id="giftHistoryStartDate" type="date" /></label>
    <label>结束日期<input id="giftHistoryEndDate" type="date" /></label>
    <div class="gift-history-filter-actions">
      <button id="giftHistoryToday" type="button" class="secondary">今天</button>
      <button id="giftHistoryReset" type="button" class="secondary">清除筛选</button>
      <button type="submit">查询</button>
    </div>
    <span id="giftHistoryFilterError" role="alert"></span>
  </form>
  <div class="gift-history-tools" data-gift-pane="list">
    <span id="giftHistorySelectedCount" role="status">已选 0 条</span>
    <button id="giftHistoryDeselect" type="button" class="secondary sm" disabled>取消选择</button>
    <button id="giftHistorySelectAll" class="secondary sm" type="button">选择全部筛选结果</button>
    <button id="giftHistoryCancelSelect" class="secondary sm" type="button" hidden>取消全选</button>
    <span id="giftHistorySelectionNotice" class="hint" role="status"></span>
    <button id="giftHistoryExport" type="button" class="primary sm" disabled>导出所选</button>
  </div>
  <div id="giftHistoryScroll" class="gift-drawer-body" data-gift-pane="list">
    <span id="giftHistoryState" class="sr-only ui-caption" role="status" aria-live="polite">正在加载礼物记录…</span>
    <table class="gift-history-table" aria-label="礼物记录" aria-describedby="giftHistorySelectionHelp">
      <colgroup>
        <col class="gift-history-select-col" />
        <col class="gift-history-time-col" />
        <col class="gift-history-name-col" />
        <col class="gift-history-count-col" />
        <col class="gift-history-money-col" />
        <col class="gift-history-user-col" />
        <col class="gift-history-remarks-col" />
      </colgroup>
      <thead>
        <tr>
          <th><input id="giftHistorySelectPage" type="checkbox" aria-label="选择本页礼物" /></th>
          <th data-sort="created_at" aria-sort="none" tabindex="0">
            时间<span class="sort-arrow" aria-hidden="true"></span>
          </th>
          <th data-sort="gift_name" aria-sort="none" tabindex="0">
            礼物<span class="sort-arrow" aria-hidden="true"></span>
          </th>
          <th>数量</th>
          <th data-sort="price" aria-sort="none" tabindex="0">
            金额<span class="sort-arrow" aria-hidden="true"></span>
          </th>
          <th>用户</th>
          <th data-sort="remarks" aria-sort="none" tabindex="0">
            备注<span class="sort-arrow" aria-hidden="true"></span>
          </th>
        </tr>
      </thead>
      <tbody id="giftHistoryBody">
        <tr>
          <td colspan="7" class="empty">正在加载礼物记录…</td>
        </tr>
      </tbody>
    </table>
    <div id="giftHistoryMarquee" class="gift-history-marquee" aria-hidden="true" hidden></div>
  </div>
  <div class="gift-drawer-footer" data-gift-pane="list">
    <span id="giftHistorySelectionHelp" class="hint">点击行可勾选或取消 · 拖动框选本页 · Ctrl + 框选：已选取消，未选加入</span>
    <button id="giftHistoryPrev" type="button" class="secondary" disabled>← 上一页</button>
    <span id="giftHistoryPageInfo" class="gift-page-info">第 1/1 页</span>
    <button id="giftHistoryNext" type="button" class="secondary" disabled>下一页 →</button>
  </div>
  <section id="giftExportPanel" class="gift-export-panel" data-gift-pane="export" hidden>
    <div class="gift-subview-head">
      <div class="gift-subview-head-left">
        <button id="giftExportBack" type="button" class="secondary">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
          返回选择
        </button>
        <span class="gift-subview-divider" aria-hidden="true"></span>
        <span class="gift-subview-title">导出预览</span>
      </div>
      <div id="giftExportSummary" class="gift-export-summary"></div>
    </div>
    <div class="gift-export-layout">
      <div class="gift-export-preview">
        <div class="gift-export-preview-scroll"><div id="giftExportPreview" class="gift-banner-stage"></div></div>
        <div class="gift-export-preview-footer">
          <div class="gift-preview-pagination">
            <button id="giftExportPrev" type="button" class="gift-pager-btn" aria-label="上一张" title="上一张">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m15 18-6-6 6-6" />
              </svg>
            </button>
            <span id="giftExportPage" aria-label="预览页码"></span>
            <button id="giftExportNext" type="button" class="gift-pager-btn" aria-label="下一张" title="下一张">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m9 18 6-6-6-6" />
              </svg>
            </button>
          </div>
          <div id="giftExportFiles" class="gift-export-file-meta"></div>
        </div>
      </div>
      <div class="gift-export-options">
        <div class="gift-export-options-scroll">
          <fieldset id="giftExportSettingsFields" class="gift-export-settings">
            <legend class="sr-only">导出设置</legend>
            <div class="gift-export-group">
              <div class="gift-export-group-head">
                <span class="gift-export-section-title" aria-hidden="true">导出设置</span>
                <span class="gift-export-autosave-tag">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M20 6 9 17l-5-5" />
                  </svg>
                  自动保存
                </span>
              </div>
              <div class="gift-export-card">
                <div class="gift-export-setting-row">
                  <span id="giftExportModeLabel" class="gift-export-row-label">输出方式</span>
                  <div id="giftExportMode" class="gift-export-segmented" role="radiogroup" aria-labelledby="giftExportModeLabel">
                    <label class="gift-export-segment">
                      <input type="radio" name="giftExportMode" value="combined" checked />
                      <span class="gift-export-segment-face">
                        <svg
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          aria-hidden="true"
                        >
                          <rect x="4" y="4" width="16" height="6" rx="1.5" />
                          <rect x="4" y="14" width="16" height="6" rx="1.5" />
                        </svg>
                        拼成长图
                      </span>
                    </label>
                    <label class="gift-export-segment">
                      <input type="radio" name="giftExportMode" value="separate" />
                      <span class="gift-export-segment-face">
                        <svg
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="1.9"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          aria-hidden="true"
                        >
                          <rect x="4" y="5" width="16" height="14" rx="2" />
                          <path d="M8 10h8" />
                          <path d="M8 14h5" />
                        </svg>
                        每条一张
                      </span>
                    </label>
                  </div>
                </div>
                <div class="gift-export-setting-row">
                  <span id="giftExportBackgroundLabel" class="gift-export-row-label">图片背景</span>
                  <div
                    id="giftExportBackground"
                    class="gift-export-segmented"
                    role="radiogroup"
                    aria-labelledby="giftExportBackgroundLabel"
                  >
                    <label class="gift-export-segment">
                      <input type="radio" name="giftExportBackground" value="transparent" checked />
                      <span class="gift-export-segment-face">
                        <span class="gift-export-swatch gift-export-swatch-transparent" aria-hidden="true"></span>
                        透明
                      </span>
                    </label>
                    <label class="gift-export-segment">
                      <input type="radio" name="giftExportBackground" value="white" />
                      <span class="gift-export-segment-face">
                        <span class="gift-export-swatch gift-export-swatch-white" aria-hidden="true"></span>
                        白色
                      </span>
                    </label>
                  </div>
                </div>
                <label class="switch-control gift-export-merge">
                  <span class="gift-export-merge-text">
                    <span id="giftExportMergeLabel" class="gift-export-row-label">合并同种礼物</span>
                    <span id="giftExportMergeHint" class="gift-export-row-sub">跨日期合并同一观众的同种礼物</span>
                  </span>
                  <input
                    id="giftExportMergeAcrossDates"
                    type="checkbox"
                    role="switch"
                    aria-labelledby="giftExportMergeLabel"
                    aria-describedby="giftExportMergeHint"
                  />
                  <span class="switch-track" aria-hidden="true"></span>
                </label>
              </div>
            </div>
            <div class="gift-export-group">
              <div class="gift-export-directory-head">
                <label class="gift-export-section-title" for="giftExportSettingsDirectory">保存位置</label>
                <div class="gift-directory-actions">
                  <button id="giftExportChoose" class="secondary" type="button">选择文件夹</button>
                  <button id="giftExportDefault" class="ghost" type="button">系统默认</button>
                </div>
              </div>
              <div class="gift-export-card gift-export-path-card">
                <div class="gift-export-path-root">
                  <svg
                    class="gift-export-folder-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.85"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path
                      d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"
                    />
                  </svg>
                  <output id="giftExportSettingsDirectory"></output>
                </div>
                <div class="gift-export-destination">
                  <label class="gift-export-sub-label" for="giftExportDirectory">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <polyline points="15 10 20 15 15 20" />
                      <path d="M4 4v7a4 4 0 0 0 4 4h12" />
                    </svg>
                    本次目录
                  </label>
                  <output id="giftExportDirectory"></output>
                </div>
              </div>
            </div>
          </fieldset>
          <p class="gift-export-color-tip">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
              <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
              <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
              <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
              <path
                d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"
              />
            </svg>
            <span>价格分色可在「<strong>组件 › 礼物姬 › 滚动礼物</strong>」调整</span>
          </p>
        </div>
        <div class="gift-export-actions">
          <p id="giftExportStatus" role="status" aria-live="polite"></p>
          <div class="gift-export-action-buttons">
            <button id="giftExportSave" type="button" class="primary">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.1"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" x2="12" y1="15" y2="3" />
              </svg>
              <span id="giftExportSaveLabel">导出 PNG</span>
            </button>
            <button id="giftExportCancel" type="button" class="secondary" hidden>取消导出</button>
            <button id="giftExportOpenFolder" type="button" class="secondary" hidden>打开文件夹</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</aside>
