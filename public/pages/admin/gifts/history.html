<!-- 全部礼物记录抽屉 -->
<div class="gift-drawer-backdrop" id="giftHistoryBackdrop"></div>
<aside class="gift-drawer" id="giftHistoryDrawer" role="dialog" aria-modal="true" aria-labelledby="giftHistoryTitle">
  <div class="gift-drawer-head">
    <button id="giftHistoryClose" class="secondary sm" type="button" title="返回礼物（Esc）">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
      返回礼物
    </button>
    <div class="gift-drawer-title">
      <strong id="giftHistoryTitle" class="ui-section-title">全部礼物记录</strong>
      <span id="giftHistoryTotal" class="ui-caption" hidden></span>
      <span id="giftLedgerSyncStatus" class="ui-caption" role="status" aria-live="polite" hidden></span>
    </div>
    <button id="giftHistoryRetryBtn" class="secondary sm" type="button" hidden>重新加载</button>
    <button
      id="giftHistoryClearDatabaseBtn"
      class="danger sm"
      type="button"
      title="删除当前账号在本机和云端的全部礼物记录"
    >
      清空全部记录
    </button>
  </div>

  <form id="giftHistoryFilters" class="gift-history-filters" data-gift-pane="list">
    <label>用户<input id="giftHistoryUserQuery" type="search" maxlength="100" placeholder="名称关键词" /></label>
    <label>礼物<input id="giftHistoryGiftQuery" type="search" maxlength="100" placeholder="礼物名称" /></label>
    <label
      >金额大于（元）<input
        id="giftHistoryAmountAbove"
        type="number"
        min="0"
        step="0.01"
        inputmode="decimal"
        placeholder="不限"
        title="按单条礼物记录的总金额筛选，不包含等于门槛的记录"
    /></label>
    <label>开始日期<input id="giftHistoryStartDate" type="date" /></label>
    <label>结束日期<input id="giftHistoryEndDate" type="date" /></label>
    <div class="gift-history-filter-actions">
      <button id="giftHistoryToday" type="button" class="secondary">今天</button>
      <button id="giftHistoryReset" type="button" class="secondary">重置</button>
      <button type="submit">查询</button>
    </div>
    <span id="giftHistoryFilterError" role="alert"></span>
  </form>
  <div class="gift-history-tools" data-gift-pane="list">
    <span id="giftHistorySelectedCount" role="status">已选 0 条</span>
    <button id="giftHistoryDeselect" type="button" class="secondary sm" disabled>取消选择</button>
    <button id="giftHistorySelectAll" class="secondary sm" type="button">选择全部筛选结果</button>
    <button id="giftHistoryCancelSelect" class="secondary sm" type="button" hidden>取消全选</button>
    <span id="giftHistorySelectionNotice" class="hint" role="status"></span>
    <button id="giftHistoryExport" type="button" class="primary sm" disabled>导出所选</button>
  </div>
  <div id="giftHistoryScroll" class="gift-drawer-body" data-gift-pane="list">
    <span id="giftHistoryState" class="sr-only" role="status" aria-live="polite">正在加载礼物记录…</span>
    <table class="gift-history-table" aria-label="礼物记录" aria-describedby="giftHistorySelectionHelp">
      <colgroup>
        <col class="gift-history-select-col" />
        <col class="gift-history-time-col" />
        <col class="gift-history-name-col" />
        <col class="gift-history-count-col" />
        <col class="gift-history-money-col" />
        <col class="gift-history-user-col" />
        <col class="gift-history-remarks-col" />
      </colgroup>
      <thead>
        <tr>
          <th><input id="giftHistorySelectPage" type="checkbox" aria-label="选择本页礼物" /></th>
          <th data-sort="created_at" aria-sort="none" tabindex="0">
            时间<span class="sort-arrow" aria-hidden="true"></span>
          </th>
          <th data-sort="gift_name" aria-sort="none" tabindex="0">
            礼物<span class="sort-arrow" aria-hidden="true"></span>
          </th>
          <th>数量</th>
          <th data-sort="price" aria-sort="none" tabindex="0">
            金额<span class="sort-arrow" aria-hidden="true"></span>
          </th>
          <th>用户</th>
          <th data-sort="remarks" aria-sort="none" tabindex="0">
            备注<span class="sort-arrow" aria-hidden="true"></span>
          </th>
        </tr>
      </thead>
      <tbody id="giftHistoryBody">
        <tr>
          <td colspan="7" class="empty">正在加载礼物记录…</td>
        </tr>
      </tbody>
    </table>
    <div id="giftHistoryMarquee" class="gift-history-marquee" aria-hidden="true" hidden></div>
  </div>
  <div class="gift-drawer-footer" data-gift-pane="list">
    <span id="giftHistorySelectionHelp" class="hint">点击整行选择 · 拖动框选本页 · Ctrl 拖动追加</span>
    <button id="giftHistoryPrev" type="button" class="secondary" disabled>← 上一页</button>
    <span id="giftHistoryPageInfo" class="gift-page-info">第 1/1 页</span>
    <button id="giftHistoryNext" type="button" class="secondary" disabled>下一页 →</button>
  </div>
  <section id="giftExportPanel" class="gift-export-panel" data-gift-pane="export" hidden>
    <div class="gift-subview-head">
      <button id="giftExportBack" type="button" class="secondary">返回选择</button><span id="giftExportSummary"></span>
    </div>
    <div class="gift-export-layout">
      <div class="gift-export-preview">
        <div class="gift-export-preview-scroll"><div id="giftExportPreview" class="gift-banner-stage"></div></div>
        <div class="gift-export-preview-footer">
          <div class="gift-preview-pagination">
            <button id="giftExportPrev" type="button" class="secondary">上一张</button
            ><span id="giftExportPage" aria-label="预览页码"></span
            ><button id="giftExportNext" type="button" class="secondary">下一张</button>
          </div>
          <p id="giftExportFiles" class="hint"></p>
        </div>
      </div>
      <div class="gift-export-options">
        <div class="gift-export-options-scroll">
          <fieldset id="giftExportSettingsFields" class="gift-export-settings" data-dropdown-variant="toolbox">
            <legend class="gift-export-section-title">导出设置</legend>
            <p class="gift-export-autosave hint">修改自动保存，并应用于本次导出。</p>
            <div class="gift-export-settings-grid">
              <label
                >输出方式<select id="giftExportMode" aria-describedby="giftExportModeHint">
                  <option value="combined">拼成一张</option>
                  <option value="separate">每条一张</option>
                </select></label
              >
              <label
                >图片背景<select id="giftExportBackground">
                  <option value="transparent">透明</option>
                  <option value="white">白色</option>
                </select></label
              >
            </div>
            <p id="giftExportModeHint" class="hint">拼图超长时会自动分成多张。</p>
            <div class="gift-export-settings-directory">
              <div class="gift-export-directory-head">
                <label for="giftExportSettingsDirectory">保存文件夹</label>
                <div class="gift-directory-actions">
                  <button id="giftExportChoose" class="secondary" type="button">选择文件夹</button
                  ><button id="giftExportDefault" class="secondary" type="button">系统默认</button>
                </div>
              </div>
              <output id="giftExportSettingsDirectory"></output>
              <p class="hint">每次导出会在此文件夹下新建日期和批次目录。</p>
            </div>
          </fieldset>
          <div class="gift-export-destination">
            <label for="giftExportDirectory">本次保存位置</label>
            <output id="giftExportDirectory"></output>
          </div>
        </div>
        <div class="gift-export-actions">
          <p id="giftExportStatus" role="status" aria-live="polite"></p>
          <div class="gift-export-action-buttons">
            <button id="giftExportSave" type="button" class="primary">导出 PNG</button>
            <button id="giftExportCancel" type="button" class="secondary" hidden>取消导出</button>
            <button id="giftExportOpenFolder" type="button" class="secondary" hidden>打开文件夹</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</aside>
