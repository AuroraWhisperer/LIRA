<!-- 全部礼物记录抽屉 -->
<div class="ui-drawer-backdrop gift-drawer-backdrop" id="giftHistoryBackdrop"></div>
<aside class="ui-drawer gift-drawer" id="giftHistoryDrawer" role="dialog" aria-modal="true" aria-labelledby="giftHistoryTitle" aria-hidden="true" tabindex="-1" inert>
  <div class="ui-drawer-head gift-drawer-head">
    <div class="gift-drawer-head-left">
      <button id="giftHistoryClose" class="secondary sm" type="button" title="返回礼物（Esc）">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m15 18-6-6 6-6" />
        </svg>
        返回礼物
      </button>
      <span class="gift-history-head-divider" aria-hidden="true"></span>
      <div class="gift-drawer-title">
        <strong id="giftHistoryTitle" class="ui-section-title">全部礼物记录</strong>
        <span id="giftHistoryTotal" class="gift-history-total-pill" hidden></span>
        <span id="giftLedgerSyncStatus" class="gift-history-sync-pill" role="status" aria-live="polite" hidden></span>
      </div>
    </div>
    <div class="gift-drawer-head-actions">
      <button id="giftHistoryRetryBtn" class="secondary sm" type="button" hidden>重新加载</button>
      <button id="giftHistoryExport" type="button" class="primary sm" data-gift-pane="list" disabled>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.1"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" x2="12" y1="15" y2="3" />
        </svg>
        <span id="giftHistoryExportLabel">导出所选</span>
      </button>
      <span class="gift-history-head-divider" data-gift-pane="list" aria-hidden="true"></span>
      <button
        id="giftHistoryClearDatabaseBtn"
        class="danger sm"
        type="button"
        title="永久删除当前账号在本机和云端的全部礼物记录"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 6h18" />
          <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
        </svg>
        <span id="giftHistoryClearDatabaseLabel">清空全部记录</span>
      </button>
    </div>
  </div>

  <form id="giftHistoryFilters" class="gift-history-filters" data-gift-pane="list">
    <div class="gift-history-filter-tray">
      <label class="gift-filter-field gift-filter-user">
        <span class="sr-only">用户</span>
        <svg
          class="gift-filter-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="8" r="4" />
          <path d="M20 21a8 8 0 0 0-16 0" />
        </svg>
        <input id="giftHistoryUserQuery" type="search" maxlength="100" placeholder="用户关键词" />
      </label>
      <label class="gift-filter-field gift-filter-gift">
        <span class="sr-only">礼物</span>
        <svg
          class="gift-filter-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="8" width="18" height="4" rx="1" />
          <path d="M12 8v13" />
          <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7" />
          <path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5" />
        </svg>
        <input id="giftHistoryGiftQuery" type="search" maxlength="100" placeholder="礼物名称" />
      </label>
      <label class="gift-filter-field gift-filter-amount">
        <span class="sr-only">金额大于（元）</span>
        <span class="gift-filter-prefix" aria-hidden="true">金额 &gt; ¥</span>
        <input
          id="giftHistoryAmountAbove"
          type="number"
          min="0"
          step="0.01"
          inputmode="decimal"
          placeholder="不限"
          title="按单条礼物记录的总金额筛选，不包含等于门槛的记录"
        />
      </label>
      <div class="gift-filter-date-group" role="group" aria-label="日期范围">
        <span class="gift-filter-prefix gift-filter-date-label" aria-hidden="true">日期</span>
        <label class="gift-filter-date-slot">
          <span class="sr-only">开始日期</span>
          <input id="giftHistoryStartDate" type="date" aria-label="开始日期" />
        </label>
        <span class="gift-filter-date-sep" aria-hidden="true">—</span>
        <label class="gift-filter-date-slot">
          <span class="sr-only">结束日期</span>
          <input id="giftHistoryEndDate" type="date" aria-label="结束日期" />
        </label>
        <button id="giftHistoryToday" type="button" class="gift-filter-today-btn" title="一键筛选今天的礼物">
          今天
        </button>
      </div>
      <div class="gift-history-filter-actions">
        <button id="giftHistoryReset" type="button" class="secondary" title="清除全部筛选条件">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
            <path d="M3 3v5h5" />
          </svg>
          重置
        </button>
        <button type="submit" class="primary">查询</button>
      </div>
    </div>
    <span id="giftHistoryFilterError" role="alert"></span>
  </form>
  <div id="giftHistoryTools" class="gift-history-tools" data-gift-pane="list">
    <div class="gift-history-tools-left">
      <span id="giftHistorySelectedCount" role="status">已选 0 条</span>
      <span class="gift-history-tools-divider" aria-hidden="true"></span>
      <button id="giftHistorySelectAll" class="secondary sm" type="button">全选筛选结果</button>
      <button id="giftHistoryDeselect" type="button" class="secondary sm" disabled hidden>取消选择</button>
      <button id="giftHistoryCancelSelect" class="secondary sm" type="button" hidden>取消全选</button>
      <span id="giftHistorySelectionNotice" class="hint" role="status"></span>
    </div>
    <span id="giftHistoryState" class="sr-only gift-history-retention-note" role="status" aria-live="polite"
      >正在加载礼物记录…</span
    >
  </div>
  <div id="giftHistoryScroll" class="gift-drawer-body" data-gift-pane="list">
    <table class="gift-history-table" aria-label="礼物记录" aria-describedby="giftHistorySelectionHelp">
      <colgroup>
        <col class="gift-history-select-col" />
        <col class="gift-history-time-col" />
        <col class="gift-history-name-col" />
        <col class="gift-history-count-col" />
        <col class="gift-history-money-col" />
        <col class="gift-history-user-col" />
        <col class="gift-history-remarks-col" />
      </colgroup>
      <thead>
        <tr>
          <th><input id="giftHistorySelectPage" type="checkbox" aria-label="选择本页礼物" /></th>
          <th data-sort="created_at" aria-sort="none" tabindex="0">
            时间<span class="sort-arrow" aria-hidden="true"></span>
          </th>
          <th data-sort="gift_name" aria-sort="none" tabindex="0">
            礼物<span class="sort-arrow" aria-hidden="true"></span>
          </th>
          <th>数量</th>
          <th data-sort="price" aria-sort="none" tabindex="0">
            金额<span class="sort-arrow" aria-hidden="true"></span>
          </th>
          <th>用户</th>
          <th data-sort="remarks" aria-sort="none" tabindex="0">
            备注<span class="sort-arrow" aria-hidden="true"></span>
          </th>
        </tr>
      </thead>
      <tbody id="giftHistoryBody">
        <tr>
          <td colspan="7" class="empty">正在加载礼物记录…</td>
        </tr>
      </tbody>
    </table>
    <div id="giftHistoryMarquee" class="gift-history-marquee" aria-hidden="true" hidden></div>
  </div>
  <div class="gift-drawer-footer" data-gift-pane="list">
    <div id="giftHistorySelectionHelp" class="hint">
      <span><i class="gift-gesture-mouse" aria-hidden="true"></i><strong>点击行</strong>切换勾选</span>
      <span><i class="gift-gesture-box" aria-hidden="true"></i><strong>拖动</strong>框选本页</span>
      <span><kbd>Ctrl</kbd> + <strong>拖动</strong>反选框内记录</span>
    </div>
    <button id="giftHistoryPrev" type="button" class="secondary" disabled>← 上一页</button>
    <span id="giftHistoryPageInfo" class="gift-page-info">第 1/1 页</span>
    <button id="giftHistoryNext" type="button" class="secondary" disabled>下一页 →</button>
  </div>
  <section id="giftExportPanel" class="gift-export-panel" data-gift-pane="export" hidden>
    <div class="gift-subview-head">
      <div class="gift-subview-head-left">
        <button id="giftExportBack" type="button" class="secondary">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
          返回选择
        </button>
        <span class="gift-subview-divider" aria-hidden="true"></span>
        <span class="gift-subview-title">导出预览</span>
      </div>
      <div id="giftExportSummary" class="gift-export-summary"></div>
    </div>
    <div class="gift-export-layout">
      <div class="gift-export-preview">
        <div class="gift-export-preview-scroll"><div id="giftExportPreview" class="gift-banner-stage"></div></div>
        <div class="gift-export-preview-footer">
          <div class="gift-preview-pagination">
            <button id="giftExportPrev" type="button" class="gift-pager-btn" aria-label="上一张" title="上一张">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m15 18-6-6 6-6" />
              </svg>
            </button>
            <span id="giftExportPage" aria-label="预览页码"></span>
            <button id="giftExportNext" type="button" class="gift-pager-btn" aria-label="下一张" title="下一张">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m9 18 6-6-6-6" />
              </svg>
            </button>
          </div>
          <div id="giftExportFiles" class="gift-export-file-meta"></div>
        </div>
      </div>
      <div class="gift-export-options">
        <div class="gift-export-options-scroll">
          <fieldset id="giftExportSettingsFields" class="gift-export-settings">
            <legend class="sr-only">导出设置</legend>
            <div class="gift-export-group">
              <div class="gift-export-group-head">
                <span class="gift-export-section-title" aria-hidden="true">导出设置</span>
                <span class="gift-export-autosave-tag">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M20 6 9 17l-5-5" />
                  </svg>
                  自动保存
                </span>
              </div>
              <div class="gift-export-card">
                <div class="gift-export-setting-row">
                  <span id="giftExportModeLabel" class="gift-export-row-label">输出方式</span>
                  <div id="giftExportMode" class="gift-export-segmented" role="radiogroup" aria-labelledby="giftExportModeLabel">
                    <label class="gift-export-segment">
                      <input type="radio" name="giftExportMode" value="combined" checked />
                      <span class="gift-export-segment-face">
                        <svg
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          aria-hidden="true"
                        >
                          <rect x="4" y="4" width="16" height="6" rx="1.5" />
                          <rect x="4" y="14" width="16" height="6" rx="1.5" />
                        </svg>
                        拼成长图
                      </span>
                    </label>
                    <label class="gift-export-segment">
                      <input type="radio" name="giftExportMode" value="separate" />
                      <span class="gift-export-segment-face">
                        <svg
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="1.9"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          aria-hidden="true"
                        >
                          <rect x="4" y="5" width="16" height="14" rx="2" />
                          <path d="M8 10h8" />
                          <path d="M8 14h5" />
                        </svg>
                        每条一张
                      </span>
                    </label>
                  </div>
                </div>
                <div class="gift-export-setting-row">
                  <span id="giftExportBackgroundLabel" class="gift-export-row-label">图片背景</span>
                  <div
                    id="giftExportBackground"
                    class="gift-export-segmented"
                    role="radiogroup"
                    aria-labelledby="giftExportBackgroundLabel"
                  >
                    <label class="gift-export-segment">
                      <input type="radio" name="giftExportBackground" value="transparent" checked />
                      <span class="gift-export-segment-face">
                        <span class="gift-export-swatch gift-export-swatch-transparent" aria-hidden="true"></span>
                        透明
                      </span>
                    </label>
                    <label class="gift-export-segment">
                      <input type="radio" name="giftExportBackground" value="white" />
                      <span class="gift-export-segment-face">
                        <span class="gift-export-swatch gift-export-swatch-white" aria-hidden="true"></span>
                        白色
                      </span>
                    </label>
                  </div>
                </div>
                <div class="gift-export-setting-row">
                  <span id="giftExportSortLabel" class="gift-export-row-label">排序方式</span>
                  <div id="giftExportSort" class="gift-export-segmented" role="radiogroup" aria-labelledby="giftExportSortLabel">
                    <label class="gift-export-segment" title="从新到旧">
                      <input type="radio" name="giftExportSort" value="time" checked />
                      <span class="gift-export-segment-face">按时间</span>
                    </label>
                    <label class="gift-export-segment" title="总金额从高到低">
                      <input type="radio" name="giftExportSort" value="amount" />
                      <span class="gift-export-segment-face">按金额</span>
                    </label>
                  </div>
                </div>
                <div class="gift-export-setting-row" title="当前图片有两张或更多卡片时可调整间距">
                  <div class="gift-export-spacing-label">
                    <label for="giftExportRowGap" class="gift-export-row-label">词条间距</label>
                    <button id="giftExportRowGapReset" type="button" aria-label="重置词条间距" title="恢复默认间距（16 px）" disabled>
                      <svg
                        width="15"
                        height="15"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                      >
                        <path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5" />
                      </svg>
                    </button>
                  </div>
                  <div class="gift-export-spacing">
                    <input id="giftExportRowGap" class="parameter-range" type="range" min="0" max="32" value="16" disabled />
                    <output id="giftExportRowGapValue" for="giftExportRowGap">16 px</output>
                  </div>
                </div>
                <label class="switch-control gift-export-merge">
                  <span class="gift-export-merge-text">
                    <span id="giftExportMergeLabel" class="gift-export-row-label">合并同种礼物</span>
                    <span id="giftExportMergeHint" class="gift-export-row-sub">跨日期合并同一观众的同种礼物</span>
                  </span>
                  <input
                    id="giftExportMergeAcrossDates"
                    type="checkbox"
                    role="switch"
                    aria-labelledby="giftExportMergeLabel"
                    aria-describedby="giftExportMergeHint"
                  />
                  <span class="switch-track" aria-hidden="true"></span>
                </label>
              </div>
            </div>
            <section class="gift-export-group" aria-labelledby="giftExportStyleHeading">
              <div class="gift-export-group-head">
                <h3 id="giftExportStyleHeading" class="gift-export-section-title">卡片样式</h3>
                <span id="giftExportStyleScope" class="gift-export-sub-label" hidden>仅用于导出</span>
              </div>
              <div class="gift-export-card">
                <div class="gift-export-setting-row">
                  <span id="giftExportStyleLabel" class="gift-export-row-label">样式来源</span>
                  <div id="giftExportStyleSource" class="gift-export-segmented" role="radiogroup" aria-labelledby="giftExportStyleLabel">
                    <label class="gift-export-segment">
                      <input type="radio" name="giftExportStyleSource" value="follow" checked />
                      <span class="gift-export-segment-face">跟随滚动礼物</span>
                    </label>
                    <label class="gift-export-segment">
                      <input type="radio" name="giftExportStyleSource" value="custom" />
                      <span class="gift-export-segment-face">自定义</span>
                    </label>
                  </div>
                </div>
                <div id="giftExportStyleSummary" class="gift-export-setting-row">
                  <span id="giftExportStyleName"></span>
                  <span class="gift-export-palette" aria-hidden="true"></span>
                </div>
                <div id="giftExportStyleEditor" hidden>
                  <div class="gift-export-style-selects">
                    <label>条带外形<select id="giftExportTail" aria-label="条带外形"></select></label>
                    <label>条带纹理<select id="giftExportTexture" aria-label="条带纹理"></select></label>
                  </div>
                  <details id="giftExportTiers">
                    <summary>
                      <span class="gift-export-row-label">价格分色</span>
                      <span class="gift-export-palette" aria-hidden="true"></span>
                    </summary>
                    <div class="gift-export-tier-inputs">
                      <span class="gift-export-tier-heading">起始金额 · 元</span>
                    </div>
                  </details>
                  <p id="giftExportTierError" role="status" hidden>起始金额须大于 0、依次递增，最多两位小数。</p>
                </div>
              </div>
            </section>
            <div class="gift-export-group">
              <div class="gift-export-directory-head">
                <label class="gift-export-section-title" for="giftExportSettingsDirectory">保存位置</label>
                <div class="gift-directory-actions">
                  <button id="giftExportChoose" class="secondary" type="button">选择文件夹</button>
                  <button id="giftExportDefault" class="ghost" type="button">系统默认</button>
                </div>
              </div>
              <div class="gift-export-card gift-export-path-card">
                <div class="gift-export-path-root">
                  <svg
                    class="gift-export-folder-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.85"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path
                      d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"
                    />
                  </svg>
                  <output id="giftExportSettingsDirectory"></output>
                </div>
                <div class="gift-export-destination">
                  <label class="gift-export-sub-label" for="giftExportDirectory">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <polyline points="15 10 20 15 15 20" />
                      <path d="M4 4v7a4 4 0 0 0 4 4h12" />
                    </svg>
                    本次目录
                  </label>
                  <output id="giftExportDirectory"></output>
                </div>
              </div>
            </div>
          </fieldset>
        </div>
        <div class="gift-export-actions">
          <p id="giftExportStatus" role="status" aria-live="polite"></p>
          <div class="gift-export-action-buttons">
            <button id="giftExportSave" type="button" class="primary">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.1"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" x2="12" y1="15" y2="3" />
              </svg>
              <span id="giftExportSaveLabel">导出 PNG</span>
            </button>
            <button id="giftExportCancel" type="button" class="secondary" hidden>取消导出</button>
            <button id="giftExportOpenFolder" type="button" class="secondary" hidden>打开文件夹</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</aside>
