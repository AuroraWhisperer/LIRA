<!-- 全部礼物流水抽屉 -->
<div class="gift-drawer-backdrop" id="giftHistoryBackdrop"></div>
<aside
  class="gift-drawer"
  id="giftHistoryDrawer"
  role="dialog"
  aria-modal="true"
  aria-labelledby="giftHistoryTitle"
>
  <div class="gift-drawer-head">
    <div class="gift-drawer-title">
      <strong id="giftHistoryTitle" class="ui-section-title">全部礼物流水</strong>
      <span id="giftHistoryTotal" class="ui-caption" hidden></span>
      <span
        id="giftLedgerSyncStatus"
        class="ui-caption"
        role="status"
        aria-live="polite"
        hidden
      ></span>
    </div>
    <button
      id="giftHistoryRetryBtn"
      class="secondary sm"
      type="button"
      hidden
    >
      重新加载
    </button>
    <button
      id="giftHistoryClearDatabaseBtn"
      class="danger sm"
      type="button"
      title="删除当前账号在本机和云端的全部礼物记录"
    >
      清空全部记录
    </button>
    <button
      id="giftHistoryClose"
      class="playback-icon-btn"
      type="button"
      title="关闭"
      aria-label="关闭"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  </div>

  <div class="gift-drawer-body">
    <span
      id="giftHistoryState"
      class="sr-only"
      role="status"
      aria-live="polite"
      >正在加载礼物记录…</span
    >
    <table class="gift-history-table">
      <colgroup>
        <col class="gift-history-time-col" />
        <col class="gift-history-name-col" />
        <col class="gift-history-count-col" />
        <col class="gift-history-money-col" />
        <col class="gift-history-user-col" />
        <col class="gift-history-remarks-col" />
      </colgroup>
      <thead>
        <tr>
          <th data-sort="created_at" aria-sort="none" tabindex="0">时间<span class="sort-arrow" aria-hidden="true"></span></th>
          <th data-sort="gift_name" aria-sort="none" tabindex="0">礼物<span class="sort-arrow" aria-hidden="true"></span></th>
          <th>数量</th>
          <th data-sort="price" aria-sort="none" tabindex="0">金额<span class="sort-arrow" aria-hidden="true"></span></th>
          <th>用户</th>
          <th data-sort="remarks" aria-sort="none" tabindex="0">备注<span class="sort-arrow" aria-hidden="true"></span></th>
        </tr>
      </thead>
      <tbody id="giftHistoryBody">
        <tr>
          <td colspan="6" class="empty">正在加载礼物记录…</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="gift-drawer-footer">
    <button id="giftHistoryPrev" type="button" disabled>← 上一页</button>
    <span id="giftHistoryPageInfo" class="gift-page-info">第 1/1 页</span>
    <button id="giftHistoryNext" type="button" disabled>下一页 →</button>
  </div>
</aside>
