<!-- 全部礼物记录抽屉 -->
<div class="gift-drawer-backdrop" id="giftHistoryBackdrop"></div>
<aside
  class="gift-drawer"
  id="giftHistoryDrawer"
  role="dialog"
  aria-modal="true"
  aria-labelledby="giftHistoryTitle"
>
  <div class="gift-drawer-head">
    <button
      id="giftHistoryClose"
      class="secondary sm"
      type="button"
      title="返回礼物（Esc）"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
      返回礼物
    </button>
    <div class="gift-drawer-title">
      <strong id="giftHistoryTitle" class="ui-section-title"
        >全部礼物记录</strong
      >
      <span id="giftHistoryTotal" class="ui-caption" hidden></span>
      <span
        id="giftLedgerSyncStatus"
        class="ui-caption"
        role="status"
        aria-live="polite"
        hidden
      ></span>
    </div>
    <button id="giftHistoryRetryBtn" class="secondary sm" type="button" hidden>
      重新加载
    </button>
    <button
      id="giftHistoryClearDatabaseBtn"
      class="danger sm"
      type="button"
      title="删除当前账号在本机和云端的全部礼物记录"
    >
      清空全部记录
    </button>
  </div>

  <form id="giftHistoryFilters" class="gift-history-filters" data-gift-pane="list">
    <label>用户<input id="giftHistoryUserQuery" type="search" maxlength="100" placeholder="名称关键词" /></label>
    <label>礼物<input id="giftHistoryGiftQuery" type="search" maxlength="100" placeholder="礼物名称" /></label>
    <label>金额大于（元）<input id="giftHistoryAmountAbove" type="number" min="0" step="0.01" inputmode="decimal" placeholder="不限" title="按单条礼物记录的总金额筛选，不包含等于门槛的记录" /></label>
    <label>开始日期<input id="giftHistoryStartDate" type="date" /></label>
    <label>结束日期<input id="giftHistoryEndDate" type="date" /></label>
    <button id="giftHistoryToday" type="button" class="secondary">今天</button>
    <button id="giftHistoryReset" type="button" class="secondary">重置</button>
    <button type="submit">查询</button>
    <span class="hint">北京时间</span>
    <span id="giftHistoryFilterError" role="alert"></span>
  </form>
  <div class="gift-history-tools" data-gift-pane="list">
    <button id="giftHistorySelectAll" class="secondary sm" type="button">选择全部筛选结果</button>
    <button id="giftHistoryCancelSelect" class="secondary sm" type="button" hidden>取消全选</button>
    <span id="giftHistorySelectionNotice" class="hint" role="status"></span>
    <button id="giftDisplaySettingsOpen" class="secondary sm" type="button">礼物样式与本日展示</button>
  </div>
  <div class="gift-drawer-body" data-gift-pane="list">
    <span id="giftHistoryState" class="sr-only" role="status" aria-live="polite"
      >正在加载礼物记录…</span
    >
    <table class="gift-history-table">
      <colgroup>
        <col class="gift-history-select-col" />
        <col class="gift-history-time-col" />
        <col class="gift-history-name-col" />
        <col class="gift-history-count-col" />
        <col class="gift-history-money-col" />
        <col class="gift-history-user-col" />
        <col class="gift-history-remarks-col" />
      </colgroup>
      <thead>
        <tr>
          <th><input id="giftHistorySelectPage" type="checkbox" aria-label="选择本页礼物" /></th>
          <th data-sort="created_at" aria-sort="none" tabindex="0">
            时间<span class="sort-arrow" aria-hidden="true"></span>
          </th>
          <th data-sort="gift_name" aria-sort="none" tabindex="0">
            礼物<span class="sort-arrow" aria-hidden="true"></span>
          </th>
          <th>数量</th>
          <th data-sort="price" aria-sort="none" tabindex="0">
            金额<span class="sort-arrow" aria-hidden="true"></span>
          </th>
          <th>用户</th>
          <th data-sort="remarks" aria-sort="none" tabindex="0">
            备注<span class="sort-arrow" aria-hidden="true"></span>
          </th>
        </tr>
      </thead>
      <tbody id="giftHistoryBody">
        <tr>
          <td colspan="7" class="empty">正在加载礼物记录…</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="gift-drawer-footer" data-gift-pane="list">
    <span id="giftHistorySelectedCount">已选 0 条</span>
    <button id="giftHistoryDeselect" type="button" class="secondary">取消选择</button>
    <button id="giftHistoryPrev" type="button" disabled>← 上一页</button>
    <span id="giftHistoryPageInfo" class="gift-page-info">第 1/1 页</span>
    <button id="giftHistoryNext" type="button" disabled>下一页 →</button>
    <button id="giftHistoryExport" type="button" class="primary" disabled>导出所选</button>
  </div>
  <section id="giftExportPanel" class="gift-export-panel" data-gift-pane="export" hidden>
    <div class="gift-subview-head"><button id="giftExportBack" type="button" class="secondary">返回选择</button><span id="giftExportSummary"></span></div>
    <div class="gift-export-layout">
      <div class="gift-export-preview-scroll"><div id="giftExportPreview" class="gift-banner-stage"></div></div>
      <div class="gift-export-options">
        <label>输出方式<select id="giftExportMode"><option value="combined">拼成一张（超长自动分图）</option><option value="separate">每条一张</option></select></label>
        <label>图片背景<select id="giftExportBackground"><option value="transparent">透明</option><option value="white">白色</option></select></label>
        <div class="gift-preview-pagination"><button id="giftExportPrev" type="button" class="secondary">上一张</button><span id="giftExportPage"></span><button id="giftExportNext" type="button" class="secondary">下一张</button></div>
        <label>保存位置<output id="giftExportDirectory"></output></label>
        <div class="gift-directory-actions"><button id="giftExportChoose" class="secondary" type="button">选择文件夹</button><button id="giftExportDefault" class="secondary" type="button">系统默认</button></div>
        <label class="gift-check-label"><input id="giftExportRemember" type="checkbox" />下次默认使用此文件夹</label>
        <p id="giftExportFiles" class="hint"></p>
        <p id="giftExportStatus" role="status" aria-live="polite"></p>
        <button id="giftExportSave" type="button" class="primary">导出 PNG</button>
        <button id="giftExportCancel" type="button" class="secondary" hidden>取消导出</button>
        <button id="giftExportOpenFolder" type="button" class="secondary" hidden>打开文件夹</button>
      </div>
    </div>
  </section>
  <section id="giftDisplaySettings" class="gift-display-settings" data-gift-pane="settings" hidden>
    <div class="gift-subview-head"><button id="giftDisplayBack" type="button" class="secondary">返回流水</button><strong>礼物样式与本日展示</strong></div>
    <form id="giftDisplayForm">
      <div class="gift-display-columns">
        <div class="gift-display-group">
          <div class="gift-display-group-head">
            <h3>礼物价格区间</h3><p class="hint">按每条礼物的单价 × 数量分色；金额不进入横幅。</p>
          </div>
          <div class="gift-tier-inputs">
            <div>
              <span class="gift-tier-swatch" aria-hidden="true"></span><span>浅蓝</span>
              <input type="number" value="0" readonly aria-label="浅蓝起始金额（元）" />
              <span aria-hidden="true">～</span>
              <input id="giftTierEnd0" data-gift-boundary="1" type="number" min="0.01" step="0.01" required aria-label="浅蓝结束金额（元）" />
            </div>
            <div>
              <span class="gift-tier-swatch" aria-hidden="true"></span><span>紫蓝</span>
              <input id="giftTier1" data-gift-boundary="1" type="number" min="0.01" step="0.01" required aria-label="紫蓝起始金额（元）" />
              <span aria-hidden="true">～</span>
              <input id="giftTierEnd1" data-gift-boundary="2" type="number" min="0.01" step="0.01" required aria-label="紫蓝结束金额（元）" />
            </div>
            <div>
              <span class="gift-tier-swatch" aria-hidden="true"></span><span>粉红</span>
              <input id="giftTier2" data-gift-boundary="2" type="number" min="0.01" step="0.01" required aria-label="粉红起始金额（元）" />
              <span aria-hidden="true">～</span>
              <input id="giftTierEnd2" data-gift-boundary="3" type="number" min="0.01" step="0.01" required aria-label="粉红结束金额（元）" />
            </div>
            <div>
              <span class="gift-tier-swatch" aria-hidden="true"></span><span>橙金</span>
              <input id="giftTier3" data-gift-boundary="3" type="number" min="0.01" step="0.01" required aria-label="橙金起始金额（元）" />
              <span aria-hidden="true">～</span>
              <input type="text" value="不限" readonly aria-label="橙金结束金额（元）" />
            </div>
          </div>
          <p class="hint">金额单位为元。包含起始金额、不含结束金额；相邻区间自动衔接。</p>
          <div class="gift-display-preview">
            <div id="giftStylePreview" class="gift-banner-stage"></div>
            <p class="hint">示例横幅；达到分界时进入新档。修改只更新草稿，保存后生效。</p>
          </div>
        </div>
        <div class="gift-display-group">
          <div class="gift-display-group-head">
            <h3>本日礼物循环</h3><p class="hint">循环显示本地已同步的今天礼物，北京时间零点换日。</p>
          </div>
          <label>显示行数<input id="giftFeedRows" type="number" min="1" max="10" required /></label>
          <label>滚动间隔（秒）<input id="giftFeedInterval" type="number" min="2" max="60" required /></label>
          <label class="gift-check-label"><input id="giftFeedPaused" type="checkbox" />暂停播放</label>
          <label class="gift-check-label"><input id="giftFeedLowPower" type="checkbox" />低功耗（逐页切换）</label>
          <div class="gift-feed-source">
            <label>OBS 浏览器源<input id="giftFeedUrl" readonly /></label>
            <div class="gift-directory-actions"><button id="giftFeedCopy" type="button" class="secondary">复制地址</button><a id="giftFeedPreviewLink" target="_blank" rel="noopener">打开本日预览</a></div>
            <p class="hint">横幅基础宽度 560，多位数量会向右延长；OBS 建议宽度 900，高度随显示行数调整。关闭此面板后仍继续播放。</p>
          </div>
        </div>
      </div>
      <p id="giftDisplayError" role="alert"></p>
      <div class="gift-display-actions"><button class="primary" type="submit">保存设置</button><button id="giftDisplayDefaults" class="secondary" type="button">恢复默认</button><button id="giftDisplayCancel" class="secondary" type="button">取消</button></div>
    </form>
  </section>
</aside>
