<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 LIRA</title>
    <link rel="stylesheet" href="/css/license.css" />
  </head>
  <body>
    <div class="license-shell">
      <header class="license-titlebar">
        <a class="license-brand" href="/license" aria-label="LIRA 激活">
          <span class="license-brand-mark" aria-hidden="true">L</span>
          <span>LIRA</span>
        </a>
        <span class="license-titlebar-label">主播登录</span>
        <div class="license-window-controls" aria-label="窗口控制">
          <button id="licenseMinimizeBtn" type="button" aria-label="最小化">
            −
          </button>
          <button id="licenseMaximizeBtn" type="button" aria-label="最大化">
            □
          </button>
          <button
            id="licenseCloseBtn"
            class="close"
            type="button"
            aria-label="退出 LIRA"
          >
            ×
          </button>
        </div>
      </header>

      <main class="license-main">
        <section
          id="licenseLoginCard"
          class="license-card"
          aria-labelledby="licenseHeading"
        >
          <div class="license-card-heading">
            <p class="license-kicker">主播工作台</p>
            <h1 id="licenseHeading">登录 LIRA</h1>
            <p>首次登录需绑定这台设备</p>
          </div>
          <form id="licenseForm" novalidate>
            <label class="license-field" for="licenseAccountName">
              <span>用户名</span>
              <input
                id="licenseAccountName"
                name="accountName"
                type="text"
                inputmode="text"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                maxlength="32"
                placeholder="例如 mlbb"
                required
              />
              <small>小写字母、数字或中划线</small>
            </label>
            <label class="license-field" for="licensePassword">
              <span>密码</span>
              <input
                id="licensePassword"
                name="password"
                type="password"
                autocomplete="new-password"
                maxlength="128"
                placeholder="至少 6 个字符"
                required
              />
            </label>
            <label class="license-field" for="licenseActivationCode">
              <span>激活密钥</span>
              <input
                id="licenseActivationCode"
                name="activationCode"
                type="text"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                maxlength="128"
                placeholder="XXXX-XXXX-XXXX-XXXX"
                required
              />
              <small>由管理员提供的一次性密钥</small>
            </label>
            <p
              id="licenseStatus"
              class="license-status"
              role="status"
              aria-live="polite"
            ></p>
            <button id="licenseSubmitBtn" class="license-submit" type="submit">
              激活并进入 LIRA
            </button>
            <button
              id="licenseRetryBtn"
              class="license-retry"
              type="button"
              hidden
            >
              重试连接
            </button>
          </form>
          <p class="license-footnote">密码和激活密钥不会保存在本机。</p>
        </section>
        <section
          id="giftCatalogInitializationCard"
          class="license-card license-initialization-card"
          aria-labelledby="giftCatalogInitializationHeading"
          aria-busy="true"
          hidden
        >
          <div class="license-card-heading">
            <p class="license-kicker">首次使用准备</p>
            <h1 id="giftCatalogInitializationHeading">正在准备礼物图片</h1>
            <p id="giftCatalogInitializationPhase">正在获取礼物目录</p>
          </div>
          <div class="license-progress-heading">
            <strong id="giftCatalogInitializationPercent">0%</strong>
            <span id="giftCatalogInitializationCount">等待开始</span>
          </div>
          <progress
            id="giftCatalogInitializationProgress"
            class="license-progress"
            max="100"
            value="0"
            aria-label="礼物图片初始化进度"
          ></progress>
          <p
            id="giftCatalogInitializationStatus"
            class="license-status license-initialization-status loading"
            role="status"
            aria-live="polite"
          >
            正在连接服务器…
          </p>
          <button
            id="giftCatalogInitializationRetryBtn"
            class="license-retry"
            type="button"
            hidden
          >
            重试初始化
          </button>
        </section>
      </main>
    </div>
    <script src="/js/license.js"></script>
  </body>
</html>
