<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 LIRA</title>
    <link rel="stylesheet" href="/css/styles-base.css" />
    <link rel="stylesheet" href="/css/components/contextual-help.css" />
    <link rel="stylesheet" href="/css/license.css" />
  </head>
  <body>
    <div class="license-shell">
      <header class="license-titlebar">
        <div class="license-brand">
          <span class="license-brand-mark" aria-hidden="true">L</span>
          <span>LIRA</span>
        </div>
        <div class="license-window-controls" aria-label="窗口控制">
          <button
            id="licenseMinimizeBtn"
            type="button"
            aria-label="最小化"
            title="最小化"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <use href="/img/shared/window-controls.svg#minus"></use>
            </svg>
          </button>
          <button
            id="licenseMaximizeBtn"
            type="button"
            aria-label="最大化"
            title="最大化"
          >
            <svg class="maximize-icon" viewBox="0 0 24 24" aria-hidden="true">
              <use href="/img/shared/window-controls.svg#square"></use>
            </svg>
            <svg class="restore-icon" viewBox="0 0 24 24" aria-hidden="true">
              <use href="/img/shared/window-controls.svg#copy"></use>
            </svg>
          </button>
          <button
            id="licenseCloseBtn"
            class="close"
            type="button"
            aria-label="退出 LIRA"
            title="退出 LIRA"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <use href="/img/shared/window-controls.svg#x"></use>
            </svg>
          </button>
        </div>
      </header>

      <main class="license-main">
        <div class="license-stage">
          <aside class="license-intro" aria-labelledby="licenseWelcomeHeading">
            <div>
              <h2 id="licenseWelcomeHeading">让每一次互动，<br />都有回响。</h2>
            </div>
            <div class="license-art" aria-hidden="true">
              <span class="license-echo"></span>
              <span class="license-echo"></span>
              <span class="license-echo"></span>
              <span class="license-echo"></span>
              <div class="license-record"></div>
            </div>
            <p class="license-intro-caption">
              <span class="license-signal" aria-hidden="true">
                <span></span><span></span><span></span><span></span
                ><span></span>
              </span>
              点歌 · 弹幕 · 礼物
            </p>
          </aside>
          <section
            id="licenseLoginCard"
            class="license-card"
            aria-labelledby="licenseHeading"
          >
            <div
              class="license-account-modes"
              role="group"
              aria-label="账号入口"
            >
              <button
                id="licenseRegisterMode"
                type="button"
                aria-pressed="true"
              >
                注册新账号
              </button>
              <button id="licenseLoginMode" type="button" aria-pressed="false">
                登录已有账号
              </button>
            </div>
            <div class="license-card-heading">
              <h1 id="licenseHeading">注册 LIRA</h1>
              <p id="licenseModeDescription">
                创建账号并授权这台电脑
              </p>
            </div>
            <form id="licenseForm" novalidate>
              <label class="license-field" for="licenseAccountName">
                <span>用户名</span>
                <input
                  id="licenseAccountName"
                  name="accountName"
                  type="text"
                  inputmode="text"
                  autocomplete="username"
                  autocapitalize="none"
                  spellcheck="false"
                  maxlength="32"
                  placeholder="请输入用户名"
                  required
                />
                <small>小写字母、数字或中划线</small>
              </label>
              <div class="license-field">
                <div class="license-field-label">
                  <label for="licensePassword">密码</label>
                  <lira-help label="密码规则" tooltip-id="licensePasswordRules">
                    新密码需 8–64
                    个字符，包含大写字母、小写字母、中文、数字、符号中的至少三类。可使用空格，请勿使用常见弱密码。
                  </lira-help>
                </div>
                <div class="license-password-control">
                  <input
                    id="licensePassword"
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    autocapitalize="none"
                    spellcheck="false"
                    aria-describedby="licensePasswordRules"
                    placeholder="请输入密码"
                    required
                  />
                  <button
                    id="licensePasswordToggle"
                    class="license-password-toggle"
                    type="button"
                    aria-label="显示密码"
                    aria-pressed="false"
                    aria-controls="licensePassword"
                    title="显示密码"
                  >
                    <svg
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <use
                        id="licensePasswordIcon"
                        href="/img/shared/password-visibility.svg#eye"
                      />
                    </svg>
                  </button>
                </div>
              </div>
              <label class="license-field" for="licenseActivationCode">
                <span id="licenseCodeLabel">注册激活码</span>
                <input
                  id="licenseActivationCode"
                  name="activationCode"
                  type="text"
                  autocomplete="off"
                  autocapitalize="characters"
                  spellcheck="false"
                  maxlength="128"
                  placeholder="XXXX-XXXX-XXXX-XXXX"
                  required
                />
                <small id="licenseCodeHelp"
                  >由管理员下发的一次性注册码，用户名不可重复</small
                >
              </label>
              <p
                id="licenseStatus"
                class="license-status"
                role="status"
                aria-live="polite"
              >
                激活功能正在加载；若长时间无响应，请重启 LIRA。
              </p>
              <button
                id="licenseSubmitBtn"
                class="license-submit"
                type="submit"
                disabled
              >
                <span id="licenseSubmitLabel">注册并进入</span>
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path d="M5 12h14m-5-5 5 5-5 5" />
                </svg>
              </button>
              <button
                id="licenseRetryBtn"
                class="license-retry"
                type="button"
                hidden
              >
                重试连接
              </button>
            </form>
          </section>
          <section
            id="giftCatalogInitializationCard"
            class="license-card license-initialization-card"
            aria-labelledby="giftCatalogInitializationHeading"
            aria-busy="true"
            hidden
          >
            <div class="license-card-heading">
              <p class="license-kicker">首次使用准备</p>
              <h1 id="giftCatalogInitializationHeading">
                正在为你准备直播工具
              </h1>
            </div>
            <div class="license-progress-heading">
              <strong id="giftCatalogInitializationPercent">0%</strong>
            </div>
            <progress
              id="giftCatalogInitializationProgress"
              class="license-progress"
              max="100"
              value="0"
              aria-label="准备进度"
            ></progress>
            <p
              id="giftCatalogInitializationStatus"
              class="license-status license-initialization-status"
              role="status"
              aria-live="polite"
              hidden
            ></p>
            <button
              id="giftCatalogInitializationRetryBtn"
              class="license-retry"
              type="button"
              hidden
            >
              重试
            </button>
            <button
              id="giftCatalogInitializationBackBtn"
              class="license-retry"
              type="button"
              hidden
            >
              返回登录
            </button>
          </section>
        </div>
      </main>
    </div>
    <script type="module" src="/js/admin/contextual-help.js"></script>
    <script src="/js/license.js"></script>
  </body>
</html>
