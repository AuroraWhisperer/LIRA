<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 LIRA</title>
    <link rel="stylesheet" href="/css/styles-base.css" />
    <link rel="stylesheet" href="/css/components/contextual-help.css" />
    <link rel="stylesheet" href="/css/license.css" />
  </head>
  <body>
    <div class="license-shell">
      <header class="license-titlebar">
        <div class="license-brand">
          <span class="license-brand-mark" aria-hidden="true">L</span>
          <span>LIRA</span>
        </div>
        <div class="license-window-controls" aria-label="窗口控制">
          <button
            id="licenseMinimizeBtn"
            type="button"
            aria-label="最小化"
            title="最小化"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <use href="/img/shared/window-controls.svg#minus"></use>
            </svg>
          </button>
          <button
            id="licenseMaximizeBtn"
            type="button"
            aria-label="最大化"
            title="最大化"
          >
            <svg class="maximize-icon" viewBox="0 0 24 24" aria-hidden="true">
              <use href="/img/shared/window-controls.svg#square"></use>
            </svg>
            <svg class="restore-icon" viewBox="0 0 24 24" aria-hidden="true">
              <use href="/img/shared/window-controls.svg#copy"></use>
            </svg>
          </button>
          <button
            id="licenseCloseBtn"
            class="close"
            type="button"
            aria-label="退出 LIRA"
            title="退出 LIRA"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <use href="/img/shared/window-controls.svg#x"></use>
            </svg>
          </button>
        </div>
      </header>

      <main class="license-main">
        <section
          id="licenseLoginCard"
          class="license-card"
          aria-labelledby="licenseHeading"
        >
          <div class="license-card-heading">
            <p class="license-kicker">主播工作台</p>
            <h1 id="licenseHeading">登录 LIRA</h1>
            <p>首次登录需绑定这台设备</p>
          </div>
          <form id="licenseForm" novalidate>
            <label class="license-field" for="licenseAccountName">
              <span>用户名</span>
              <input
                id="licenseAccountName"
                name="accountName"
                type="text"
                inputmode="text"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                maxlength="32"
                placeholder="请输入用户名"
                required
              />
              <small>小写字母、数字或中划线</small>
            </label>
            <div class="license-field">
              <div class="license-field-label">
                <label for="licensePassword">密码</label>
                <lira-help label="密码规则" tooltip-id="licensePasswordRules">
                  8–64 个字符，必须包含大写英文字母、小写英文字母、数字和半角特殊符号（如 !@#$%）。不允许中文、空格或不可见字符。
                </lira-help>
              </div>
              <div class="license-password-control">
                <input
                  id="licensePassword"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  autocapitalize="none"
                  spellcheck="false"
                  aria-describedby="licensePasswordRules"
                  maxlength="128"
                  placeholder="8–64 个字符"
                  required
                />
                <button
                  id="licensePasswordToggle"
                  class="license-password-toggle"
                  type="button"
                  aria-label="显示密码"
                  aria-pressed="false"
                  aria-controls="licensePassword"
                  title="显示密码"
                >
                  <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                    <use
                      id="licensePasswordIcon"
                      href="/img/shared/password-visibility.svg#eye"
                    />
                  </svg>
                </button>
              </div>
            </div>
            <label class="license-field" for="licenseActivationCode">
              <span>激活密钥</span>
              <input
                id="licenseActivationCode"
                name="activationCode"
                type="text"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                maxlength="128"
                placeholder="XXXX-XXXX-XXXX-XXXX"
                required
              />
              <small>由管理员提供的一次性密钥</small>
            </label>
            <p
              id="licenseStatus"
              class="license-status"
              role="status"
              aria-live="polite"
            ></p>
            <button id="licenseSubmitBtn" class="license-submit" type="submit">
              激活并进入 LIRA
            </button>
            <button
              id="licenseRetryBtn"
              class="license-retry"
              type="button"
              hidden
            >
              重试连接
            </button>
          </form>
        </section>
        <section
          id="giftCatalogInitializationCard"
          class="license-card license-initialization-card"
          aria-labelledby="giftCatalogInitializationHeading"
          aria-busy="true"
          hidden
        >
          <div class="license-card-heading">
            <p class="license-kicker">首次使用准备</p>
            <h1 id="giftCatalogInitializationHeading">正在准备礼物图片</h1>
            <p id="giftCatalogInitializationPhase">正在获取礼物目录</p>
          </div>
          <div class="license-progress-heading">
            <strong id="giftCatalogInitializationPercent">0%</strong>
            <span id="giftCatalogInitializationCount">等待开始</span>
          </div>
          <progress
            id="giftCatalogInitializationProgress"
            class="license-progress"
            max="100"
            value="0"
            aria-label="礼物图片初始化进度"
          ></progress>
          <p
            id="giftCatalogInitializationStatus"
            class="license-status license-initialization-status loading"
            role="status"
            aria-live="polite"
          >
            正在连接服务器…
          </p>
          <button
            id="giftCatalogInitializationRetryBtn"
            class="license-retry"
            type="button"
            hidden
          >
            重试初始化
          </button>
        </section>
      </main>
    </div>
    <script type="module" src="/js/admin/contextual-help.js"></script>
    <script src="/js/license.js"></script>
  </body>
</html>
