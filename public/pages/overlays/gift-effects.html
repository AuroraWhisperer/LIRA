<!-- B站礼物全屏特效 overlay：固定网址监听直播礼物与手动预览事件。 -->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>礼物特效</title>
    <link rel="stylesheet" href="/css/overlays/base.css?v=20260815-01" />
    <link rel="stylesheet" href="/css/overlays/gift-effects.css?v=20261003-02" />
    <link rel="stylesheet" href="/css/shared/guard-thanks.css?v=20261003-01" />
  </head>
  <body class="overlay-body gift-effects-overlay-body">
    <main id="giftEffectStage" aria-live="off">
      <div id="giftFrame" aria-hidden="true">
        <video
          id="giftFrameVideo"
          class="gift-frame-video"
          src="/img/overlays/gift-frame/woodland-bloom/woodland-bloom-v4.webm"
          width="1920"
          height="1080"
          muted
          playsinline
          preload="auto"
        ></video>
        <div id="giftInfo" class="gift-info" role="status" aria-live="polite">
          <div class="gift-info-viewer">
            <span>感谢</span><strong id="giftInfoUser" class="gift-info-user"></strong>
          </div>
          <div class="gift-info-gift">
            <span>送出</span><strong id="giftInfoName" class="gift-info-name"></strong><strong id="giftInfoNum" class="gift-info-num"></strong>
          </div>
        </div>
      </div>
    </main>
    <div id="guardThanksRoot" class="guard-thanks-root" aria-live="polite"></div>
    <div id="giftEffectStatus" class="gift-effect-status" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/js/overlays/gift-effects.js?v=20261003-02"></script>
  </body>
</html>
