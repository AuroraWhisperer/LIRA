<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>直播小游戏</title>
    <link rel="stylesheet" href="/css/overlays/games.css?v=20260820-03">
  </head>
  <body>
    <main id="gameStage" class="game-stage">
      <header class="game-stage-header">
        <h2 class="game-title bomb-title">数字炸弹</h2>
        <h2 class="game-title gomoku-title">五子棋</h2>
        <h2 class="game-title draw-title">你画我猜</h2>
        <div class="game-stage-meta">
          <span id="gameTurn" class="game-turn">等待开局</span>
          <span id="bombHint" class="bomb-status">主播先手 · 点击一个数字</span>
          <span id="bombHistory" class="bomb-status"></span>
          <span id="drawMeta" class="draw-status"></span>
        </div>
      </header>
      <section id="numberBombView" class="game-view" hidden>
        <div id="bombNumbers" class="bomb-numbers" aria-label="数字炸弹选择区"></div>
      </section>
      <section id="gomokuView" class="game-view gomoku-view" hidden>
        <div class="gomoku-board-wrap">
          <div id="gomokuColumnLabels" class="gomoku-column-labels" aria-hidden="true"></div>
          <div id="gomokuRowLabels" class="gomoku-row-labels" aria-hidden="true"></div>
          <div id="gomokuBoard" class="gomoku-board" aria-label="五子棋棋盘"></div>
        </div>
      </section>
      <section id="drawGuessView" class="game-view draw-guess-view" hidden>
        <div class="draw-layout">
          <div class="draw-main-column">
            <div class="draw-canvas-panel">
              <div class="draw-canvas-wrap">
                <canvas id="drawCanvas" class="draw-canvas" width="1280" height="720" aria-label="主播绘画画布"></canvas>
                <div id="drawRoundResult" class="draw-round-result" hidden>
                  <span>本局答案</span>
                  <strong id="drawRevealedAnswer"></strong>
                </div>
              </div>
              <div class="draw-toolbar" aria-label="画笔工具">
              <div class="draw-color-tools" aria-label="画笔颜色">
                <button type="button" data-draw-color="#222034" aria-label="墨黑" aria-pressed="true"></button>
                <button type="button" data-draw-color="#6c5ce7" aria-label="紫色" aria-pressed="false"></button>
                <button type="button" data-draw-color="#ef476f" aria-label="红色" aria-pressed="false"></button>
                <button type="button" data-draw-color="#118ab2" aria-label="蓝色" aria-pressed="false"></button>
                <button type="button" data-draw-color="#06d6a0" aria-label="绿色" aria-pressed="false"></button>
                <button type="button" data-draw-color="#f6bd60" aria-label="黄色" aria-pressed="false"></button>
                <button type="button" data-draw-color="#ffffff" aria-label="白色橡皮" aria-pressed="false"></button>
              </div>
              <div class="draw-width-tools" aria-label="画笔粗细">
                <button type="button" data-draw-width="2" aria-label="细笔" aria-pressed="false"><span></span></button>
                <button type="button" data-draw-width="4" aria-label="中笔" aria-pressed="true"><span></span></button>
                <button type="button" data-draw-width="8" aria-label="粗笔" aria-pressed="false"><span></span></button>
                <button type="button" data-draw-width="12" aria-label="特粗笔" aria-pressed="false"><span></span></button>
              </div>
                <button id="drawEraserBtn" class="draw-eraser-button" type="button" aria-pressed="false">橡皮擦</button>
                <button id="drawClearBtn" class="draw-clear-button" type="button">清空画布</button>
              </div>
            </div>
            <div class="draw-left-stats">
              <div class="draw-clue-card">
                <span>直播间线索</span>
                <strong id="drawClue">等待开局</strong>
                <small>输入答案即可抢答</small>
              </div>
              <section class="draw-score-section" aria-labelledby="drawScoreTitle">
                <div class="draw-panel-heading"><strong id="drawScoreTitle">总积分</strong><span id="drawCorrectCount">0 人答对</span></div>
                <ol id="drawScoreboard" class="draw-scoreboard"></ol>
              </section>
              <section class="draw-correct-section" aria-labelledby="drawCorrectTitle">
                <div class="draw-panel-heading"><strong id="drawCorrectTitle">本局抢答</strong><span>10 / 7 / 5 / 3</span></div>
                <ol id="drawCorrectFeed" class="draw-correct-feed"></ol>
              </section>
            </div>
          </div>
          <aside class="draw-danmaku-panel" aria-label="直播消息">
            <div class="draw-danmaku-heading"><small id="drawDanmakuCount">0 条</small></div>
            <div id="drawDanmakuFeed" class="draw-danmaku-feed"><div class="draw-danmaku-empty">等待直播间弹幕…</div></div>
          </aside>
        </div>
      </section>
      <section id="gameEmptyView" class="game-empty" hidden><strong>等待主播开局</strong></section>
      <div id="gameResult" class="game-result" hidden>
        <div class="game-result-card">
          <div class="game-result-icon">
            <!-- 数字炸弹：爆炸图标 -->
            <svg class="icon-bomb" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <!-- 爆炸外层光晕 -->
              <circle cx="50" cy="50" r="42" fill="url(#explosion-glow)" opacity="0.6"/>
              <!-- 爆炸主体星形 -->
              <path d="M 50 10 L 55 40 L 85 35 L 60 55 L 90 80 L 58 65 L 50 95 L 42 65 L 10 80 L 40 55 L 15 35 L 45 40 Z" fill="url(#explosion-gradient)" stroke="#ff6b35" stroke-width="1.5"/>
              <!-- 中心亮点 -->
              <circle cx="50" cy="50" r="18" fill="#fff4e6"/>
              <circle cx="50" cy="50" r="12" fill="#ffe89f"/>
              <!-- 数字碎片 -->
              <text x="35" y="35" font-family="Bahnschrift, sans-serif" font-size="14" font-weight="700" fill="#ff8c5a" opacity="0.8">7</text>
              <text x="60" y="32" font-family="Bahnschrift, sans-serif" font-size="12" font-weight="700" fill="#ffb380" opacity="0.7">3</text>
              <text x="68" y="62" font-family="Bahnschrift, sans-serif" font-size="13" font-weight="700" fill="#ff6b35" opacity="0.75">9</text>
              <text x="28" y="68" font-family="Bahnschrift, sans-serif" font-size="11" font-weight="700" fill="#ffa366" opacity="0.7">5</text>
              <defs>
                <radialGradient id="explosion-glow">
                  <stop offset="0%" stop-color="#ffcc80" stop-opacity="0.8"/>
                  <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
                </radialGradient>
                <radialGradient id="explosion-gradient" cx="50%" cy="50%">
                  <stop offset="0%" stop-color="#ffe89f"/>
                  <stop offset="50%" stop-color="#ffb380"/>
                  <stop offset="100%" stop-color="#ff8c5a"/>
                </radialGradient>
              </defs>
            </svg>
            <!-- 五子棋：棋子图标 -->
            <svg class="icon-gomoku" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <circle cx="50" cy="50" r="35" fill="url(#stone-gradient)" stroke="#3a3a3a" stroke-width="2"/>
              <ellipse cx="42" cy="42" rx="8" ry="6" fill="#ffffff" opacity="0.4"/>
              <defs>
                <radialGradient id="stone-gradient" cx="40%" cy="40%">
                  <stop offset="0%" stop-color="#f0ead2"/>
                  <stop offset="100%" stop-color="#ddb892"/>
                </radialGradient>
              </defs>
            </svg>
          </div>
          <div class="game-result-winner">
            <img id="gameResultAvatar" class="game-result-avatar" alt="" hidden>
            <div id="gameResultText" class="game-result-text"></div>
          </div>
        </div>
      </div>
    </main>
    <script src="/js/overlays/games.js?v=20260820-01"></script>
  </body>
</html>
