<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>直播加班机</title>
    <link rel="stylesheet" href="/css/overlays/overtime.css?v=20260809-01">
  </head>
  <body>
    <main id="overtimeMachine" class="overtime-machine">
      <div id="overtimeBackground" class="overtime-background" aria-hidden="true">
        <div class="overtime-background-shade"></div>
      </div>
      <section class="overtime-foreground" aria-live="polite">
        <header class="overtime-clock-panel">
          <span id="overtimeStatus" class="overtime-status">连接中</span>
          <strong id="overtimeClock" class="overtime-clock">00:00:00</strong>
        </header>
        <div id="overtimeTickets" class="overtime-ticket-grid" aria-label="礼物时间票券"></div>
      </section>
      <div id="overtimeAdjustmentStage" class="overtime-adjustment-stage" aria-live="assertive"></div>
    </main>
    <script src="/js/overlays/overtime.js?v=20260809-01"></script>
  </body>
</html>
