<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>弹幕姬</title>
    <link rel="stylesheet" href="/css/overlays/danmaku.css?v=20261026-02" />
  </head>
  <body class="danmaku-overlay-body" data-style="signal">
    <aside id="danmakuPreviewControls" class="danmaku-preview-controls" aria-label="弹幕样式预览" hidden>
      <h1>弹幕布局</h1>
      <p>布置弹幕在直播画面中的位置。</p>
      <section class="canvas-settings" aria-labelledby="canvasSettingsTitle">
        <h2 id="canvasSettingsTitle">画布设置</h2>
        <label>分辨率<select id="canvasPreset">
          <option value="1280x720">1280 × 720 · 720p</option>
          <option value="1920x1080" selected>1920 × 1080 · 1080p</option>
          <option value="2560x1440">2560 × 1440 · 1440p</option>
          <option value="3840x2160">3840 × 2160 · 4K</option>
          <option value="1080x1920">1080 × 1920 · 竖屏</option>
          <option value="custom">自定义</option>
        </select></label>
        <div class="canvas-fields">
          <label>画布宽度<input id="canvasWidth" type="number" min="320" max="7680" step="1" /></label>
          <label>画布高度<input id="canvasHeight" type="number" min="320" max="7680" step="1" /></label>
        </div>
      </section>
      <div class="danmaku-preview-choices" role="group" aria-label="固定位置弹幕">
        <h2>固定位置</h2>
        <button type="button" data-preview-style="bubble" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/bubble.png" alt="" />
          <span>琉璃<small>圆角底色，头像在左</small></span>
        </button>
        <button type="button" data-preview-style="signal" aria-pressed="true">
          <img src="/img/overlays/danmaku-previews/signal.png" alt="" />
          <span>青墨笺<small>深色切角，彩色边线</small></span>
        </button>
        <button type="button" data-preview-style="minimal" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/minimal.png" alt="" />
          <span>蝶恋花<small>居中文字，蝴蝶结装饰</small></span>
        </button>
        <button type="button" data-preview-style="ranked" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/ranked.png" alt="" />
          <span>经典样式<small>大圆头像，昵称在气泡上方</small></span>
        </button>
        <button type="button" data-preview-style="transparent" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/transparent.png" alt="" />
          <span>留白<small>无底色，文字直接叠加</small></span>
        </button>
        <button type="button" data-preview-style="sketch" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/sketch.png" alt="" />
          <span>绿萌简笔画</span>
        </button>
        <button type="button" data-preview-style="prismatic" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/prismatic.png" alt="" />
          <span>流霞<small>官方身份 · 柔和彩色气泡</small></span>
        </button>
        <button type="button" data-preview-style="harbor" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/harbor.png" alt="" />
          <span>对白<small>身份配色、航海头像框与在线榜前三</small></span>
        </button>
        <button type="button" data-preview-style="starlight" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/starlight.png" alt="" />
          <span>星语<small>透明细线、闪星与右侧金额</small></span>
        </button>
        <button type="button" data-preview-style="moonlit" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/moonlit.png" alt="" />
          <span>月渡花汀<small>花鸟墨条，上任感谢与礼物卷轴</small></span>
        </button>
        <button type="button" data-preview-style="identity" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/identity.png" alt="" />
          <span>灵动弹幕<small>横向色块，右侧头像渐隐</small></span>
        </button>
        <button type="button" data-preview-style="snowfox" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/snowfox.png" alt="" />
          <span>雪狐物语<small>狐耳渐变气泡、雪屋留言，支持整条换色</small></span>
        </button>
        <button type="button" data-preview-style="ripploid" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/ripploid.png" alt="" />
          <span>RIPPLOID<small>票券、护照与撕裂卡带，支持事件分级换色</small></span>
        </button>
        <button type="button" data-preview-style="notebook" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/notebook.png" alt="" />
          <span>手账风<small>便笺、胶带与分层入场，保留 B 站表情</small></span>
        </button>
        <button type="button" data-preview-style="spooky" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/spooky.png" alt="" />
          <span>幽灵便笺<small>纸片、幽灵贴纸与 Chat Box</small></span>
        </button>
        <button type="button" data-preview-style="twitter" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/twitter.svg" alt="" />
          <span>仿推特 3.0<small>白色社交卡片、房主资料与高清矢量操作区</small></span>
        </button>
        <button type="button" data-preview-style="flower-letter" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/flower-letter.png" alt="" />
          <span>花与信笺<small>花叶信笺、邮戳与分层信封，默认悠哉字体</small></span>
        </button>
      </div>
      <div class="danmaku-preview-choices" role="group" aria-label="区域随机弹幕">
        <h2>区域随机</h2>
        <button type="button" data-preview-style="outline" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/outline.png" alt="" />
          <span>一纸素笺<small>白底圆角，只显示昵称和正文</small></span>
        </button>
        <button type="button" data-preview-style="mist" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/mist.png" alt="" />
          <span>青雾<small>透明白框、浅青大航海，含礼物感谢与 SC</small></span>
        </button>
        <button type="button" data-preview-style="whiteframe" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/whiteframe.png" alt="" />
          <span>白描<small>透明白线圆角框，昵称在上、礼物金额在下</small></span>
        </button>
        <button type="button" data-preview-style="cream" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/cream.png" alt="" />
          <span>杏花白<small>奶油底色，粉边与外置头像</small></span>
        </button>
        <button type="button" data-preview-style="glow" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/glow.png" alt="" />
          <span>流光溢彩<small>昵称在框上方，经典身份色柔光</small></span>
        </button>
        <button type="button" data-preview-style="starveil" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/starveil.png" alt="" />
          <span>点点流萤<small>随机雅色，细光胶囊与外置昵称</small></span>
        </button>
      </div>
      <div class="danmaku-preview-choices" role="group" aria-label="飘窗弹幕">
        <h2>飘窗弹幕</h2>
        <button type="button" data-preview-style="floating" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/floating.png" alt="" />
          <span>浮光掠影<small>从右向左，大航海深色、普通浅色</small></span>
        </button>
        <button type="button" data-preview-style="comet" aria-pressed="false">
          <img src="/img/overlays/danmaku-previews/comet.png" alt="" />
          <span>鹤舞花枝间<small>香槟金框、花枝白鹤，独立昵称牌</small></span>
        </button>
      </div>
      <section class="canvas-settings" aria-labelledby="regionSettingsTitle">
        <h2 id="regionSettingsTitle">弹幕区域</h2>
        <div class="canvas-fields">
          <label>区域宽度<input id="regionWidth" type="number" min="64" step="1" /></label>
          <label>区域高度<input id="regionHeight" type="number" min="64" step="1" /></label>
          <label>水平位置 X<input id="regionX" type="number" min="0" step="1" /></label>
          <label>垂直位置 Y<input id="regionY" type="number" min="0" step="1" /></label>
        </div>
        <div class="canvas-actions">
          <button id="regionCenter" type="button">居中</button>
          <button id="regionFill" type="button">铺满画布</button>
          <button id="regionReset" type="button">恢复默认</button>
        </div>
        <p id="regionHint">拖动区域移动，拖动边框调整大小。单位：px。</p>
      </section>
      <section class="canvas-settings" aria-labelledby="appearanceTitle">
        <h2 id="appearanceTitle">样式参数</h2>
        <div id="previewParameterFields"></div>
        <button id="previewAppearanceReset" type="button">恢复当前样式默认参数</button>
      </section>
      <p class="danmaku-preview-note">本地示例每 1.6～4.4 秒随机一条，循环演示。修改仅为草稿，应用后更新直播画面。</p>
    </aside>
    <div id="danmakuPreviewViewport" class="danmaku-overlay-viewport">
      <div class="canvas-toolbar">
        <p id="danmakuPreviewDescription" role="status"></p>
        <span id="canvasZoom"></span>
        <button id="previewRefresh" type="button">重新播放</button>
        <button id="previewClose" type="button" hidden>关闭</button>
      </div>
      <div id="danmakuCanvasHost" class="danmaku-canvas-space">
        <div id="danmakuCanvas" class="danmaku-canvas">
          <div id="danmakuSelection" class="danmaku-selection" tabindex="0" role="group" aria-label="弹幕区域，方向键微调，Shift 加速">
            <span class="selection-label" id="selectionLabel"></span>
            <i data-handle="nw"></i><i data-handle="n"></i><i data-handle="ne"></i><i data-handle="e"></i>
            <i data-handle="se"></i><i data-handle="s"></i><i data-handle="sw"></i><i data-handle="w"></i>
          </div>
          <div id="danmakuRegion" class="danmaku-region">
            <main class="danmaku-signal-stage">
              <div class="spooky-frame" aria-hidden="true">
                <span class="spooky-frame-paper"></span><span class="spooky-frame-paper second"></span>
                <span class="spooky-frame-ribbon"></span>
                <div class="spooky-frame-board"><div class="spooky-frame-outline">
                  <span class="spooky-frame-web"></span><span class="spooky-frame-web"></span><span class="spooky-frame-web"></span><span class="spooky-frame-web"></span>
                </div></div><span class="spooky-frame-title">CHAT</span>
              </div>
              <header class="danmaku-signal-header" aria-label="弹幕接收状态">
                <span class="danmaku-signal-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                <span class="danmaku-signal-copy">
                  <small>ROOM SIGNAL / CHAT</small>
                  <strong id="danmakuConnectionState">正在连接弹幕</strong>
                </span>
                <span id="danmakuMessageCount" class="danmaku-signal-count">00</span>
              </header>
              <header class="twitter-profile" aria-label="当前直播间房主">
                <span class="twitter-profile-avatar-shell" aria-hidden="true">
                  <span id="twitterProfileAvatarFallback">房</span>
                  <img id="twitterProfileAvatar" alt="" referrerpolicy="no-referrer" decoding="async" hidden />
                </span>
                <div class="twitter-profile-copy">
                  <div class="twitter-profile-name-line">
                    <strong id="twitterProfileName">当前房主</strong>
                    <svg class="twitter-profile-verified" viewBox="0 0 24 24" aria-hidden="true">
                      <path d="m23 12-2.44-2.79.34-3.69-3.61-.82L15.4 1.5 12 2.96 8.6 1.5 6.71 4.69 3.1 5.5l.34 3.7L1 12l2.44 2.79-.34 3.7 3.61.82L8.6 22.5 12 21.03l3.4 1.46 1.89-3.19 3.61-.82-.34-3.69Z" fill="currentColor" stroke="none"></path>
                      <path d="m7.5 12 3 3 6-6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                  </div>
                  <div id="twitterProfileUid" class="twitter-profile-uid">@等待读取</div>
                </div>
                <span class="twitter-profile-follow" aria-hidden="true">Followed</span>
              </header>
              <nav class="twitter-tabs" aria-label="社交卡片标签">
                <span class="is-active">帖子</span><span>回复</span><span>媒体</span><span>喜欢</span>
              </nav>
              <section
                id="danmakuFeed"
                class="draw-danmaku-feed"
                role="log"
                aria-live="polite"
                aria-relevant="additions"
              ></section>
              <footer class="twitter-composer" aria-label="弹幕输入栏装饰">
                <svg class="twitter-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m3 3 8 .2 10 10-8 8L3 11Z"></path><circle cx="7.5" cy="7.5" r="1"></circle>
                </svg>
                <svg class="twitter-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="9"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"></path>
                </svg>
                <span id="twitterComposerText" class="twitter-composer-text">欢迎来到直播间 ✨</span>
                <svg class="twitter-icon twitter-composer-send" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m21 3-8.2 18-2.1-7.7L3 11.2 21 3Z"></path><path d="m10.7 13.3 4-4" fill="none" stroke="#fff" stroke-width="1.2"></path>
                </svg>
              </footer>
            </main>
          </div>
        </div>
      </div>
    </div>
    <footer class="canvas-footer">
      <div><p id="previewSaveState" role="status">本地草稿</p><small id="canvasSourceHint"></small></div>
      <button id="previewApply" type="button" disabled>应用到直播画面</button>
    </footer>
    <script type="module" src="/js/overlays/danmaku.js?v=20261025-01"></script>
  </body>
</html>
