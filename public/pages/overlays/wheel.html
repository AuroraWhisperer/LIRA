<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>转转盘</title>
    <link rel="stylesheet" href="/css/overlays/wheel.css?v=20260819-01">
  </head>
  <body>
    <main id="wheelStage" class="wheel-stage" aria-live="polite">
      <div class="wheel-wrap">
        <svg id="wheelSvg" class="wheel-svg" viewBox="0 0 600 600" role="img" aria-label="直播转盘">
          <g id="wheelGroup" class="wheel-group">
            <circle class="wheel-shadow" cx="300" cy="300" r="276"></circle>
            <g id="wheelSegments"></g>
            <circle class="wheel-rim" cx="300" cy="300" r="276"></circle>
            <circle class="wheel-center" cx="300" cy="300" r="50"></circle>
            <circle class="wheel-center-dot" cx="300" cy="300" r="9"></circle>
          </g>
          <path class="wheel-pointer" d="M300 9 282 48h36Z"></path>
        </svg>
      </div>
      <p id="wheelMessage" class="wheel-message">等待主播配置转盘</p>
    </main>
    <script src="/js/overlays/wheel.js?v=20260819-01"></script>
  </body>
</html>
