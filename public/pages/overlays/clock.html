<!doctype html>
<html lang="zh-CN" data-clock-style="peach">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>萌时钟</title>
    <link rel="stylesheet" href="/css/overlays/clock.css" />
  </head>
  <body>
    <main class="clock-stage" aria-label="当前日期与时间">
      <article id="clockCard" class="clock-card" data-clock-style="peach" hidden>
        <div class="clock-moon-art" aria-hidden="true">
          <i class="clock-moon-fan"></i>
          <i class="clock-moon-branch"></i>
          <i class="clock-moon-face"></i>
          <i class="clock-moon-jewel"></i>
          <i class="clock-moon-flowers-left"></i>
          <i class="clock-moon-flowers-right"></i>
        </div>
        <div class="clock-sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

        <div class="clock-peach-mascot" aria-hidden="true">
          <i class="peach-ear peach-ear-left"></i>
          <i class="peach-ear peach-ear-right"></i>
          <i class="peach-face"><span></span></i>
          <i class="peach-paw"></i>
        </div>

        <div class="clock-night-mascot" aria-hidden="true">
          <i class="night-moon"></i>
          <i class="night-cloud"><span></span></i>
          <i class="night-star"></i>
        </div>

        <div class="clock-soda-mascot" aria-hidden="true">
          <svg class="soda-duck-art" viewBox="0 0 160 160" fill="none" focusable="false">
            <ellipse cx="83" cy="112" rx="56" ry="17" stroke="#78b7a6" stroke-width="9" />
            <path
              d="M130 82C128 103 113 121 84 124C60 127 41 115 41 99C41 85 49 77 57 73C47 68 41 59 41 48C41 31 53 20 69 20C86 20 98 32 98 48C98 61 91 69 84 74C95 81 108 89 119 85Z"
              fill="#ffe49a"
              stroke="#c59b4d"
              stroke-width="2.25"
              stroke-linejoin="round"
            />
            <path
              d="M43 49C35 48 29 51 24 55C29 61 35 63 44 62Z"
              fill="#efa65b"
              stroke="#ce8c48"
              stroke-width="2"
              stroke-linejoin="round"
            />
            <circle cx="56" cy="44" r="3" fill="#36594d" />
            <circle cx="56.8" cy="43.2" r="0.9" fill="#fffdf3" />
            <ellipse cx="60" cy="60" rx="7" ry="4.5" fill="#f3c17f" />
            <path d="M68 94C75 85 93 87 102 96C98 111 79 116 68 105" fill="#f6d67b" />
            <path d="M68 99C76 110 92 112 102 96" stroke="#c59b4d" stroke-width="2" stroke-linecap="round" />
            <path
              d="M27 112C27 123 52 131 83 131C114 131 139 123 139 112"
              stroke="#78b7a6"
              stroke-width="10"
              stroke-linecap="round"
            />
            <path d="M37 120C44 124 55 126 64 127" stroke="#d7eee2" stroke-width="2.5" stroke-linecap="round" />
          </svg>
          <i class="soda-bubble soda-bubble-one"></i>
          <i class="soda-bubble soda-bubble-two"></i>
        </div>

        <svg class="clock-orbit-art clock-orbit-back" viewBox="0 0 560 190" fill="none" aria-hidden="true" focusable="false">
          <defs>
            <path id="clockOrbitTrack" d="M78 55C22 50 15 78 64 101C158 141 371 157 493 121" />
            <path
              id="clockOrbitStar"
              d="M-5.59-26.41Q0-36 5.59-26.41L8.84-20.81Q11.64-16.02 17.06-14.84L23.39-13.47Q34.24-11.12 26.84-2.85L22.53 1.98Q18.83 6.12 19.39 11.64L20.04 18.08Q21.16 29.12 11 24.65L5.08 22.04Q0 19.8-5.08 22.04L-11 24.65Q-21.16 29.12-20.04 18.08L-19.39 11.64Q-18.83 6.12-22.53 1.98L-26.84-2.85Q-34.24-11.12-23.39-13.47L-17.06-14.84Q-11.64-16.02-8.84-20.81Z"
            />
            <clipPath id="clockOrbitBackClip"><path d="M0 0H560V101H0Z" /></clipPath>
            <clipPath id="clockOrbitFrontClip"><path d="M0 101H560V190H0Z" /></clipPath>
          </defs>
          <use href="#clockOrbitTrack" class="clock-orbit-track" clip-path="url(#clockOrbitBackClip)" />
        </svg>

        <div class="clock-content">
          <div class="clock-kicker-row">
            <span id="clockLabel" class="clock-label">今天也要闪闪发光</span>
            <span id="clockPeriod" class="clock-period" hidden></span>
          </div>
          <div id="clockYear" class="clock-year" hidden>2026</div>
          <time id="clockTime" class="clock-time">
            <span id="clockHours">00</span><span id="clockTimeSeparator" class="clock-colon" aria-hidden="true">:</span
            ><span id="clockMinutes">00</span><span id="clockSeconds" class="clock-seconds">00</span>
          </time>
          <div id="clockDateRow" class="clock-date-row">
            <span id="clockDate">08月23日</span>
            <i id="clockDateSeparator" aria-hidden="true"></i>
            <span id="clockWeekday">星期日</span>
          </div>
        </div>

        <svg class="clock-orbit-art clock-orbit-front" viewBox="0 0 560 190" fill="none" aria-hidden="true" focusable="false">
          <use href="#clockOrbitTrack" class="clock-orbit-track" clip-path="url(#clockOrbitFrontClip)" />
          <g fill="#383a3b" stroke="#f9f9f6" stroke-width="1.6">
            <use href="#clockOrbitStar" transform="translate(510 48) rotate(-20)" />
            <use href="#clockOrbitStar" transform="translate(51 131) rotate(16) scale(.58)" stroke-width="2.3" />
          </g>
          <g fill="#fff">
            <use href="#clockOrbitStar" transform="translate(80 82) rotate(15) scale(.27)" />
            <use href="#clockOrbitStar" transform="translate(493 121) rotate(-12) scale(.28)" />
            <path d="M56 56Q56 64 51 65Q56 66 56 72Q57 66 62 65Q57 64 56 56Z" />
          </g>
        </svg>
      </article>
    </main>
    <script type="module" src="/js/overlays/clock.js"></script>
  </body>
</html>
