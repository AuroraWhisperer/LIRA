<!doctype html>
<html lang="zh-CN" class="opening-disabled">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>开播动画</title>
    <link rel="stylesheet" href="/css/overlays/opening.css" />
  </head>
  <body class="opening-disabled">
    <div class="opening-viewport opening-disabled">
      <main
        id="openingStage"
        class="opening-stage is-disabled"
        data-track-motion="heart"
        aria-labelledby="openingTitle"
      >
        <div class="opening-backdrop" aria-hidden="true">
          <div class="opening-glow"></div>
          <div class="opening-vinyl">
            <span></span><span></span><span></span>
          </div>
          <div class="opening-speckles"></div>
        </div>

        <div
          id="openingParticles"
          class="opening-particles"
          aria-hidden="true"
        ></div>
        <div id="openingEq" class="opening-eq" aria-hidden="true"></div>

        <section class="opening-copy">
          <h1 id="openingTitle">唱一首，在一首，给你的歌</h1>
          <p id="openingSubtitle">开播准备中</p>
          <div class="track" aria-hidden="true">
            <svg
              id="openingTrackSvg"
              class="track-waveform"
              viewBox="0 0 760 120"
              preserveAspectRatio="none"
            >
              <defs>
                <path
                  id="openingTrackPath"
                  pathLength="1"
                  d="M0 61 C18 61 25 38 42 61 S68 84 84 61 110 28 128 61 154 92 172 61 198 39 216 61 242 75 258 61 282 42 298 61 323 86 340 61 364 34 382 61 408 89 426 61 450 44 468 61 494 78 510 61 536 35 552 61 578 89 596 61 621 42 638 61 666 83 682 61 705 39 724 61 742 74 760 61"
                />
              </defs>
              <use class="track-base" href="#openingTrackPath" />
              <use class="track-barber" href="#openingTrackPath" />
              <use class="track-progress" href="#openingTrackPath" />
              <g class="track-heart-motion">
                <animate
                  class="track-heart-visibility"
                  attributeName="opacity"
                  dur="7.2s"
                  repeatCount="indefinite"
                  values=".86;.86;0;0"
                  keyTimes="0;.88;.96;1"
                  calcMode="linear"
                />
                <g class="track-heart-pulse">
                  <path
                    class="track-heart-shape"
                    d="M0 10 C-15 1 -14 -10 -6 -12 C-2 -13 0 -9 0 -7 C0 -9 2 -13 6 -12 C14 -10 15 1 0 10 Z"
                  />
                </g>
                <animateMotion
                  dur="7.2s"
                  repeatCount="indefinite"
                  rotate="0"
                  calcMode="linear"
                >
                  <mpath href="#openingTrackPath" />
                </animateMotion>
              </g>
            </svg>
          </div>
          <p id="openingNameRow" class="opening-name" hidden>
            <span id="openingName"></span>
          </p>
        </section>

        <div class="opening-character" aria-hidden="true">
          <div class="character-anchor">
            <div class="character-enter">
              <div class="character-float">
                <div class="character-sway">
                  <div class="character-breathe">
                    <img
                      id="openingAvatar"
                      class="character-image"
                      hidden
                      alt=""
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div id="openingNotes" class="opening-notes" aria-hidden="true"></div>
        <p id="openingFooter" class="opening-footer">欢迎来到直播间</p>
        <p
          id="openingDebug"
          class="opening-debug"
          role="status"
          aria-live="polite"
          hidden
        ></p>
        <audio id="openingAudio" loop preload="metadata"></audio>
      </main>
    </div>
    <script type="module" src="/js/overlays/opening.js"></script>
  </body>
</html>
