name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    name: Desktop quick checks
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: client
    steps:
      - name: Checkout desktop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: client
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install desktop dependencies
        run: npm ci
      - name: Check documentation, syntax and architecture
        run: npm run verify:quick
      - name: Test contract verifier with isolated fixtures
        run: node --test test/server-contract.test.js

  full:
    name: Pinned client/server checks
    needs: quick
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    timeout-minutes: 20
    # Configure this environment to allow only main. Keep the server read token
    # in the environment, not in repository secrets accessible to branch code.
    environment: server-contract
    env:
      LIRA_SERVER_ROOT: ${{ github.workspace }}/server
    defaults:
      run:
        shell: pwsh
        working-directory: client
    steps:
      - name: Checkout desktop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: client
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Read locked server revision and require access
        id: contract
        env:
          LIRA_SERVER_READ_TOKEN: ${{ secrets.LIRA_SERVER_READ_TOKEN }}
        run: |
          if (-not $env:LIRA_SERVER_READ_TOKEN) {
            throw 'Configure LIRA_SERVER_READ_TOKEN in the main-only server-contract environment, with read-only Contents access to AuroraWhisperer/LIRA-server.'
          }
          $contract = Get-Content -LiteralPath server-contract.lock.json -Raw | ConvertFrom-Json
          if ($contract.repository -ne 'AuroraWhisperer/LIRA-server' -or $contract.revision -cnotmatch '^[0-9a-f]{40}$') {
            throw 'The server contract lock must name AuroraWhisperer/LIRA-server and a full lowercase commit SHA.'
          }
          "revision=$($contract.revision)" >> $env:GITHUB_OUTPUT
      - name: Checkout pinned server
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: AuroraWhisperer/LIRA-server
          ref: ${{ steps.contract.outputs.revision }}
          token: ${{ secrets.LIRA_SERVER_READ_TOKEN }}
          path: server
          persist-credentials: false
      - name: Verify server inputs before installing dependencies
        run: node scripts/verify-server-contract.js --runtime
      - name: Install desktop dependencies
        run: npm ci
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Run desktop verification against pinned server
        run: npm run verify
      - name: Verify real HTTP song roundtrip
        run: npm run verify:roundtrip
